name: flutter3d_app_example
description: "What a project that is not a game starts from: a lit cube in a Flutter3dView, and a digital twin fed by a real REST source, with its history on a tape and a timeline to scrub it."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # Which backend a build draws through, with the software fallback, and the
  # surface a frame reaches Flutter through. Nothing a game needs and nothing
  # a genre decides: those are `flutter3d_game`'s own example.
  flutter3d_app:
    path: ../

  # The renderer and the scene graph.
  flutter3d:
    path: ../../flutter3d

  vector_math: ^2.2.0

  # The twin (`lib/twin_main.dart`): the loop it steps and the readings it
  # is fed, the state of what it models, and the timeline it scrubs.
  flutter3d_sim:
    path: ../../flutter3d_sim
  flutter3d_plugin_api:
    path: ../../flutter3d_plugin_api
  flutter3d_matter:
    path: ../../flutter3d_matter
  flutter3d_game:
    path: ../../flutter3d_game

  # The twin's one real source is a REST endpoint, polled in this example's
  # own code; `http` runs the same on a desktop, a phone and the web.
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # A device that draws nothing, for the twin's screen in a test.
  flutter3d_hardware:
    path: ../../flutter3d_hardware

  # A renderer with no GPU under it, so a test can build the scene the way the
  # application does.
  flutter3d_cpu:
    path: ../../flutter3d_cpu

  flutter_lints: ^6.0.0

# **No platform folders here on purpose**, for the same reason
# `packages/flutter3d_game/example` has none: this exists to be analysed and to
# be copied, and `flutter create --platforms=macos .` in the project it is
# copied into is what gives it a window.
flutter:
  uses-material-design: true
