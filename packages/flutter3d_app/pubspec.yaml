name: flutter3d_app
description: "The layer an application is assembled from, as one import: which backend to open and the runtime fallback, the frame surface and run lifecycle, the screens that are not the game, and the input devices Flutter itself does not cover."
version: 0.7.0
resolution: workspace
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - game-development
  - game-engine
  - application

# A barrel over three sibling packages, plus the backend choice this package
# now makes directly — flutter3d_session, pad_input, pointer_lock were the
# three games' own imports; the backend choice was `flutter3d_backend` until
# most of its consumers turned out to already be reaching it through this
# barrel rather than by name, and the handful that still named it directly
# cost nothing to repoint — which left the separate package with no boundary
# of its own (package-merge-plan.md §3.6). `flutter3d_screens` was folded into
# `flutter3d_session` the same way (§3.7); this barrel still re-exports it
# transitively, so nothing here changed on that account.
# None of the three sibling packages know about each other and none of them
# should start to. This package adds only the backend choice as code of its
# own; it exists so an application's own pubspec and main.dart say "the
# assembly layer" once instead of five names, the way `flutter3d` already says
# "the renderer" once instead of naming `flutter3d_hardware` itself.
#
# What is deliberately not behind it: `flutter3d`, `flutter3d_bridge`,
# `flutter3d_game` and a genre package. Those are content, not assembly, and a
# shooter and a platformer need different ones — a single facade cannot pick a
# genre on an application's behalf.
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The vocabulary the backend choice is made in. Neither backend appears in
  # any signature here — `openDevice` returns a `GraphicsDevice`.
  flutter3d_hardware: ^0.7.0

  # The two implementations the conditional export in `backend_native.dart`/
  # `backend_web.dart` picks between by `dart.library.js_interop`, because the
  # two pull in incompatible worlds — `flutter_gpu` does not compile for the
  # web and `dart:js_interop` does not compile for macOS.
  flutter3d_impeller: ^0.7.0
  flutter3d_webgl: ^0.7.0

  # Two more that are not branches of that export — each is what one half
  # falls back to, or up to, at runtime, because the question each answers is
  # one no `dart.library.*` check can see.
  flutter3d_cpu: ^0.7.0
  flutter3d_webgpu: ^0.7.0

  flutter3d_session: ^0.7.0
  pad_input: ^0.4.0
  pointer_lock: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
