name: flutter3d_app
description: "What any Flutter application on flutter3d is assembled from: which backend to open and the runtime fallback, the surface a frame reaches Flutter through, widgets drawn in the scene, a level loaded into a scene, and storage."
version: 0.7.0
resolution: workspace
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - game-engine
  - rendering
  - application

# **The universal layer.** The modeller, the level editor, the lessons and
# every game stand on it, and nothing here knows what a run, a binding or a
# monster is — that is `flutter3d_game`, which depends on this package. It
# holds what `flutter3d_session` and `flutter3d_bridge` had that any
# application needs: the surface, storage, widgets in the scene and level
# loading. What they had that only a game needs went to `flutter3d_game`.
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The renderer: the `Scene` and `RenderSettings` a surface hands over, and
  # the mesh nodes, lights and probes a level becomes.
  flutter3d: ^0.6.0

  # The vocabulary the backend choice is made in. Neither backend appears in
  # any signature here — `openDevice` returns a `GraphicsDevice`.
  flutter3d_hardware: ^0.7.0

  # The two implementations the conditional export in `backend_native.dart`/
  # `backend_web.dart` picks between by `dart.library.js_interop`, because the
  # two pull in incompatible worlds — `flutter_gpu` does not compile for the
  # web and `dart:js_interop` does not compile for macOS.
  flutter3d_impeller: ^0.7.0
  flutter3d_webgl: ^0.7.0

  # Two more that are not branches of that export — each is what one half
  # falls back to, or up to, at runtime, because the question each answers is
  # one no `dart.library.*` check can see.
  flutter3d_cpu: ^0.7.0
  flutter3d_webgpu: ^0.7.0

  # The level document `LevelLoader` reads, and the collision world it builds.
  # Plain Dart, so an application that loads no level pays a resolve for it
  # and nothing else.
  flutter3d_sim: ^0.6.0

  # The wall clock `FrameClock.tick` reads. Not a `Stopwatch`: this one is
  # what `flutter_test` fakes, so a widget test's `pump` advances the frame
  # clock the way a real frame does.
  clock: ^1.1.1

  # `Vector3`/`Vector2`/`Matrix4` for `WidgetSurface`'s own placement and UV
  # math and for the level loader's geometry.
  vector_math: ^2.2.0

  # `localStorage`, which is where a browser build keeps what a user changed.
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Fake time for `FrameClock.tick`, which reads `package:clock`.
  fake_async: ^1.3.0

  # For `terrain_tiles_test.dart` alone — `gfx-87n`: the terrain material is
  # written in the material language, and `MaterialProgramStage` is what lets
  # the software backend draw one. Not a real dependency: nothing in `lib/`
  # reaches it.
  flutter3d_testing: ^0.6.0
