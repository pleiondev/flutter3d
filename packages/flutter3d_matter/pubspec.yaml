name: flutter3d_matter
description: "What a flutter3d world is made of: its gravity, air and wind, the catalogue of physical materials, and the constants of nature. Plain Dart, with nothing that moves a body."
version: 1.0.0-rc.1
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - physics
  - simulation
  - game-engine
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

# Declared rather than left to pub.dev's detector: plain Dart that reaches
# no `dart:io`, `dart:isolate` or `dart:ffi` from its libraries, so every
# platform, the browser included.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  # The exceptions, `FormatSpec` and `Registration` a material document and
  # the catalogue are written in.
  flutter3d_foundation: ^1.0.0-rc.1
  # `PluginRegistry` and `PluginScope`: the catalogue is a registry a plugin
  # adds its materials to (`host.registry<MaterialCatalog>()`).
  flutter3d_plugin_api: ^1.0.0-rc.1
  vector_math: ^2.2.0

dev_dependencies:
  test: ^1.25.0
  flutter_lints: ^6.0.0

# **A plain Dart package with nothing that steps.** It came out of
# `flutter3d_physics`, where the world's properties and the material
# catalogue sat beside the collision world. The audio, the particles and the
# native core's header generator read them and step no body, so they depend
# on this rather than on the physics.
