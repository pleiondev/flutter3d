name: flame_multiplayer
description: "Two players on two machines for a game: a room with a handshake and separate channels, rollback play in step, turns with a replay for the one watching, and a ghost's latest word in a race."
version: 0.1.0
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - game-development
  - flame
  - networking
  - multiplayer
resolution: workspace

environment:
  sdk: ^3.12.2

dev_dependencies:
  test: ^1.25.0
  flutter_lints: ^6.0.0

# **No dependencies, and apart from any engine.** A game calls these from its
# own fixed step, so the order within a step stays the game's; nothing here
# needs a component tree, a renderer or a socket. The wire to a real network
# is an adapter in the package that owns that network — `flutter3d_net` for
# its relay and WebRTC, `flame_multiplayer_dashwire` for dashwire — so a game
# carries only the one it uses.
