name: flutter3d_hardware
description: "The graphics vocabulary flutter3d is written against: formats, handles, a command encoder and a device. Names no graphics API. No Flutter, no renderer."
version: 0.7.0
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - graphics
  - gpu
  - rendering
  - abstraction
resolution: workspace

# Its own package, and that is the whole point of it. A backend implements this
# and nothing else: `flutter3d_impeller` depends on it, `flutter3d` depends on it,
# and neither depends on the other. Before the split this lived inside the
# engine, so writing a second backend meant depending on the scene graph, the
# asset loaders and the frame graph to get at eight files.
#
# **Flat as of 0.7.0.** It depended on Flutter for one member,
# `GraphicsDevice.present`, which returned the Flutter `Widget` a finished
# frame becomes — the one thing this vocabulary could not describe without
# naming the framework it is otherwise silent about. `present` moved to
# `presentFrame` in `flutter3d_app`, and nothing here names Flutter any more.
environment:
  sdk: ^3.12.2

dependencies:
  vector_math: ^2.4.3

dev_dependencies:
  test: ^1.25.0
  flutter_lints: ^6.0.0
