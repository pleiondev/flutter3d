name: flutter3d_session
description: "What a game on this engine is as an application: the surface a frame is handed to Flutter through, the run being played, and the screens a player uses that are not the game."
version: 0.7.0
resolution: workspace
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - game-development
  - game-engine
  - lifecycle

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The simulation's vocabulary: `Snapshot`, `RunOutcome`, `GameLoop`. Also
  # what `lib/src/screens/` edits: bindings, actions, the settings map.
  flutter3d_game: ^0.6.0

  # The renderer, for `RenderSettings` and `Scene` — which the surface hands over
  # and never interprets.
  flutter3d: ^0.6.0

  # The wall clock `FrameClock.tick` reads. Not a `Stopwatch`: this one is
  # what `flutter_test` fakes, so a widget test's `pump` advances the frame
  # clock the way a real frame does.
  clock: ^1.1.1

  # `Vector3`/`Vector2`/`Matrix4` for `WidgetSurface`'s own placement and UV
  # math (`wg-01`) — `flutter3d` already carries it transitively, but this
  # package's code now names a vector directly rather than only its tests.
  vector_math: ^2.2.0

  # Volumes are a mixer's, and `lib/src/screens/`'s settings panel is where
  # they are turned.
  flutter3d_audio: ^0.6.0

  # For the dead zone's own default, so the panel and the pad cannot disagree
  # about what "unset" means.
  pad_input: ^0.4.0

  # `localStorage`, which is where a browser build keeps what a player changed.
  # Already used by flutter3d_webgl and by the gamepad's web backend.
  web: ^1.1.0

  # State management. The screens here are state machines — a panel that is
  # open, a rebinding that is waiting for a key, a settings document that has
  # been written — and they lived in `setState` inside two applications, which
  # is where a state machine goes to stop being testable. A cubit is reachable
  # from a plain `test()`.
  #
  # The exception to `ARCHITECTURE.md` §11.3, and a narrow one: pure Dart, no FFI,
  # so it does not break the web build — which is what that section's argument
  # is actually about.
  flutter_bloc: ^9.1.1

dev_dependencies:

  flutter_test:
    sdk: flutter

  # A renderer with no GPU under it, so the surface can be mounted and pumped.
  flutter3d_cpu: ^0.7.0
  flutter_lints: ^6.0.0

  # Fake time for `FrameClock.tick`, which reads `package:clock`.
  fake_async: ^1.3.0

  # An external client for `run_timeline_extensions_test.dart` — the same
  # package DevTools and `flutter attach` use to reach a running app's VM
  # service, standing in for the editor this proves the door is open for.
  vm_service: ^15.0.0

  # `@TestOn('vm')` and plain `test()`/`expect()` in
  # `run_timeline_extensions_test.dart` — `flutter_test` re-exports these,
  # but only `package:test` itself resolves `@TestOn`.
  test: ^1.25.0

flutter:
  uses-material-design: true
