name: flutter3d_conformance
description: >-
  The behaviour a flutter3d_hardware backend has to have, as tests it can run
  against itself. Flat: no Flutter import of its own, and flutter3d_shaders
  (its one dependency that used to carry the SDK in) no longer does either.
version: 1.0.0-rc.1
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - graphics
  - gpu
  - testing
  - conformance

environment:
  sdk: ">=3.12.0 <4.0.0"

# Declared rather than left to pub.dev's detector: plain Dart that reaches
# no `dart:io`, `dart:isolate` or `dart:ffi` from its libraries, so every
# platform, the browser included.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  # A test library in `dependencies` rather than `dev_dependencies`, which is
  # deliberate and unusual: this package *is* tests, and the backends that run
  # them take it as a dev dependency of their own.
  test: ^1.25.0
  flutter3d_hardware: ^1.0.0-rc.1
  vector_math: ^2.2.0
  # The list of entry points a bundle must answer to.
  flutter3d_shaders: ^1.0.0-rc.1
  # The plugin suite (`plugins.dart`): what a plugin is written against, and
  # the loop that installs it, switches it and steps it twice. Both plain
  # Dart, so this package stays flat and runs in a browser as before; only
  # a plugin's own suite reaches either.
  flutter3d_plugin_api: ^1.0.0-rc.1
  flutter3d_sim: ^1.0.0-rc.1
  # The material catalogue, whose plugin-declared entries the `materials`
  # check holds to the engine's ranges. Plain Dart too.
  flutter3d_physics: ^1.0.0-rc.1

  # What a world is made of: its properties, the materials and the constants.
  flutter3d_matter: ^1.0.0-rc.1

dev_dependencies:
  flutter_lints: ^6.0.0

resolution: workspace
