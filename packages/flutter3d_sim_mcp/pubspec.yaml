name: flutter3d_sim_mcp
description: "A level an agent can play blind, of whatever game a host hands it: open it, step it with input, read back positions and health in words, and hand over the run it made — ai-00."
version: 0.6.0
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - game-development
  - mcp
  - tooling
  - ai
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  # The simulation every game steps through, and `HeadlessGame`/`HeadlessRun`
  # — what this server asks of a game. No genre: a host hands one in.
  flutter3d_sim: ^0.6.0

  # The picture half of `frame`: `flutter3d_render_mcp`'s `DiagnosticRenderer`
  # in its ordinary view, rather than a second copy of how a level is loaded
  # and drawn with no GPU.
  flutter3d_render_mcp: ^0.6.0

  # The tool table, the answers and the server underneath this one — what
  # every server here shares.
  flutter3d_mcp_kit: ^0.6.0

  vector_math: ^2.2.0

  dart_mcp: ">=0.5.2 <0.6.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # `@TestOn('vm')` and a plain `test()` — `test/sim_mcp_test.dart` and
  # `test/fixtures/sim_mcp_server.dart`'s own launcher spawn a real
  # subprocess and open a real socket, neither of which exists on the web,
  # and `flutter_test`'s own re-export is not enough to name that
  # dependency directly.
  test: ^1.25.0

  # The game the suite plays: the shipped crypt, as `ShooterHeadlessGame`. A
  # dev dependency, because composing a game with this server is a host's
  # decision and the suite is the host here.
  flutter3d_game_shooter: ^0.7.0

  # `WidgetSurfaceKind` — the shipped crypt names a `widget_surface` entity
  # (`wg-02`'s own terminal), and `ShooterHeadlessGame`'s own vocabulary does
  # not know the word without a host handing it in, the same way
  # `flutter3d_demo_dungeon`'s `main.dart` does for the real app.
  flutter3d_bridge: ^0.6.0

# **Why this package needs Flutter, unlike `flutter3d_editor_mcp` and
# `flutter3d_model_mcp`.** `frame` draws the level, and the renderer it draws
# with (`flutter3d_cpu`, under `flutter3d_render_mcp`) needs `dart:ui`, which
# does not compile under plain `dart run` — checked empirically, the same way
# `rp-05` found it out for genre packages generally.
#
# **And why that rules out literal stdio.** A process with Flutter behind it
# has no `bin/` this workspace's own `dart run flutter3d_sim_mcp:...` could
# start — it has to run inside `flutter test`, the way `rp-02`'s
# `timeline_target.dart` does, and `flutter test` turns everything a test
# writes to `stdout` into a line prefixed `Shell: ` before a real terminal
# ever sees it. A wire protocol keyed on exact line framing cannot survive
# that prefix. This server therefore speaks the same newline-delimited JSON
# `dart_mcp`'s own `stdioChannel` uses, over a plain TCP socket instead of
# real stdio — `stdioChannel` takes any `Stream<List<int>>`/
# `StreamSink<List<int>>` pair, and a `Socket` already is both.
