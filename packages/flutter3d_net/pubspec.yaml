name: flutter3d_net
description: "The network core over `sim`: one peer wire, rooms and rollback for two machines or a party, the relay's WebSocket transport, and parties found by code."
version: 1.0.0-rc.1
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - game-development
  - game-engine
  - networking
  - multiplayer
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

# Declared rather than left to pub.dev's detector: plain Dart that reaches
# no `dart:io`, `dart:isolate` or `dart:ffi` from its libraries, so every
# platform, the browser included.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  # `Registration`, which `PeerWire.listen` hands back, and the
  # `SimulationVersion` a hello carries whole.
  flutter3d_plugin_api: ^1.0.0-rc.1

  # `Snapshot`, `GameRandom` for the test transport's loss, nothing that
  # draws or reads a device — the same reason `net-01`'s own row gives for
  # sitting on this package and not on `flutter3d_game`.
  flutter3d_sim: ^1.0.0-rc.1

  # `WebSocketTransport` — net-02's fallback transport, and the one client
  # class in this package that has to compile for the web as well as
  # native, which `dart:io`'s own `WebSocket` cannot.
  web_socket_channel: ^3.0.0

dev_dependencies:
  test: ^1.25.0
  flutter_lints: ^6.0.0

# **A plain Dart package, same reasoning as `flutter3d_physics`.** A relay and
# a WebRTC signalling client are both ordinary Dart processes or ordinary
# Flutter widgets reaching into this — neither needs the Flutter SDK to ask
# "did this step's remote input arrive, and if not, what do I predict" — and a
# rollback engine that required one would be untestable under plain `dart
# test`, the same loss `flutter3d_sim` itself was carved out to avoid.
