name: flutter3d_plugin_runtime
description: "Plugins loaded while a game runs: data plugins read from a .f3dplugin document, and sandboxed Wasm modules on a deterministic interpreter, held to the permissions granted."
version: 1.0.0-rc.1
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - game-development
  - game-engine
  - plugins
  - webassembly
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

# Declared rather than left to pub.dev's detector: plain Dart that reaches no
# `dart:io`, `dart:isolate` or `dart:ffi` from its libraries. The browser's
# own WebAssembly is reached through `dart:js_interop` behind a conditional
# import, and the interpreter every other platform uses is plain Dart.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  # What a run-time plugin is: a `Flutter3dPlugin` with a manifest, installed
  # through the same host as a compiled one.
  flutter3d_plugin_api: ^1.0.0-rc.1

  # Nothing else of the engine's. No subsystem's section is read here:
  # `entityKinds` (flutter3d_sim), `materials` and `renderSteps`
  # (flutter3d_core), `effects` (flutter3d_particles) and
  # `physicalMaterials` (flutter3d_matter) are read by the packages that own
  # them, through the plugin API's `DataSectionRegistry`. A server that
  # replays a run with a data plugin in it resolves this package without the
  # render core, the simulation or the physics.

dev_dependencies:
  test: ^1.25.0
  flutter_lints: ^6.0.0
  # The engine the tests install plugins into (`EngineLoop`), and the
  # sections they read a document with: `entityKinds` from the simulation,
  # `materials` and `renderSteps` from the core, `effects` from the
  # particles, `physicalMaterials` and `materialPairs` from the matter.
  flutter3d_sim: ^1.0.0-rc.1
  flutter3d_core: ^1.0.0-rc.1
  flutter3d_physics: ^1.0.0-rc.1
  flutter3d_particles: ^1.0.0-rc.1
  flutter3d_matter: ^1.0.0-rc.1

  # The foundation's value types and their crossings into `vector_math`.
  flutter3d_foundation: ^1.0.0-rc.1

# **A plain Dart package.** A Wasm module that touches the simulation is
# replayed on a server with the rest of the run, so the interpreter that
# steps it has to resolve in a container with no Flutter SDK in it.
