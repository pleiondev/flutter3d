name: flutter3d_webgpu
description: "A WebGPU backend for flutter3d: the fourth implementation of flutter3d_hardware, and the first one whose API bakes per-draw state into the pipeline object."
version: 1.0.0-rc.1
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - webgpu
  - graphics
  - gpu
  - rendering
  - web
resolution: workspace

# The HAL and nothing else of ours, for the reason `flutter3d_webgl` states:
# writing a backend means implementing `flutter3d_hardware`, not understanding
# the renderer. That property is what let a spike measure this API's cost to the
# contract before a package existed to hold the answer.
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: '>=3.44.0'

# Declared rather than left to pub.dev's detector: WebGPU through
# `dart:js_interop`, so the browser and nothing else.
platforms:
  web:

dependencies:
  flutter:
    sdk: flutter

  flutter3d_hardware: ^1.0.0-rc.1

  # `ResourceException`, which `GpuDeviceException` extends.
  flutter3d_foundation: ^1.0.0-rc.1

  # Declared before it is imported, which is deliberate. `PassEncoder` takes a
  # clear colour and a scissor as `Vector4`, so the encoder cannot be written
  # without this — and the encoder is the next thing written here. Adding it
  # then would mean three parallel branches each editing this file, which is the
  # merge this package was created early to avoid.
  vector_math: ^2.2.0

  # `stageBindings`: what each of the engine's compiled stages keeps, which
  # the library hands every stage as `ShaderHandle.kept` and the encoder
  # refuses binds against — `gfx-92n`. A table of names and nothing else.
  flutter3d_shaders: ^1.0.0-rc.1

dev_dependencies:
  # For `compareFrames` alone, in `cross_backend_test.dart`, which measures this
  # backend's committed reference set against Impeller's. The WebGL2 package
  # reaches for it the same way and for the same one function: a dev dependency
  # and not a real one, since nothing in `lib/` touches it and two backends that
  # depended on each other at run time would not be two backends.
  flutter3d_cpu: ^1.0.0-rc.1
  # The behaviour flutter3d_hardware requires, as tests this backend runs
  # against itself — in Chrome, against a live device. See
  # flutter3d_conformance, and `test/conformance_test.dart` for what this
  # backend declines and why.
  flutter3d_conformance: ^1.0.0-rc.1
  # The material language's emitter — `gfx-84n`. For
  # `material_language_generators_test.dart` alone: a material written as
  # source has to reach both generators, and this is the one package that has
  # both. Not a real dependency — nothing in `lib/` reaches it.
  flutter3d_core: ^1.0.0-rc.1
  # For `reflection_probe_test.dart` alone, which drives the real Renderer
  # through this backend so that a reflection probe is checked as a picture
  # rather than as a capability. The sibling WebGL2 package reaches for the
  # engine the same way and for the same reason: `supportsRenderToMip` is a
  # promise about what a probe does, and only the engine can be asked whether
  # the promise held. A dev dependency, so nothing a consumer builds picks up
  # the engine because the backend was installed.
  flutter3d: ^1.0.0-rc.1
  # For `runtime_material_test.dart` alone: `RuntimeShaders` splices a
  # material loaded at run time into this package's `Unlit` stage, and the
  # test hands naga the result. Nothing in `lib/` reaches it.
  flutter3d_plugin_runtime: ^1.0.0-rc.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
