name: flutter3d
description: "A 3D engine on Flutter GPU: scene graph, glTF/OBJ/.f3d loading, PBR, shadows, bloom, skinning."
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The low-level graphics API. It lives in bin/cache/pkg/flutter_gpu.
  flutter_gpu:
    sdk: flutter

  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# A note on `shaders/`, which is deliberately NOT listed under `flutter.assets`
# below.
#
# `shaders/lib/*.glsl` are build-time inputs for an extension package: its
# materials write `#include <lib/color.glsl>`, and impellerc satisfies that from
# `<flutter3d>/shaders` as an include root. So they have to reach a consumer that
# installed flutter3d from pub — but as *files in the package directory*, not as
# Flutter assets. Declaring them as assets would copy GLSL source text into every
# shipping application's bundle, where nothing would ever read it: by the time
# the app runs, the only artefact that matters is the compiled .shaderbundle.
#
# Nothing extra is needed to ship them. `pub publish` uploads every file in the
# package that git tracks and .gitignore does not exclude, and `shaders/` is
# checked in — confirmed against `flutter pub publish --dry-run`, which lists
# shaders/lib/{color,material_maps,shadow,surface}.glsl. The only way to lose
# them is to add an exclusion; test/shader_include_test.dart is the guard.
flutter:
  assets:
    # Built by tool/build_shaders.sh through impellerc. Generated, so it is not
    # in the repository — a checkout has to run the script before the first run,
    # and again after every SDK change, because the bundle format is tied to the
    # Flutter version.
    - assets/shaders/flutter3d.shaderbundle

    # The official Khronos test models (glTF-Sample-Assets), which the decoders
    # are verified against and the example browses.
    #
    # Declared by this package rather than by the example, because the tests
    # read them from disk and moving them would split one set of fixtures in
    # two. The cost is that an application depending on flutter3d bundles them
    # as well; worth revisiting when the game's bundle size starts to matter.
    - assets/samples/
    - assets/samples/cube/
    - assets/samples/animated_cube/
    - assets/samples/f3d/
    - assets/samples/simple_skin/
