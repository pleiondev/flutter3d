name: flutter3d
description: "A 3D engine on Flutter GPU: scene graph, glTF/OBJ/.f3d loading, PBR, shadows, bloom, skinning."
version: 0.6.0
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - graphics
  - game-engine
  - rendering
  - gpu
  - flutter-gpu
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The rendering core this package is a thin Flutter shell over (mcp-03n):
  # the scene graph, the render graph, animation, and everything in the asset
  # layer that resolves without the Flutter SDK. `BundleAssetSource`,
  # `assetUriResolver`, `defaultImageDecoder`, `ModelAsset` and
  # `bindMaterial`/`loadMaterial` are what stayed, each because a default
  # value or a Flutter type has to be declared somewhere that can name one.
  flutter3d_core: ^0.1.0

  # The graphics vocabulary this package is written against. **Not** a
  # backend: `flutter3d` names no graphics API at all, which is what lets an
  # application choose one — `flutter3d_impeller` today — and what would let a WebGL
  # backend exist without touching the engine.
  flutter3d_hardware: ^0.7.0

  # The geometry this package is written in — `MeshData`, `VertexLayout`, the
  # shape generators, tangents, morph targets and `Ray`. A package rather than
  # a directory here because `flutter: sdk` above is what a modeller's document
  # layer, an agent's tool and an AOT bench cannot resolve; `flutter3d.dart`
  # exports it whole, so nothing above this line knows it moved.
  flutter3d_geometry: ^0.6.0

  # The formats it reads and writes — `ModelDocument`, the glTF/OBJ/`.f3d`
  # decoders and the materials they name. Out here for the same reason geometry
  # is: a tool an agent starts with `dart run` reads a model and cannot resolve
  # the Flutter SDK this pubspec declares. What is left in this package is the
  # isolate, the asset bundle and everything that names a device.
  flutter3d_formats: ^0.6.0

  vector_math: ^2.2.0

  # `bin/convert.dart` — `ap-03`'s thin wrapper needs the real converter
  # resolvable, and a `dev_dependency` would not be: a consumer running
  # `dart run flutter3d:convert` is not working inside this repository, so
  # only a regular dependency travels with the published archive.
  flutter3d_build: ^0.6.0

dev_dependencies:

  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # The Khronos test models, which every decoder test reads from disk. A dev
  # dependency and not a real one: an application that draws a scene needs the
  # decoders and not the fixtures they were checked with.
  flutter3d_samples: ^0.4.2

  # The one direction this dependency can run in: `flutter3d_cpu` depends on
  # `flutter3d_hardware`, never on this package, so the tests that draw a real
  # frame through the software rasteriser and hold it against the numbers
  # pinned elsewhere in this suite live here instead, dev-depending on the
  # backend rather than the reverse (mcp-02n, once `flutter3d_cpu` could no
  # longer carry a test naming the Flutter SDK-dependent engine).
  flutter3d_cpu: ^0.7.0
  # `pro-sc-01`'s own benchmark alone: an `EditMesh` big enough to sculpt is
  # built here and uploaded through `flutter3d_cpu`. Not a real dependency —
  # nothing in `lib/` reaches it.
  flutter3d_mesh: ^0.6.0

# **This package declares no assets, and that is a decision worth the paragraph.**
#
# Two things used to be here. The shader bundle went first: it is `impellerc`
# output, an artefact only one backend can read, so it ships with that backend
# in `flutter3d_impeller`, and this package names the shaders it wants by entry
# point (see `LightingModel.shaderName`).
#
# The Khronos sample models went second, into `flutter3d_samples`. Declared here
# they were 4.1 MB in every application that depended on the engine — a third of
# the asset payload of the shooter's web build, none of it ever loaded — and
# four fifths of this package's own published archive. The tests still read them
# from disk and the example still browses them; both now say which package they
# are asking.
