name: flutter3d_screens
description: "Compatibility shim: this package's own code moved to flutter3d_session by the package-merge plan. Import that package directly in new code."
version: 0.6.0
resolution: workspace
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - ui
  - game-development
  - settings
  - widgets

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Everything this package used to hold is one export away, in the package
  # its code actually moved to.
  flutter3d_session: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
