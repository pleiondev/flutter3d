name: chemlab
description: "A virtual chemistry bench on flutter3d: glassware turned from profiles, labels typeset in TeX and wrapped on without a decal, and liquid you can pour."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter3d:
    path: ../../flutter3d
  flutter3d_app:
    path: ../../flutter3d_app
  # The liquids: what is in each glass, how it moves, pours and mixes.
  flutter3d_physics:
    path: ../../flutter3d_physics
  # The physics core the liquids step on — their waves, streams and drops —
  # and the Dart reference where it will not start: see `preparePhysics` in
  # `main`.
  flutter3d_physics_native:
    path: ../../flutter3d_physics_native
  # TeX in pure Dart, for the formulas on the labels: K_2Cr_2O_7 set with
  # real subscripts instead of drawn by hand.
  flutter_math_fork: ^0.7.4
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # A software device, for a bench built without a window.
  flutter3d_cpu:
    path: ../../flutter3d_cpu
  # A frame drawn with no GPU, for the picture this example is tested by.
  flutter3d_testing:
    path: ../../flutter3d_testing
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
