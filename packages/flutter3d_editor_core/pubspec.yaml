name: flutter3d_editor_core
description: "The headless half of a level editor: a document you can nudge, undo and write back, the handles a pointer hits, and the project a template turns into."
version: 1.0.0-rc.1
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - game-development
  - level-editor
  - game-engine
  - tooling
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

# Declared rather than left to pub.dev's detector: plain Dart that reaches
# no `dart:io`, `dart:isolate` or `dart:ffi` from its libraries, so every
# platform, the browser included.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  # The document and everything it is made of: `Level`, `Brush`, `LevelLight`,
  # `EntityDef`, `EntityRegistry`, `LevelValidator`, `LevelIssue`. All of it is
  # plain Dart already, which is why this package could follow it out of the
  # application without leaving anything behind.
  flutter3d_sim: ^1.0.0-rc.1

  # `MaterialDocument`/`MaterialHint`, `readFmat`/`writeFmat` and
  # `builtInMaterialHints` — what `material_edit.dart`'s own gate is written
  # against — `flutter3d_core`'s formats library. Itself a plain Dart package,
  # so this one stays off the Flutter SDK adding it.
  flutter3d_core: ^1.0.0-rc.1

  # What the light optimizer draws with (`light_opt/`): the software
  # rasteriser, whose floats are the linear light a lighting decision is made
  # in. Plain Dart like everything else here, so the boundary below holds.
  flutter3d_cpu: ^1.0.0-rc.1

  # `LevelScene`, which the light optimizer builds the level it draws with.
  # It was this package's own until 1.0.0-rc.1; the application loads levels
  # through it too, and depends on it rather than on the editor.
  flutter3d_level_scene: ^1.0.0-rc.1

  vector_math: ^2.2.0

  # The plugin scope `EditorPieces`' registrations are tracked by (the slot
  # it fills, `EditorRegistry`, is declared here). Only the foundation
  # beneath it and no Flutter, so the boundary below holds.
  flutter3d_plugin_api: ^1.0.0-rc.1

  # The foundation's value types and their crossings into `vector_math`.
  flutter3d_foundation: ^1.0.0-rc.1

  # The collision world and its bodies, named here directly.
  flutter3d_physics: ^1.0.0-rc.1

dev_dependencies:
  test: ^1.25.0
  flutter_lints: ^6.0.0

# **A plain Dart package, and what it may not import is the point.**
#
# The editor's document layer sat in `apps/flutter3d_editor/lib/src` for as long
# as the editor was the only thing that wanted it. Then anything else that wants
# it — a command-line level linter, a tool that speaks to an agent, a service
# that validates an uploaded level before it reaches a player — had to depend on
# an application, which `tool/structure.dart` forbids and pub cannot express.
#
# Nine files of that directory named Flutter nowhere at all. Eight of them are
# here; `fly_camera.dart` stayed because it reaches the renderer for a camera,
# and `documents.dart` stayed because reading a file off a disk is the one thing
# a headless core has no business doing.
#
# The boundary is checked rather than described: `the simulation names no
# Flutter` in `tool/structure.dart` reads a list of plain Dart packages, this one
# among them, and fails on the first import that would put a Flutter SDK back in
# front of a program that only wants to open a level. It keeps the name it was
# published under, from the day the simulation was the only package on the list.
#
# `material_edit.dart` moved in once `flutter3d_formats` gave it a plain-Dart
# `MaterialDocument` to depend on — the first thing here that is not about a
# level at all, and the reason this package's own dependency on `flutter3d`'s
# publishing tier shifted (see ARCHITECTURE.md §16, rel-03).
