name: flame_multiplayer_dashwire
description: "A dashwire connection as a flame_multiplayer wire: rooms, rollback play, turns and ghosts over dashwire's WebSocket, loopback or simulated network, reliable and unreliable delivery kept apart."
version: 0.2.0
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - game-development
  - flame
  - networking
  - multiplayer
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

# Declared rather than left to pub.dev's detector: plain Dart that reaches
# no `dart:io`, `dart:isolate` or `dart:ffi` from its libraries, so every
# platform, the browser included.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  # The four modes and the wire they ask for.
  flame_multiplayer: ^0.3.0

  # The connection: `WireConnection` with its reliable and unreliable
  # channels, a WebSocket for native and the web, a loopback, and a network
  # simulator with latency, jitter, loss and duplication.
  dashwire: ^0.1.0

dev_dependencies:
  test: ^1.25.0
  flutter_lints: ^6.0.0

  # The plugin contract: the loop's phases, the bus and the host.
  flutter3d_plugin_api: ^1.0.0-rc.1

# **An adapter, and a package of its own,** so `flame_multiplayer` stays
# without dependencies and a game that talks through `flutter3d_net`'s relay
# does not carry dashwire as well.
