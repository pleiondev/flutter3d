  - id: kinds-Lamp-glow
    package: flutter3d_kinds
    symbol: Lamp.glow
    kind: argument
    arguments: [glow]
    types: [Vector4]
    template: 'LinearColor.fromSrgb({components})'
    imports: [package:flutter3d_kinds/flutter3d_kinds.dart]
    guidance: >-
      `glow` is a `LinearColor` assigned whole: `Vector4(r, g, b, a)` is
      `LinearColor.fromSrgb(r, g, b, a)`, and `.x` is `.r`.
