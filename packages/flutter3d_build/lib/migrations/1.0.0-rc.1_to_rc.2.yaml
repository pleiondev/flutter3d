  # What an outside author mixes in is a base mixin class: a member it gains
  # in a minor arrives with a body and breaks nobody.

  - id: flame-Drawn3d-mixin
    package: flame_flutter3d
    symbol: Drawn3d
    kind: implementsToWith
    guidance: >-
      `Drawn3d` is a base mixin class: write `with Drawn3d` where a component
      wrote `implements Drawn3d`, and keep its `tint`; `drawnBounds3d` has a
      body now (nothing drawn) and may be left out.

  - id: flame-Bridged3d-mixin
    package: flame_flutter3d
    symbol: Bridged3d
    kind: implementsToWith
    guidance: >-
      `Bridged3d` is a base mixin class: write `with Bridged3d` where a
      component wrote `implements Bridged3d`. `elevation`, `space` and
      `drawnBounds3d` have bodies now; `plane` and `tint` are still the
      component's to say.

  - id: flame-StepFollower-mixin
