  # The engine's own render names carry `f3d.`, as every plugin's carries
  # its namespace.

  - id: core-FrameResourceIds-f3d
    package: flutter3d_core
    symbol: FrameResourceIds
    kind: none
    reason: >-
      Each frame resource is named `f3d.<name>` (`f3d.scene_color`,
      `f3d.hdr_color`); code that reads it through the constant is
      unchanged. Code that compared the name with a string uses the new
      word.

  - id: core-EnvironmentDepthNode-id-f3d
    package: flutter3d_core
    symbol: EnvironmentDepthNode.id
    kind: none
    reason: >-
      The environment depth is the resource `f3d.environment_depth`; code
      that reads it through the constant is unchanged.

  - id: core-RenderStep-f3d
    package: flutter3d_core
    symbol: RenderStep
    kind: none
    reason: >-
      Each built-in step is named `f3d.<name>` (`f3d.bloom`,
      `f3d.color_grade`). `RendererSteps.named` still finds one by its old
      word, and a pass keeps its name; code that compared a step's name
      with a string uses the new word.

  - id: core-pipelineVersion-2
    package: flutter3d_core
    symbol: pipelineVersion
    kind: none
    reason: >-
      `f3d.pipeline` is version 2, which writes the engine's anchors,
      resources and steps as `f3d.<name>`; a version 1 file reads, its
      words renamed. Code that compared a document's version with this
      constant reads the newer number.

  - id: plugin_api-RenderAnchor-f3d
    package: flutter3d_plugin_api
    symbol: RenderAnchor
    kind: none
    reason: >-
      Each engine anchor is named `f3d.<name>` (`f3d.after_bloom` where it
      was `after bloom`); `RenderAnchor.named` still finds one by its old
      word. Code that compared an anchor's name with a string uses the new
      word.

  - id: post-skyStep-namespace
    package: flutter3d_post
    symbol: skyStep
    kind: none
    reason: >-
      The sky step is named `flutter3d_post.sky`, in the package's
      namespace; code that holds the constant is unchanged.

  - id: post-outlinesStep-namespace
    package: flutter3d_post
    symbol: outlinesStep
    kind: none
    reason: >-
      The outlines step is named `flutter3d_post.outlines`, in the
      package's namespace; code that holds the constant is unchanged.

  - id: core-LightingModels-named-name
    package: flutter3d_core
    symbol: LightingModels.named
