      The sky's colours are `LinearColor`s: `zenith`, `horizon`, `nadir`,
      `sunColor` and `tint`, in the constructor, in `copyWith` and from the
      `resolved*` getters. The numbers mean what they did (linear,
      scene-referred), so `Vector3(0.1, 0.2, 0.5)` becomes
      `LinearColor(0.1, 0.2, 0.5)`, or `vector.toLinearColor()`; read
      `.r`, `.g`, `.b` where you read `.x`, `.y`, `.z`. `directionToSun`
      stays a `Vector3`, and `sample` still answers one.

