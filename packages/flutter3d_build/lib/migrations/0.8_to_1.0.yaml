      vector to fill.

  - id: sim-EcsWorld-query
    package: flutter3d_sim
    symbol: EcsWorld.query
    kind: manual
    wave: 3
    guidance: >-
      `query()` is the query builder now (`world.query().having<A>()
      .without<B>().entities`, in index order). The type-parameter form that
      walked one component's entities in the order they were added is
      `queryOf<A>()`.

  - id: net-NetSession
    package: flutter3d_net
    symbol: NetSession
    kind: manual
    wave: 3
    guidance: >-
      `NetSession` is gone: the one rollback is `flutter3d_net`'s
      `RollbackSession`. Hand it the wire, this
      machine's `localSlot`, and an `applyAndStep` that reads every slot's
      frame by slot (`frames[0]`, `frames[1]`) where it read `local` and
      `remote`; `onSettled` gains the frames. Over an `EngineLoop`, use
      `EngineRollback`, which saves and restores through the loop's
      snapshots.

  - id: net-NetTransport
    package: flutter3d_net
    symbol: NetTransport
    kind: manual
    wave: 3
    guidance: >-
      `NetTransport` is gone: every transport is a `PeerWire`, which a
      transport `extends`. `send` gains `{bool reliable = true}`.

  - id: net-NetTransportWire
    package: flutter3d_net
    symbol: NetTransportWire
    kind: manual
    wave: 3
    guidance: >-
      Not needed any more: a transport is a `PeerWire` already. Pass the
      transport itself.

  - id: net-LoopbackTransport
    package: flutter3d_net
    symbol: LoopbackTransport
    kind: manual
    wave: 3
    guidance: >-
      Use `LoopbackWire.pair(delaySteps:, lossRate:, seed:)`, whose delay is
      in steps: `(delaySeconds * stepsPerSecond).round()`. Its ends are slots
      nought and one.

  - id: flame_multiplayer-PeerWire
    package: flame_multiplayer
    symbol: PeerWire
    kind: manual
    match: subtypes
    wave: 3
    guidance: >-
      `PeerWire` is an `abstract base class`: an adapter `extends PeerWire`
      and keeps its `send` and `listen`. `slot`, `state`, `listenFrom` and
      `close` have defaults; override `close` and `state` for a connection
      that has them.

  - id: flame_multiplayer-RollbackSession
    package: flame_multiplayer
    symbol: RollbackSession
    kind: manual
    wave: 3
    guidance: >-
      `RollbackSession` is the one rollback, for two to thirty-two machines:
      it takes `localSlot` (the wire's `slot` by default) and `players`, its
      `applyAndStep` receives every slot's frame by slot, and `onSettled`
      also receives the frames.

  - id: flame_multiplayer-RollbackPlay
    package: flame_multiplayer
    symbol: RollbackPlay
    kind: manual
    wave: 3
    guidance: >-
      Use `RollbackSession` with `localSlot`, `inputDelay: 3` and
      `maxRollbackFrames: 20` (`RollbackPlay`'s defaults);
      `captureLocalFrame` is `capture`, `applyAndStep` reads
      `frames[0]`/`frames[1]` where it read `bySlot`, and `endsAt`,
      `agreedEnd` and `connected` are on the session.

