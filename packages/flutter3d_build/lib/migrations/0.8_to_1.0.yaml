  - id: f2-core-gatherProbe-sky
    package: flutter3d_core
    symbol: gatherProbe
    kind: manual
    guidance: >-
      `sky:` is a linear `LinearColor`; see `f2-core-gather-sky`.

  - id: f2-core-Photometric-toEngine
    package: flutter3d_core
    symbol: Photometric.toEngine
    kind: manual
    guidance: >-
      The renderer's own light scale is not API since 1.0: everything takes
      lux, candela or nits and the renderer converts. To carry a pre-1.0
      number over, multiply it by `Photometric.legacyUnit` (lights, ambient,
      the sky's sun) or `Photometric.legacyNits` (emissive strength).

  - id: f2-core-PhysicalCamera-nitsPerUnit
    package: flutter3d_core
    symbol: PhysicalCamera.nitsPerUnit
    kind: rewrite
    template: 'Photometric.legacyNits'
