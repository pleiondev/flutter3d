  # F4 of tasks/1.0-arch-review.md: the audio packages report in the
  # engine's one `Issue` type, `openSpeakers` throws instead of answering
  # null, `Speakers` is the one shape of an opened device, and the Flame
  # component's teardown is `dispose`.

  - id: f4-audio-AudioIssue
    package: flutter3d_audio
    symbol: AudioIssue
    kind: rename
    to: Issue
    guidance: >-
      `AudioIssue` is `Issue`, the type `flutter3d_app` reports in, now
      declared in `flutter3d_foundation` and exported by `flutter3d_audio`
      and `flutter3d_app` alike, with the same `message`.

  - id: f4-audio-AudioIssueSink
    package: flutter3d_audio
    symbol: AudioIssueSink
    kind: rename
    to: IssueSink
    guidance: >-
      `AudioIssueSink` is `IssueSink`, `void Function(Issue issue)`.

  - id: f4-audio-SoLoudBackend
    package: flutter3d_audio
    symbol: SoLoudBackend
    kind: none
    reason: >-
      `onIssue` is an `IssueSink` where it was an `AudioIssueSink`; the two
      renames above carry every caller, and a sink written as a closure
      needs no change.

  - id: f4-audio-openSpeakers
    package: flutter3d_audio
    symbol: openSpeakers
    kind: manual
    guidance: >-
      `openSpeakers` answers `Future<Speakers>` and throws
      `AudioDeviceException` when no audio device opens, where it answered
      null. Wrap the call in `try { ... } on AudioDeviceException { ... }`
      and play silent in the `on` branch; drop the `== null` check, and
      declare what you read it into as `Speakers`. `onIssue` takes an
      `IssueSink`.

  - id: f4-audio-Speakers
    package: flutter3d_audio
    symbol: Speakers
    kind: manual
    members: [backend]
    guidance: >-
      `Speakers.backend` is an `AudioBackend`, not a `SoLoudBackend`.
      Declare what you read it into as `AudioBackend`; `speakers.pause()`,
      `resume()` and `dispose()` are on `Speakers` itself. Code that needs
      the SoLoud class's own members (`failedAssets`) casts with
      `as SoLoudBackend`.

  - id: f4-audio-OpenedSpeakers
    package: flame_flutter3d_audio
    symbol: OpenedSpeakers
    kind: manual
    guidance: >-
      The `OpenedSpeakers` record is gone: `AudioSceneComponent.opener` is
      a `Future<Speakers> Function()`. An opener that made the record
      `(scene: scene, close: close)` returns `Speakers(backend: backend,
      scene: scene)`, and one that answered null for no device throws
      `AudioDeviceException`.

  - id: f4-audio-AudioSceneComponent-close
    package: flame_flutter3d_audio
    symbol: AudioSceneComponent.close
    kind: rename
    to: dispose
    guidance: >-
      `close` is `dispose`, the one teardown verb. It stops every sound and
      disposes the speakers, as `close` did, and an `open` after it does
      nothing: a game that wants its sound again adds a new
      `AudioSceneComponent`.

