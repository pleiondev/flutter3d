  - id: c-webgl-WebGlSectionSources
    package: flutter3d_webgl
    symbol: WebGlSectionSources
    kind: moved
    to: package:flutter3d_shaders/translate.dart
    wave: 5
    guidance: >-
      The `webgl` section of a loadable bundle is `flutter3d_shaders`'
      `translate.dart`, where a build hook with no Flutter SDK writes one,
      and `flutter3d_webgl` no longer re-exports it.

  - id: c-webgl-decodeWebGlSection
    package: flutter3d_webgl
    symbol: decodeWebGlSection
    kind: moved
    to: package:flutter3d_shaders/translate.dart
    wave: 5

  - id: c-webgl-encodeWebGlSection
    package: flutter3d_webgl
    symbol: encodeWebGlSection
    kind: moved
    to: package:flutter3d_shaders/translate.dart
    wave: 5

  - id: build-convert-confined
    package: flutter3d_build
    symbol: fileUriResolverFor
    kind: manual
    guidance: >-
      A converted document reads only files inside its own directory (for
      `convertFiles`, inside the upload): a buffer, texture, `mtllib` or USD
      reference that climbs out with `..` or is absolute is refused. Move the
      files it names under the model's directory, or pass `root:`.

  - id: flutter3d-BundleAssetSource-missing
    package: flutter3d
    symbol: BundleAssetSource
    kind: manual
    guidance: >-
      A key the asset bundle does not hold throws `AssetNotFoundException` (a
      `Flutter3dException`) naming the key, where it threw the platform's
      `FlutterError`. Catch `AssetNotFoundException`, or the root, instead.

  - id: flutter3d-loadModelAsset-missing
    package: flutter3d
    symbol: loadModelAsset
    kind: manual
    guidance: >-
      A release build missing the converted `.f3d` throws
      `AssetNotFoundException` with the generated path as its `key`, where it
      threw `StateError`. Catch `AssetNotFoundException` instead.

  - id: mcp_kit-LoopbackMcpServer-token
    package: flutter3d_mcp_kit
    symbol: LoopbackMcpServer
    kind: none
    reason: >-
      Every signature is as it was. A request presents its token as
      `Authorization: Bearer <token>` only; one sent as `?token=` is answered
      401, and a body over 64 MiB is answered 413.

  - id: model_mcp-ModelSession-root
    package: flutter3d_model_mcp
    symbol: ModelSession
    kind: none
    reason: >-
      The constructor gained an optional `root:`. The MCP tools `save`,
      `export`, `import` and `journal` refuse a path outside the project
      around the session's file (the working directory with none).

  - id: editor_mcp-EditorSession-root
    package: flutter3d_editor_mcp
    symbol: EditorSession
    kind: none
    reason: >-
      The constructor gained an optional `root:`. `save` and the capture
      tools refuse a path outside the level's project, and a save to the
      generated level under another spelling is refused like the plain one.

  - id: sim_mcp-SimSession-root
    package: flutter3d_sim_mcp
    symbol: SimSession
    kind: none
    reason: >-
      The constructor gained an optional `root:` (the working directory by
      default); `open`, `writeRun`, `expect`, `verify` and `bisect` refuse a
      path outside it, as do the levels a run or a level names.

  - id: webgl-shader-compile-exception
    package: flutter3d_webgl
    symbol: WebGlDevice
    kind: none
    reason: >-
      A stage that does not compile, or a pair that does not link, throws
      `ShaderCompileException` where it threw `StateError`. Nothing that
      compiled stops compiling; code that caught `StateError` around a
      pipeline catches the new type.

  - id: webgpu-WebGpuDevice-beginFrame
    package: flutter3d_webgpu
    symbol: WebGpuDevice
    kind: none
    reason: >-
      `beginFrame` throws, once, what the browser refused since the last
      frame: `ShaderCompileException` for WGSL it would not compile,
      `DeviceResourceException` for anything else. Nothing is thrown once the
      device is lost, and a frame with nothing refused behaves as before.

  - id: sim-Level-digestHex-content
    package: flutter3d_sim
    symbol: Level.digestHex
    kind: none
    reason: >-
      Nothing in code changes. The digest is now of the level's content, not
      of its format envelope, so a hash 0.8.5 stored differs from the one
      1.0 computes for the same level: `resimulate` answers a run recorded by
      0.8.5 with `ResimulationLevelChanged`, and a verifying server refuses
      it. Record such runs again. Format changes never move the digest again.

  - id: physics-CharacterController-steep
    package: flutter3d_physics
    symbol: CharacterController
    kind: none
    reason: >-
      Signatures are unchanged; two outcomes move. A face too steep to stand
      on stops sideways and rising motion as a wall, where walking into it
      used to climb it; falling onto it still slides down. A body caught
      between a static collider and a moving one is pushed out by the static
      one, so a closing platform no longer sets it into the floor. A level
      tuned against the old slide may need its slopes looked at.

  - id: sim-EcsWorld-restore-strict
    package: flutter3d_sim
    symbol: EcsWorld
    kind: none
    reason: >-
      `restore` refuses a component written by a newer codec with a
      `SnapshotFormatException` before it touches the world, and removes a
      resource that has a codec but is not in the save, where it used to
      keep the old one. A save this build wrote restores as before.

  - id: multiplayer-RollbackSession-early
    package: flame_multiplayer
    symbol: RollbackSession
    kind: none
    reason: >-
      A frame more than `maxStepsAhead` (600) steps ahead of the session is
      dropped and counted in `droppedEarly` rather than held without bound,
      and a frame that arrives from a room maps its sender to the session's
      own slot, so two peers of a room no longer drop each other's input.
