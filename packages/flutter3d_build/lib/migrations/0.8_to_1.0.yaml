  - id: f2-core-PhysicalCamera-luxPerUnit
    package: flutter3d_core
    symbol: PhysicalCamera.luxPerUnit
    kind: rewrite
    template: 'Photometric.legacyUnit'
    imports: [package:flutter3d_core/flutter3d_core.dart]
    guidance: >-
      The renderer's scale is internal; the number it was, about 5 790.6, is
      `Photometric.legacyUnit`.

  - id: f2-core-Scene-ambientIntensity
    package: flutter3d_core
    symbol: Scene.ambientIntensity
    kind: manual
    members: [ambientIntensity]
    guidance: >-
      `Scene.ambientIntensity` is lux since 1.0, about 347 by default (the
      0.06 it was). Multiply a pre-1.0 number by `Photometric.legacyUnit`:
