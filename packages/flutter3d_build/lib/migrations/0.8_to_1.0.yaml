  # ------------------------------------------------------------------
  # Package boundaries (tasks/1.0-boundaries.md), moves 10 and 11: a
  # package re-exports another's API only where `tool/structure.dart`
  # allows it, and `flutter3d_game` is the one facade. A name that came
  # through a re-export that went is imported from its own package; `dart
  # fix` adds the import, and `migrate` the dependency on that package.

  - id: c-sim-physics-library
    package: flutter3d_sim
    symbol: package:flutter3d_physics/flutter3d_physics.dart
    kind: moved
    to: package:flutter3d_physics/flutter3d_physics.dart
    wave: 5
    guidance: >-
      `package:flutter3d_sim/flutter3d_sim.dart` no longer re-exports the
      physics. The collision world, the bodies, the queries, the character
      controller, the cloth and the fluids are imported from
      `package:flutter3d_physics/flutter3d_physics.dart`, and the project
      depends on `flutter3d_physics`. What 0.8's physics held and another
      package holds now is imported from there: `Portable` and the vector
      crossings from `flutter3d_foundation`, the world's properties, the
      materials and the constants from `flutter3d_matter`. A game that wants
      one import takes `flutter3d_game`, which re-exports `CollisionWorld`,
      `Collider` and `RigidDynamics`.

  - id: c-sim-Entity
    package: flutter3d_sim
    symbol: Entity
    kind: moved
    to: package:flutter3d_plugin_api/flutter3d_plugin_api.dart
    wave: 5
    guidance: >-
      `Entity` is the plugin API's, where a plugin's systems name it, and
      `flutter3d_sim` no longer re-exports it.

  - id: c-sim-Portable
    package: flutter3d_sim
    symbol: Portable
    kind: moved
    to: package:flutter3d_foundation/flutter3d_foundation.dart
    wave: 5
    guidance: >-
      `Portable`, the arithmetic every fixed step agrees on, is the
      foundation's, under every package a step runs through, and
      `flutter3d_sim` no longer re-exports it.

  - id: c-net-firstDifferingPath
    package: flutter3d_net
    symbol: firstDifferingPath
    kind: moved
    to: package:flutter3d_sim/flutter3d_sim.dart
    wave: 5
    guidance: >-
      `firstDifferingPath` is the simulation's, beside the snapshots it
      compares, and `flutter3d_net` no longer re-exports it.

  - id: c-app-Issue
    package: flutter3d_app
    symbol: Issue
    kind: moved
    to: package:flutter3d_foundation/flutter3d_foundation.dart
    wave: 5
    guidance: >-
      The one issue type every package reports through is the
      foundation's; `flutter3d_app` keeps `IssueLog` and `printIssue` and no
      longer re-exports the type.

  - id: c-app-IssueSink
    package: flutter3d_app
    symbol: IssueSink
    kind: moved
    to: package:flutter3d_foundation/flutter3d_foundation.dart
    wave: 5
    guidance: >-
      `IssueSink` is the foundation's, beside `Issue`.

  - id: c-core-hardware-library
    package: flutter3d_core
    symbol: package:flutter3d_hardware/flutter3d_hardware.dart
    kind: moved
    to: package:flutter3d_hardware/flutter3d_hardware.dart
    wave: 5
    guidance: >-
      `package:flutter3d_core/flutter3d_core.dart` no longer re-exports the
      graphics vocabulary. A file that names `GraphicsDevice`,
      `TextureFormat` or a descriptor imports
      `package:flutter3d_hardware/flutter3d_hardware.dart`, and the project
      depends on `flutter3d_hardware`. `package:flutter3d/flutter3d.dart`
      still names what an application spells of it.

  - id: c-build-core-library
    package: flutter3d_build
    symbol: package:flutter3d_core/flutter3d_core.dart
    kind: moved
    to: package:flutter3d_core/flutter3d_core.dart
    wave: 5
    guidance: >-
      `DeviceClass` and `deviceClassPath` are the core's, and
      `flutter3d_build` no longer re-exports them.

  - id: c-model_core-mesh-library
    package: flutter3d_model_core
    symbol: package:flutter3d_mesh/flutter3d_mesh.dart
    kind: moved
    to: package:flutter3d_mesh/flutter3d_mesh.dart
    wave: 5
    guidance: >-
      `WeightPair`, what `bindWeights` hands back, is `flutter3d_mesh`'s,
      and `flutter3d_model_core` no longer re-exports it: a caller that
      spells it depends on `flutter3d_mesh`.

  - id: c-sim_mcp-kit-library
    package: flutter3d_sim_mcp
    symbol: package:flutter3d_mcp_kit/flutter3d_mcp_kit.dart
    kind: moved
    to: package:flutter3d_mcp/kit.dart
    wave: 5
    guidance: >-
      `PictureAnswer` is the agent kit's, `package:flutter3d_mcp/kit.dart`,
