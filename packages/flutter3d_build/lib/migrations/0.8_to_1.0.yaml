  - id: flame_flutter3d-HasFixedStep
    package: flame_flutter3d
    symbol: HasFixedStep
    kind: manual
    guidance: >-
      Only code that implements `HasFixedStep` has anything to do: it now has
      to provide `createEngineLoop`, `engineLoop`, `installStepSystems`. Code
      that calls a `HasFixedStep` needs no change.

  # 1 break(s), seen in flame_flutter3d:
  #   PhysicsStepComponent.dynamics changed: final Dynamics dynamics -> final RigidDynamics dynamics
  - id: flame_flutter3d-PhysicsStepComponent
    package: flame_flutter3d
    symbol: PhysicsStepComponent
    kind: manual
    members: [dynamics]
    guidance: >-
      `dynamics` is typed as the `RigidDynamics` interface now, which the
      Dart solver `Dynamics` and the native one both implement. Declare
      what you read it into as `RigidDynamics`; a call that needs the Dart
      solver's own members casts with `as Dynamics`.

  # 1 break(s), seen in flame_flutter3d:
