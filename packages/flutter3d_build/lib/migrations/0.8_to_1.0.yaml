      The four colours are nullable now and default to the app's
      `GameUiTheme` (`mapFloor`, `mapWall`, `mapPlayer`, `mapBackdrop`),
      whose defaults are the colours they had. A caller that passes a
      colour keeps it.

  # Decision 2 of tasks/1.0-api-review.md, carried out: no two public types
  # of the engine share a name. (tasks/1.0-arch-review.md, item 10.)

  - id: f1-rename-strategy-Selection
    package: flutter3d_game_strategy
    symbol: Selection
    kind: rename
    to: UnitSelection
    guidance: >-
      The strategy's ray-and-rectangle picking is `UnitSelection`, so it no
      longer shares a name with the modeller's element `Selection` in
      `flutter3d_mesh`.

  - id: f1-rename-app-DocumentText
    package: flutter3d_app
    symbol: DocumentText
    kind: rename
    to: LevelDocumentText
    guidance: >-
      The function `LevelLoader` reads a level's text through is
      `LevelDocumentText`; `DocumentText` is the editor's writer of documents
      in `flutter3d_editor_core`.

  - id: f1-replay-ReplaySubject-loop
    package: flutter3d_testing
    symbol: ReplaySubject
    kind: manual
    match: subtypes
    guidance: >-
      `ReplaySubject` lost `restore`, `step` and `save`. A subject now hands
      the replay its `loop` — an `EngineLoop` built on `ReplayStart.input`,
      with the game's genre installed and its `simulation` set to the run,
      and the game's own systems (an elements step, a camera follow on
      `onStepEnd`) added as the game adds them — and its `genre`, the
      `GenrePlugin` whose run the tape recorded. The replay restores the
      tape's start as the genre's part, steps with `loop.runSteps(1)` and
      digests the genre's part of `loop.capture()`, so recorded tapes keep
      passing. See `apps/flutter3d_demo_platformer/test/replay_test.dart`.

  - id: f1-conformance-PluginHarness-world
    package: flutter3d_conformance
    symbol: PluginHarness
    kind: manual
    members: [capture, restore, digest, hasWorld]
    guidance: >-
      `PluginHarness` has no `capture`, `restore` or `digest`: the world the
      plugin acts on is the loop's. In `setUp`, put the application's state
      in `loop.world`, or add a part for it —
      `loop.snapshots.add(SnapshotPart.of(id: 'my.world', capture: world.save,
      restore: (data, _) => world.load(data)))` — and the checks capture,
      restore and digest it through `EngineLoop.snapshots`, the path a
      rollback takes. `hasWorld` is gone: a loop whose snapshots hold
      nothing is a run with no world.

