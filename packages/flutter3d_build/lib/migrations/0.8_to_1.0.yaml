  # rc.1: a step's events are on the bus and only there.
  - id: sim-GameEvents
    package: flutter3d_sim
    symbol: GameEvents
    kind: manual
    wave: 4
    guidance: >-
      The drained buffer is gone: a genre's simulation publishes each event
      onto the engine's bus at the moment it happens, and a game subscribes.
      Before: `for (final e in sim.events.drain()) { if (e is Jumped)
      jump(); }` in a system after the step. After, on the loop the genre
      plugin is installed in: `loop.events.onStep<Jumped>('game.jump', (d) =>
      jump())`, or `onFrame` for sound and particles, or the whole step at
      its end:
      `loop.onStepEnd((s) => react(s.events.whereType<GameEvent>().toList()))`.
      A simulation stepped by hand (a test, a server) is handed
      a `DirectBus`: before, `final events = sim.events.drain()`; after,
      `final heard = <GameEvent>[];`
      `sim.publishTo(DirectBus()..onStep<GameEvent>('test', (d) => heard.add(d.event)))`.
      A buffer of your own, `final
      events = GameEvents(); events.add(e)`, becomes a bus you publish onto:
      `bus.publish(e)`, with the event declared once with a codec,
      `bus.declare<MyEvent>('mygame.myEvent', codec: MyEvent.codec)`. An
      event's `name` is the name it is declared under now
      (`platformer.landed`, `actor.hurt`), so code that printed or compared
      the old descriptive names compares the event's type or fields instead.

  - id: sim-StepEvents
    package: flutter3d_sim
    symbol: StepEvents
    kind: manual
    wave: 4
    guidance: >-
      `has` and `count` on a drained list are gone with the buffer. Before:
      `events.has<Jumped>()`, `events.count<CollectibleTaken>()`. After, on
      the list of a step's events (`StepEventSummary.events`, or what a
      subscriber collected): `events.whereType<Jumped>().isNotEmpty`,
      `events.whereType<CollectibleTaken>().length`. Or subscribe to the
      type itself: `loop.events.onStep<Jumped>(...)`.

  - id: sim-ActorSystem-events
    package: flutter3d_sim
    symbol: ActorSystem.events
    kind: manual
    wave: 4
    guidance: >-
      `events` is the bus the actors publish `ActorHurt` and `ActorDied`
      onto, an `EventRegistry?`, not a buffer. A genre's simulation sets it
      in its `publishTo`, so a game that owns a genre does nothing. Before:
      `actors.events = myBuffer`, then `myBuffer.drain()`. After:
      `actors.events = loop.events` (with `declareSimulationEvents(loop.events)`
      once, which a genre plugin does for you), then subscribe:
      `loop.events.onStep<ActorDied>('game.died', (d) => ...)`. Stepped by
      hand, `actors.events = DirectBus()..onStep<ActorDied>(...)`.

  - id: game_platformer-Runner-events
    package: flutter3d_game_platformer
    symbol: Runner.events
    kind: manual
    wave: 4
    guidance: >-
      `events` is an `EventRegistry?` the runner publishes its `RunnerEvent`s
      onto, set by `PlatformerSimulation.publishTo`. Before: `runner.events =
      buffer` and `buffer.drain()`. After: `runner.events = bus` (or, for a
      whole run, `sim.publishTo(bus)`), and a subscriber on the bus:
      `bus.onStep<Jumped>('game.jump', (d) => ...)`.

  - id: game_platformer-PlatformerSimulation-events
    package: flutter3d_game_platformer
    symbol: PlatformerSimulation.events
    kind: manual
    wave: 4
    guidance: >-
      The run's buffer is gone; it publishes onto the bus. With
      `PlatformerPlugin` installed nothing is to be done but subscribe.
      Before: `final events = sim.events.drain(); if (events.any((e) => e is
      RunnerDied)) camera.cut();` in the `publish` phase. After:
      `loop.onStepEnd((s) { if (s.events.any((e) => e is RunnerDied))
      camera.cut(); })`, or `loop.events.onStep<RunnerDied>(...)`. Stepped by
      hand: `sim.publishTo(DirectBus()..onStep<GameEvent>('test', (d) =>
      heard.add(d.event)))`.

  - id: game_racing-RacingSimulation-events
    package: flutter3d_game_racing
    symbol: RacingSimulation.events
    kind: manual
    wave: 4
    guidance: >-
      The race's buffer is gone; it publishes onto the bus. With
      `RacingPlugin` installed nothing is to be done but subscribe. Before:
      `for (final e in race.events.drain()) { if (e is LapCompleted &&
      e.isPlayer) showLap(); }`. After:
      `loop.events.onStep<LapCompleted>('game.lap', (d) { if (d.event.isPlayer) showLap(); })`,
      or read
      `StepEventSummary.events` in `loop.onStepEnd`. Stepped by hand:
      `race.publishTo(DirectBus()..onStep<GameEvent>('test', (d) =>
      heard.add(d.event)))`. `events.clear()` on a restart has nothing to
      clear any more.

  - id: game_shooter-GameSimulation-events
    package: flutter3d_game_shooter
    symbol: GameSimulation.events
    kind: manual
    wave: 4
    guidance: >-
      The run's buffer is gone; it publishes onto the bus. With
      `ShooterPlugin` installed nothing is to be done but subscribe. Before:
      `final events = sim.events.drain(); if (events.any((e) => e is
      PlayerDied)) showDeath();` in the `publish` phase. After:
      `loop.events.onStep<PlayerDied>('game.died', (d) => showDeath())`, or
      read `StepEventSummary.events` in `loop.onStepEnd`. Stepped by hand:
      `sim.publishTo(DirectBus()..onStep<GameEvent>('test', (d) => heard.add(d.event)))`.
      Cutscene signals arrive on the same bus as `SequenceSignal`s, with
      `Cutscene.signals` gone: subscribe to `SequenceSignal` and switch on
      its `signal`.

