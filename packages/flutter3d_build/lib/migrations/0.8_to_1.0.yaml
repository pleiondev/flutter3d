  # ---- F2: one way to switch a pass off (item 13 of the 1.0 architecture
  # review). `disabledPasses` went; `without` and the steps stay.
  - id: f2-core-RenderSettings-disabledPasses
    package: flutter3d_core
    symbol: RenderSettings.disabledPasses
    kind: manual
    wave: 5
    guidance: >-
      `RenderSettings(disabledPasses: {...})` is
      `RenderSettings(...).without({...})` over the steps that own those
      passes: `bloom` is `RenderStep.bloom`, `lens flare`
      `RenderStep.lensFlare`, `ssao` and `ssao blur`
      `RenderStep.ambientOcclusion`, `contact shadows`
      `RenderStep.contactShadows`, `reflections` `RenderStep.reflections`,
      `light shafts` `RenderStep.lightShafts`, `volumetric fog`
      `RenderStep.volumetricFog`, `depth of field` `RenderStep.depthOfField`,
      `motion blur` `RenderStep.motionBlur`, `luminance`
      `RenderStep.autoExposure`, `local exposure` `RenderStep.localExposure`,
      `spatial upscale` `RenderStep.spatialUpscale`, `antialias`
      `RenderStep.edgeSmoothing` and `RenderStep.sharpening`, `decals`
      `RenderStep.decals`, `depth pyramid` `RenderStep.hiZOcclusion`,
      `viewport shading` `RenderStep.viewportShading`, the shadow passes
      `RenderStep.shadows`; `RenderStep.ownsPass` answers for any other
      name. A pass of your own is switched off by the `RenderStep` it was
      added with (`renderSteps.addNode(node, step: myStep)`). A skipped pass
      is reported as `PassSkip.switchedOff` rather than `PassSkip.disabled`.
      The transparent half and the scene colour copy have no step: they run
      when the scene holds glass.

  - id: f2-core-RenderSettings-copyWith-disabledPasses
    package: flutter3d_core
    symbol: RenderSettings.copyWith
    kind: manual
    members: [disabledPasses]
    wave: 5
    guidance: >-
      `settings.copyWith(disabledPasses: {...})` is
      `settings.without({...})` over the steps that own those passes; see
      `f2-core-RenderSettings-disabledPasses` for the names.

  - id: f2-core-RenderSettings-undisablePasses
    package: flutter3d_core
    symbol: RenderSettings.undisablePasses
    kind: manual
    wave: 5
    guidance: >-
      The names `disabledPasses` refused, `scene`, `composite` and
      `object ids`, are not steps, so no `without` can switch them off and
      there is nothing to subtract.

  - id: f2-core-RenderSettings-pixelAlteringPasses
    package: flutter3d_core
    symbol: RenderSettings.pixelAlteringPasses
    kind: rename
    to: pixelAlteringSteps
    wave: 5
    guidance: >-
      The set `forMeasurement` switches off is a `Set<RenderStep>` now,
      handed to `without`: `settings.without(RenderSettings.pixelAlteringSteps)`.
      A caller that read the pass names reads each step's `passes`.

  # ---- F2: what the device classes inherited from the HAL changes.
  - id: f2-core-ModelLight
    package: flutter3d_core
    symbol: ModelLight
    kind: manual
    members: [ModelLight, color]
    guidance: >-
      `ModelLight(color:)` and `ModelLight.color` are a `LinearColor`, in
