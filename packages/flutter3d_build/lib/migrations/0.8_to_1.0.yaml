  - id: flame_flutter3d-RigidBodyComponent
    package: flame_flutter3d
    symbol: RigidBodyComponent
    kind: manual
    members: [removeFrom]
    guidance: >-
      `removeFrom` is a `RigidDynamics?` now: pass any solver, and declare
      a variable you read it into as `RigidDynamics?`.

  # 1 break(s), seen in flutter3d:
  #   ModelInstance.ModelInstance changed: ModelInstance({required this.root, required this.nodes, required this.meshes, required this.skeletons, required this.player…
  - id: flutter3d-ModelInstance
    package: flutter3d
    symbol: ModelInstance
    kind: none
    reason: >-
      The constructor's private `_drawn` became the public named `drawn`,
      and a private `_slots` was added. Nothing outside the library could
      pass either, so every call still compiles.

  # 1 break(s), seen in flutter3d:
