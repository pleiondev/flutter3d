  - id: f4-ui-status-screen-words
    package: flutter3d_app
    symbol: LoadingScreen
    kind: none
    reason: >-
      `LoadingScreen.message` and `LevelLoadFailed.startOverLabel` are
      nullable now: left out, they are the reader's language from
