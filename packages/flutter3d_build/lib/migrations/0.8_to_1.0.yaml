# How code written against flutter3d 0.8.x moves to 1.0.0-rc.1.
#
# The one source of every migration: `tool/generate_migrations.dart` in
# flutter3d_build turns it into each package's `lib/fix_data.yaml` (for
# `dart fix`), into the `flutter3d_lints` migration diagnostics and their
# quick fixes, and into the table on the site's migration guide; the
# `migrate` command reads `packages:` and the `import` entries itself.
#
# Layout, which `tool/structure/migration.dart` reads without a YAML parser
# (the generator refuses a file the two readers see differently):
#
#   - every entry starts `  - id: <unique-id>` and its keys sit at four
#     spaces; a long text is a `>-` block under its key;
#   - `package` is the package that declared `symbol` at the `from` release;
#   - `symbol` is `Name`, which covers every member of it, or `Name.member`;
#     a whole library gone is its URI.
#
# Kinds, and what each becomes:
#
#   rename            `to: NewName` (or `to: Type.newMember`)      dart fix
#   moved             `to: <library uri>`, optional `name:`        dart fix
#                     (and `migrate` adds the dependency it needs)
#   parameters        `changes:` — a list of `rename:`/`to:`,       dart fix
#                     `remove:`, `add:` with `named`, `required`,
#                     `value:` (the argument old callers get)
#   rewrite           `template:` with `{target}` for the receiver, flutter3d_lints
#                     `imports:` the libraries it names
#   implementsToWith  a type that became a `base mixin class`:      flutter3d_lints
#                     `implements X` becomes `with X` on a base class
#   regroup           named arguments that moved into an options    flutter3d_lints
#                     object: `into:` the parameter that takes it,
#                     `options:` its class, `arguments:` the names
#                     that move, optional `imports:`
#   enumToClass       a type that stopped being an enum or sealed:  flutter3d_lints
#                     a `switch` over it with no wildcard gains
#                     one that throws, with a TODO
#   recordToClass     a record that became a class: `fields:` maps  flutter3d_lints
#                     each old field (`$1`, `name`) to its getter;
#                     destructuring patterns are left to a person
#   nullToThrow       a call that answered null and now throws:     flutter3d_lints
#                     `exception:` the type; a null check right
#                     beside a call becomes `try … on` with a TODO
#   internal          a name public at `from` that is the owning    flutter3d_lints
#                     package's own now, with nothing to replace it;
#                     optional `instead:`. One diagnostic per import
#                     of the package, one line per package in the
#                     guide. It names a top-level name or a library.
#   manual            `guidance:` — the diagnostic and the TODO     flutter3d_lints
#                     `migrate` leaves at each use. Their count is
#                     held to a ceiling (`manualCeiling` in
#                     `tool/structure/migration.dart`): prefer a kind
#                     above, or allowlist the entry with a reason
#   none              `reason:` — a break no caller has to act on   the guide only
#   import            `from:`/`to:` library URIs, for a library     migrate
#                     that moved; no `symbol`
#
# Every entry may add `guidance:` (shown in the guide and the report) and
# `wave:` (which piece of the 1.0 work added it). What a person reads —
# `guidance:`, `reason:`, `instead:` — names no wave, plan or review: it
# lands in their TODOs. A break the structure rule
# `every break since the last release has its migration` finds with no entry
# is drafted by `dart run api_snapshot:migration_seed --append` in tool/api.
# Later work appends entries at the end; nothing here is renumbered.

format: 1
from: 0.8.5
to: 1.0.0-rc.1
# The date `dart fix` shows on every fix generated from this table.
date: 2026-10-08
guide: https://flutter3d.pleion.dev/reference/migrating-to-1.0/

# `migrate` moves every dependency on a package of this repository to
# `constraint`, or to its own line under `versions:` for a package that is
# not on the engine's number. `renamed:` is old name to new; `removed:` is a
# name and what to use instead. The structure rule holds `versions:` to the
# pubspecs.
