  # integration pass, written by hand
  - id: build-format-exceptions
    package: flutter3d_build
    symbol: ConvertCommandOptions
    kind: manual
    members: [parse]
    wave: 3
    guidance: >-
      The readers in flutter3d_build throw their own leaf of
      `Flutter3dFormatException` instead of `dart:core`'s `FormatException`:
      `ConvertUsageException` (`ConvertCommandSettings.parse`),
      `SourceFormatException` (a PLY, USD, Godot or Unity text file, XML, a
      ZIP, or a file `decodeModelFile` has no reader for) and
      `MigrationTableException` (a migration table). An `on FormatException`
      around one of them no longer catches: catch the leaf, or
      `Flutter3dFormatException` for all of them.

