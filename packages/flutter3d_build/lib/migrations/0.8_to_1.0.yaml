  # Move 13 of tasks/1.0-boundaries.md: a public name has one home across
  # the published packages, so the more specific of two declarations of one
  # name takes a name of its own.
  - id: b1-mesh-Brush
    package: flutter3d_mesh
    symbol: Brush
    kind: rename
    to: MeshBrush
    wave: 5
    guidance: >-
      The sculpting brush is `MeshBrush`; `Brush` is the level's box in
      `flutter3d_sim`, and a file that imported both had to hide one.

  - id: b1-mesh-applyBrushStroke
    package: flutter3d_mesh
    symbol: applyBrushStroke
    kind: none
    wave: 5
    reason: >-
      It takes the same brush under its new name, `MeshBrush`; a call that
      passed a `Brush` passes the renamed one, which `dart fix` writes.

  - id: b1-mesh-ImportReport
    package: flutter3d_mesh
    symbol: ImportReport
    kind: rename
    to: MeshImportReport
    wave: 5
    guidance: >-
      What `importMeshData` reports about one mesh's weld is
      `MeshImportReport`; `ImportReport` is `flutter3d_model_core`'s, about a
      whole document imported into a project.

  - id: b1-mesh-importMeshData
    package: flutter3d_mesh
    symbol: importMeshData
    kind: none
    wave: 5
    reason: >-
      The record it returns holds the same report under its new name,
      `MeshImportReport`; a pattern that named the type is renamed by
      `dart fix`.

  - id: b1-model_core-EnumHint
    package: flutter3d_model_core
    symbol: EnumHint
    kind: rename
    to: ChoiceHint
    wave: 5
    guidance: >-
      A command argument chosen from named values is hinted by
      `ChoiceHint`; `EnumHint` is the material's (`MaterialHintKind`), from
      `flutter3d_core`, and a file reading both no longer hides one.

  - id: b1-model_core-ChoiceHint
    package: flutter3d_model_core
    symbol: ChoiceHint
    kind: none
    wave: 5
    reason: >-
      Not a new case of `ParamHint`: it is `EnumHint` under its new name, so
      a switch that handled `EnumHint` handles it once `dart fix` renames it.

  - id: b1-model_core-TextureUsage
    package: flutter3d_model_core
    symbol: TextureUsage
    kind: rename
    to: TextureBudgetUsage
    wave: 5
    guidance: >-
      What `measure` finds under a texture budget is `TextureBudgetUsage`;
      `TextureUsage` is the device's, the usage flags of a texture in
      `flutter3d_hardware`.

  - id: b1-model_core-measure
    package: flutter3d_model_core
    symbol: measure
    kind: none
    wave: 5
    reason: >-
      It returns the same result under its new name, `TextureBudgetUsage`.

  - id: b1-editor_core-AddLight
    package: flutter3d_editor_core
    symbol: AddLight
    kind: rename
    to: AddLevelLight
    wave: 5
    guidance: >-
      The editor's command is `AddLevelLight`; `AddLight` is the modeller's,
      in `flutter3d_model_core`. Its journal name is still `addLight`, so a
      journal written before reads the same.

  - id: b1-editor_core-AddLevelLight
    package: flutter3d_editor_core
    symbol: AddLevelLight
    kind: none
    wave: 5
    reason: >-
      Not a new case of `EditorCommand`: it is `AddLight` under its new name.

  - id: b1-editor_core-MoveBy
    package: flutter3d_editor_core
    symbol: MoveBy
    kind: rename
    to: MoveSelectionBy
    wave: 5
    guidance: >-
