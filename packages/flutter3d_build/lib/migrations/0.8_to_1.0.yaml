  - id: flutter3d-package-flutter3d_core-formats-dart
    package: flutter3d
    symbol: package:flutter3d_core/formats.dart
    kind: moved
    to: package:flutter3d_core/formats.dart
    guidance: >-
      `package:flutter3d/flutter3d.dart` re-exports the formats library
      through a `show` list now. The readers and writers a game calls are
      on it; the format internals (`F3dSection`, the KTX2 header fields,
      the material expression tree, the block encoders) are not. Import
      `package:flutter3d_core/formats.dart` for those; `dart fix` adds the
      import, and `migrate` the dependency on `flutter3d_core`.

  # 4 break(s), seen in flutter3d_app:
