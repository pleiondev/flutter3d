  - id: f1-net-PeerWire-listen
    package: flame_multiplayer
    symbol: PeerWire.listen
    kind: manual
    match: subtypes
    members: [listen, listenFrom]
    guidance: >-
      A wire has several listeners now: `listen` and `listenFrom` are the
      base class's, add a listener and return the `Registration` that takes
      it away. An adapter no longer overrides them; it calls
      `deliver(message)` (a party's wire `deliver(message, from: slot)`)
      with each message that arrives, and drops the field that held the one
      listener. A wire wrapping another overrides `listenFrom` to hand back
      the inner wire's registration.

  - id: f1-net-PeerWire-const
    package: flame_multiplayer
    symbol: PeerWire.PeerWire
    kind: none
    reason: >-
      The constructor is no longer `const`: a wire holds its listeners. An
      adapter's own constructor was not `const` either, since a connection
      is not a constant.

  - id: f1-net-protocol-3
    package: flame_multiplayer
    symbol: WireHello.currentProtocolMajor
    kind: none
    reason: >-
      Protocol 3: a rollback's frames carry the reserved key `"f3d":
      "rollback"` (`PeerWire.engineKey`). A machine on protocol 2 is refused
      in the hello with the version to update to, and a game's own message
      never sets `f3d`.

  # F4 of tasks/1.0-arch-review.md: decision F (`GameSettings` is a value,
  # typed keys, volumes per bus, one action map, the file in the envelope),
  # the settings panel made of sections, and the old input paths gone
  # (`PadRoutes`, slot tables, `FlameInputBridge(bindings:)`).

  - id: f4-game-GameConfig-value
    package: flutter3d_game
    symbol: GameConfig
    kind: manual
    members: [bindings, volumes, settings, volumeOf, setVolume, settingOf, setSetting, fromJson]
    wave: 4
    guidance: >-
      `GameSettings` (what `GameConfig` became) is a value: change it with
      `withVolume(AudioBus.music, v)`, `withValue(key, v)`,
      `withoutValue(key)` or `copyWith`, each of which returns a new one.
      A volume is `volumeOf(AudioBus.music)` where it was
      `volumeOf('music')`. A setting is a typed `SettingKey`:
      `settingOf('pad.look', fallback)` is
      `valueOf(GameSettingKeys.padLook)`, or `chosenValueOf(key) ?? fallback`
      for a default that is somebody else's (the system's reduce-motion);
      a game's own setting is `SettingKey<T>('mygame.name', fallback: ...)`.
      `bindings` is `actions?.buttons`: the controls are one `ActionMap`.
      `fromJson` takes `defaultActions:` and reads a file from before the
      envelope, moving its names to the namespaced ids.

  - id: f4-game-SettingsCubit-settings
    package: flutter3d_game
    symbol: SettingsCubit
    kind: manual
    members: [config, setVolume, setSetting]
    wave: 4
    guidance: >-
      `GameSettingsController` takes `settings:` where it took `config:`,
      and the map the devices read as `actions:`. `settings` is the current
      value, replaced on every change; keep yours current in `apply`.
      `setVolume` takes an `AudioBus`, and `setSetting(name, value)` is
      `setValue(GameSettingKeys.<key>, value)`.

  - id: f4-game-PadRoutes
    package: flutter3d_game
    symbol: PadRoutes
    kind: manual
    wave: 4
    guidance: >-
      A pad's sticks are bindings in the action map. `PadRoutes.walking`
      is what `PadInput.addDefaultsTo(map)` binds (the left stick walks,
      the right one looks); `PadRoutes.driving(steerLeft:, steerRight:)` is
      `PadInput.addDrivingDefaultsTo(map, steerLeft:, steerRight:)`;
      `lookRate` is `PadInput.lookRate`. Pass no `routes:` to `PadInput`.

  - id: f4-game-PadStickUse
    package: flutter3d_game
    symbol: PadStickUse
    kind: manual
    wave: 4
    guidance: >-
      Bind the stick to an action instead: `DualAxisBinding(myAction,
      InputSource.padStick('left'))` in the action map, and read
      `input.dualAxis(myAction)` where the use's `route` was called.
      `PadStickUse.move` and `look` are `DualAxisAction.move` and `look`;
      `ignored` is no binding.

  - id: f4-game-PadAxisPair
    package: flutter3d_game
    symbol: PadAxisPair
    kind: manual
    wave: 4
    guidance: >-
      Bind each direction of the axis as a button with a magnitude:
      `InputSource.padHalfAxis('leftStickX', positive: false)` to the
      negative action and `positive: true` to the positive one, in the
      action map's buttons.

  - id: f4-game-DesktopInput-slots
    package: flutter3d_game
    symbol: DesktopInput
    kind: manual
    members: [slotKeys, defaultSlotKeys]
    wave: 4
    guidance: >-
      A slot is an action: bind a key to `SlotActions.of(n)` in the action
      map (`DesktopInput.addSlotsTo(map, keys)`), and `DesktopInput`
      requests slot `n` on its press. `addDefaultsTo` binds the number row
      to the first four.

  - id: f4-game-PadInput-pad
    package: flutter3d_game
    symbol: PadInput
    kind: manual
    members: [routes, slotButtons, dpadSlots, storeSettings]
    wave: 4
    guidance: >-
      What the sticks do is the action map's (see `f4-game-PadRoutes`);
      `routes.lookRate` is `lookRate`. `slotButtons: PadInput.dpadSlots` is
      `PadInput.addSlotDefaultsTo(map)`, which binds the d-pad to
      `SlotActions`. `storeSettings` is gone: the settings panel writes the
      dead zone and the look speed as `GameSettingKeys`, which
      `applySettings` reads.

  - id: f4-flame-FlameInputBridge
    package: flame_flutter3d
    symbol: FlameInputBridge
    kind: manual
    members: [bindings]
    wave: 4
    guidance: >-
      `FlameInputBridge` takes `actions:`, an `ActionMap`, where it took
      `bindings:`: the map a native game's `DesktopInput` reads. Wrap an
      old table as `ActionMap(actions: ActionSet.common, buttons: table)`.

  - id: f1-camera-CameraRig
    package: flutter3d_sim
    symbol: CameraRig
    kind: moved
    to: package:flutter3d_camera/flutter3d_camera.dart
    guidance: >-
      `CameraRig` places a view, which no step reads, so it is
      `flutter3d_camera`'s now and `flutter3d_sim` no longer exports it.
      `migrate` adds the `flutter3d_camera` dependency; `dart fix` adds the
      import.

  - id: f1-sim-EcsWorld-register
    package: flutter3d_sim
    symbol: EcsWorld.register
    kind: manual
    guidance: >-
      `world.register<T>('name', encode: e, decode: d)` was a second door to
      the world's component registry with no version. Register a codec:
      `world.components.register<T>(ComponentCodec<T>.of(id: 'name',
      encode: e, decode: (data, version) => d(data)))`, adding `version:`
      when the shape changes and `published: true` for what the view reads.
      The id is the same name, so a save written before reads back.

  - id: f1-sim-EcsWorld-registerInPlace
    package: flutter3d_sim
    symbol: EcsWorld.registerInPlace
    kind: manual
    guidance: >-
      `world.registerInPlace<T>('name', encode: e, restore: r)` is
      `world.components.register<T>(InPlaceCodec<T>.of(id: 'name',
      encode: e, restore: (value, data, version) => r(value, data)))`: the
      same component restored into the instance already there, now with a
      version.

  - id: f1-sim-EcsWorld-exclude
    package: flutter3d_sim
    symbol: EcsWorld.exclude
    kind: manual
    guidance: >-
      `world.exclude<T>(because)` is `world.components.exclude<T>(because)`,
      the registry's own, which returns a `Registration`.

  - id: f1-sim-StepSystems-add-order
    package: flutter3d_sim
    symbol: StepSystems.add
    kind: manual
    guidance: >-
      `StepSystems.add` orders by name, as the engine's loop does: `order:` is
      gone, and a system names the systems of its phase it runs `after:` or
      `before:`, by their `label:`. Where nothing is named, the order of
      adding decides, as equal orders did. A system that had a lower `order`
      than another says `before: ['<the other's label>']`.

  - id: f1-sim-SystemRegistration-order
    package: flutter3d_sim
    symbol: SystemRegistration.order
    kind: manual
    guidance: >-
      A registration has no number now: read `after` and `before`, the
      labels it is ordered against, and `sequence`, when it was added.

  - id: f1-timeline-RunTimeline-loop
    package: flutter3d_game
    symbol: RunTimeline.RunTimeline
    kind: manual
    guidance: >-
      `RunTimeline(rewind:, input:, stepSim:, restore:)` is
      `RunTimeline(rewind:, loop:)`: the `EngineLoop` the run steps in, which
      the buffer is attached to (`rewind.attach(loop)`, in place of adding
      its recorder to `loop.recorders` and calling `keyframe` with the run's
      save). The run has to be a part of the loop's snapshots — a genre is,
      under its plugin id; a game's own run adds
      `loop.snapshots.add(SnapshotPart.of(id:, capture:, restore:))` — and
      its step a system of the loop's. `input` and `stepSeconds` are the
      loop's.

  - id: f1-timeline-RunTimeline-stepSim
    package: flutter3d_game
    symbol: RunTimeline.stepSim
    kind: manual
    guidance: >-
      The timeline steps the loop it was given (`loop.runSteps`), so the run's
      step is a system of that loop, not a function handed to the timeline.

  - id: f1-timeline-RunTimeline-restore
    package: flutter3d_game
    symbol: RunTimeline.restore
    kind: manual
    guidance: >-
      The timeline restores through the loop's snapshots
      (`loop.rewindTo(step, state:)`), so the run is a part of them — a
      genre's is, under its plugin id — rather than a function handed to the
      timeline.

  - id: f1-timeline-RunTimeline-input
    package: flutter3d_game
    symbol: RunTimeline.input
    kind: none
    reason: >-
      Still readable: a getter for the loop's `input` where it was a field.
      Nothing outside the package implements `RunTimeline`.

  - id: f1-timeline-RunTimeline-stepSeconds
    package: flutter3d_game
    symbol: RunTimeline.stepSeconds
    kind: none
    reason: >-
      Still readable: a getter for the loop's `stepSeconds` where it was a
      field. Nothing outside the package implements `RunTimeline`.

  - id: f1-timeline-RunTimeline-tracks
    package: flutter3d_game
    symbol: RunTimeline.tracks
    kind: manual
    guidance: >-
      `tracks(capture:, layout:)` is `tracks(layout:, part:)`: the loop's
      capture is read at each step, and `part:` — the run's part, a genre's
      plugin id — hands the layout that part's own data, which is what a
      layout written against the run's `save()` reads.

  - id: f1-timeline-registerTimelineExtensions
    package: flutter3d_game
    symbol: registerTimelineExtensions
    kind: manual
    guidance: >-
      `capture:` is gone: `scrubTo` and `replayUnderNewCode` are registered
      always, through the timeline's loop. `tracks` is registered with
      `entityLayout:`, and reads the part `trackedPart:` names (a genre's
      plugin id) when the layout reads the run's own save.

  - id: f1-timeline-replayDemo
    package: flutter3d_game
    symbol: replayDemo
    kind: manual
    guidance: >-
      Replay through the loop: `replayDemoOnLoop(demo:, loop:, part:)`, where
      the loop steps the run (its genre installed, or the game's step as a
      system) and `part` is the run's part of its snapshots — the genre's
      plugin id (`PlatformerPlugin.id`), or the id of the `SnapshotPart` the
      game registered for its run. The file's start is restored as that part
      and each checkpoint digested from it, so recorded tapes check out as
      they did.

  - id: f1-timeline-replayDemoOnLoop-part
    package: flutter3d_game
    symbol: replayDemoOnLoop
    kind: manual
    guidance: >-
      `restore:` and `save:` are gone; pass `part:`, the id of the run's part
      of the loop's snapshots (a genre's plugin id, or the `SnapshotPart` the
      game registered for its run with its own `save` and `restore`). The
      loop is rewound to step nought with the file's start as that part.

  - id: f1-timeline-rewindBufferFromDemo
    package: flutter3d_game
    symbol: rewindBufferFromDemo
    kind: manual
    guidance: >-
      `rewindBufferFromDemo(demo:, stepsPerSecond:, input:, restore:, save:,
      stepSim:)` is `rewindBufferFromDemo(demo:, loop:, part:)`: the tape
      plays through the loop with the buffer attached, its start restored as
      the run's part. Steps per second are the loop's.

  - id: f1-timeline-bugReportTape
    package: flutter3d_game
    symbol: bugReportTape
    kind: none
    reason: >-
      An attached buffer keeps the loop's captures; pass `part:` (the run's
      part, a genre's plugin id) so the report's start is the run's own
      snapshot, which a `.f3drun` holds. Without it the keyframe is handed
      over whole, which is right only for a buffer filled by hand.

  # The Flame cameras are framings on a `VirtualCamera` now (F4, item 8 of
  # tasks/1.0-arch-review.md): `ViewCamera` keeps its constructor, and what
  # were its fields read through to the framing and the virtual camera.
  - id: f4-flame-ViewCamera-framing
    package: flame_flutter3d
    symbol: ViewCamera
    kind: none
    members: [rig, stiffness, view]
    wave: 4
    reason: >-
      `rig`, `stiffness` and `view` are getters over the camera's
      `ViewFraming` and `VirtualCamera` rather than fields; reading them is
      unchanged, and nothing outside the class could assign them.

  # Formats, plugins and tools before rc.1 (tasks/1.0-arch-review.md, F3).
  - id: f3-build-TextureFamily-parse
    package: flutter3d_build
    symbol: TextureFamily.parse
    kind: manual
    wave: 4
    guidance: >-
      `TextureFamily.parse` throws a `ConvertUsageException` naming the
      families there are, instead of answering null for a word it does not
      know. A caller that had a fallback asks `TextureFamily.tryParse`,
      which answers null as `parse` did: `TextureFamily.tryParse(text) ??
      fallback`.

  - id: f3-build-parseLodRatios
    package: flutter3d_build
    symbol: parseLodRatios
    kind: manual
    wave: 4
    guidance: >-
      `parseLodRatios` answers a non-null list and throws a
      `ConvertUsageException` naming the entry that is not a ratio between
      0 and 1, instead of answering null. Drop the `?? …` after the call,
      and catch `ConvertUsageException` where the null was handled.

  - id: f3-core-AnimationPointer-parse
    package: flutter3d_core
    symbol: AnimationPointer.parse
    kind: manual
    wave: 4
    guidance: >-
      `AnimationPointer.parse` throws an `AnimationPointerFormatException`
      for a pointer this engine does not animate, instead of answering
      null. Code that checked for null (a loader meeting a file's pointer)
      calls `AnimationPointer.tryParse`, which answers null as `parse` did.

  - id: f3-core-ModelDecoder-base
    package: flutter3d_core
    symbol: ModelDecoder
    kind: manual
    match: subtypes
    wave: 4
    guidance: >-
      `ModelDecoder` is an `abstract base class`, so a member
      added in a minor comes with a default and breaks no decoder. A decoder
      of your own that wrote `implements ModelDecoder` now writes `extends
      ModelDecoder` and is `final` or `base` itself; its members stay as
      they were, and a `const` constructor still works.

  - id: f3-core-ModelWriter-base
    package: flutter3d_core
    symbol: ModelWriter
    kind: manual
    match: subtypes
    wave: 4
    guidance: >-
      `ModelWriter` is an `abstract base class`. A writer of
      your own that wrote `implements ModelWriter` now writes `extends
      ModelWriter` and is `final` or `base` itself; its members stay as
      they were.

  - id: f3-core-CheckedModelWriter-base
    package: flutter3d_core
    symbol: CheckedModelWriter
    kind: manual
    match: subtypes
    wave: 4
    guidance: >-
      `CheckedModelWriter` is an `abstract base class` that extends
      `ModelWriter`. A writer that wrote `implements
      CheckedModelWriter` now writes `extends CheckedModelWriter` and is
      `final` or `base` itself; its members stay as they were.

  - id: f3-core-ModelDocument-base
    package: flutter3d_core
    symbol: ModelDocument
    kind: manual
    match: subtypes
    wave: 4
    guidance: >-
      `ModelDocument` is an `abstract base class`. A document of your own
      already extended it; the class that extends it is now `final` or
      `base` itself (`final class MyDocument extends ModelDocument`).

  - id: f3-core-ModelFormat-class
    package: flutter3d_core
    symbol: ModelFormat
    kind: manual
    wave: 4
    guidance: >-
      `ModelFormat` is a class with constant values instead of an enum, so a
      later release can name a format without breaking a `switch` written
      against this one. `ModelFormat.gltf` and the rest, `values` and `name`
      are unchanged; an exhaustive `switch` over it needs a default case.

  - id: f3-sim-EduDataSource-base
    package: flutter3d_sim
    symbol: EduDataSource
    kind: manual
    match: subtypes
    wave: 4
    guidance: >-
      `EduDataSource` is an `abstract base class`. An adapter of your own
      that wrote `implements EduDataSource` now writes `extends
      EduDataSource` and is `final` or `base` itself.

  - id: f3-game-registerTimelineExtensions-registration
    package: flutter3d_game
    symbol: registerTimelineExtensions
    kind: none
    wave: 4
    reason: >-
      It returns a `Registration`, which takes the timeline off the VM
      service, rather than `void`; a call that ignored the result compiles
      as before. A second timeline now registers beside the first instead
      of throwing.

  # ---- F2 (rc.1 architecture review): render, HAL, app.

  - id: f2-core-FrameHistory-per-view
    package: flutter3d_core
    symbol: FrameHistory
    kind: manual
    members: [of, moved]
    guidance: >-
      The history is kept per view now, so views drawn by separate
      `Renderer.render` calls each have their own past. `of(node)` is
      `of(node, view)` and `moved(node)` is `moved(node, view)`: pass the
      `RenderView` whose last frame you mean, the one you hand to `render`.

  - id: f2-core-Renderer-addMaterials
    package: flutter3d_core
    symbol: Renderer.addMaterials
    kind: rewrite
    template: '{target}.renderSteps.addMaterials({0})'
    guidance: >-
      One way to add a bundle of materials: `renderer.renderSteps.addMaterials`,
      which a plugin already used. It returns the `Registration` that takes
      the library out again.

  - id: f2-core-Renderer-removeMaterials
    package: flutter3d_core
    symbol: Renderer.removeMaterials
    kind: manual
    guidance: >-
      Keep the `Registration` that `renderer.renderSteps.addMaterials(library)`
      returned and `cancel()` it; that takes the library out, as this did.

  - id: f2-plugin_runtime-RuntimeShaders-addMaterials
    package: flutter3d_plugin_runtime
    symbol: RuntimeShaders.RuntimeShaders
    kind: manual
    guidance: >-
      `RuntimeShaders` takes `addMaterials: renderer.renderSteps.addMaterials`,
      a function returning the `Registration` that takes a library out again,
      and no `removeMaterials`. Drop the `removeMaterials:` argument.

  - id: f2-flutter3d-ModelAsset-release
    package: flutter3d
    symbol: ModelAsset.release
    kind: rewrite
    template: '{target}.dispose()'
    guidance: >-
      `dispose()` is the one verb for ending what holds GPU memory. The asset
      remembers the device it was uploaded to, so the call takes nothing; a
      second call does nothing.

  - id: f2-core-LightNode-maxLights
    package: flutter3d_core
    symbol: LightNode.maxLights
    kind: none
    reason: >-
      A static getter now, with the same value (8). Every read still
      compiles; only a `const` expression that used it does not, and it
      takes the number itself or a non-const variable.

  - id: f2-core-LightNode-maxExtraLights
    package: flutter3d_core
    symbol: LightNode.maxExtraLights
    kind: none
    reason: >-
      A static getter now, with the same value (24), for the reason
      `maxLights` is one.

  - id: f2-core-Renderer-shadowedLights
    package: flutter3d_core
    symbol: Renderer.shadowedLights
    kind: none
    reason: >-
      A static getter now, with the same value (6), so a later minor can
      change the shadow atlas without a constant compiled into callers.

  - id: f2-core-LightType-index
    package: flutter3d_core
    symbol: LightType.index
    kind: none
    reason: >-
      A getter where it was a field, with the same values; `LightType` gained
      `LightType.custom` and `base`, so the set is open.

  - id: f2-app-defaultDevices
    package: flutter3d_app
    symbol: defaultDevices
    kind: manual
    guidance: >-
      There is no process-wide device registry. An engine owns one
      (`Flutter3dEngine.devices`, or `Flutter3dView(devices: ...)`), and an
      application that wants a backend or presenter of its own keeps a
      registry from `platformDevices()` and passes it:
      `openDevice(width: w, height: h, registry: mine)`. A device
      `openDevice` opened remembers its registry, so `presentFrame` finds the
      presenter without being handed it again. A test that put a fake in
      front of the real backends adds it to that registry instead.

  - id: f2-app-Scene3D-clearColor
    package: flutter3d_app
    symbol: Scene3D.clearColor
    kind: manual
    guidance: >-
      `Scene3D(clearColor:)` takes a `LinearColor`, in linear light, and
      encodes it to sRGB for the view. The `Vector4` it took was handed to
      the view as sRGB whatever its doc said, so to keep the picture write
      the old numbers as `LinearColor.fromSrgb(r, g, b, a)`.

  - id: f2-app-Scene3DController
    package: flutter3d_app
    symbol: Scene3DController
    kind: none
    reason: >-
      `device`, `renderer` and `scene` are getters where they were fields,
      reading through the new `engine`; every read compiles as it did.

  - id: f2-app-Flutter3dEngine-device
    package: flutter3d_app
    symbol: Flutter3dEngine
    kind: none
    reason: >-
      `device` and `renderer` are getters where they were final fields,
      since a device loss may replace either; every read compiles as it did.

  # ---- F2 (HAL): decision 4, E.12, duplicates, deprecations removed, internals hidden.

  - id: f2-hardware-GraphicsDevice-readPixels
    package: flutter3d_hardware
    symbol: GraphicsDevice.readPixels
    kind: rename
    to: readback
    guidance: >-
      `readPixels` and `readback` were two calls for the same bytes. `readback`
      is the one left: a whole texture in a float format is converted as
      `readPixels` converted it, and a texture that cannot be read throws
      (`ArgumentError`, or `DeviceResourceException`) where `readPixels`
      answered null, so a `!` after the call or a null check on its result can
      go.


  - id: f2-hardware-TextureAllocator-createTexture
    package: flutter3d_hardware
    symbol: TextureAllocator.createTexture
    kind: manual
    match: subtypes
    guidance: >-
      An allocator (a backend, a test's fake) overrides
      `createTexture(TextureDescriptor descriptor)` now. Make the 2D target it
      always made when `descriptor is RenderTargetDescriptor`, and the general
      form (what `createTextureWithDescriptor` made) otherwise, or refuse it
      with `UnsupportedCapability(DeviceFeature.textureWrites, …)`.

  - id: f2-hardware-GraphicsDevice-readBufferSync
    package: flutter3d_hardware
    symbol: GraphicsDevice.readBufferSync
    kind: manual
    guidance: >-
      A synchronous buffer read is a capability a device opts into, the
      `SynchronousBufferReadback` mixin, since WebGPU has no such call. Ask
      `device is SynchronousBufferReadback` (or for
      `DeviceFeature.synchronousReadback`) and call `readBufferSync` on the
      device as that type; a backend that implements it mixes the mixin in.

  - id: f2-hardware-GraphicsDevice-createTextureFromPixels
    package: flutter3d_hardware
    symbol: GraphicsDevice.createTextureFromPixels
    kind: manual
    guidance: >-
      Returns a `TextureHandle`, not a nullable one: pixels that are not the
      size the description needs throw a `DeviceResourceException`. Drop the
      `!`; where the null was a "texture left out", catch
      `DeviceResourceException` there.

  - id: f2-hardware-GraphicsDevice-createCubeTextureFromPixels
    package: flutter3d_hardware
    symbol: GraphicsDevice.createCubeTextureFromPixels
    kind: manual
    guidance: >-
      Returns a `TextureHandle`, not a nullable one: a device without cubes
      throws `UnsupportedCapability` (ask
      `features.has(DeviceFeature.cubeTextures)` first), and faces of the
      wrong count or size a `DeviceResourceException`.

  - id: f2-hardware-GraphicsDevice-createCubeRenderTarget
    package: flutter3d_hardware
    symbol: GraphicsDevice.createCubeRenderTarget
    kind: manual
    guidance: >-
