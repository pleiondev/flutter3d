  # wave 3b, written by hand
  - id: core-Renderer-extension-points
    package: flutter3d_core
    symbol: Renderer
    kind: manual
    members: [addContributor, removeContributor, contributors, addNode, removeNode, nodes]
    wave: 3
    guidance: >-
      One way into the frame since 1.0, `renderer.renderSteps`:
      `addContributor`, `removeContributor` and `contributors` moved there
      unchanged; `addNode(node, phase: ...)` is `renderSteps.addNode(node, at:
      anchor)` (`FramePhase.overlay` is `RenderAnchor.afterScene`,
      `FramePhase.present` is `RenderAnchor.beforePresent`, no `at` uses the
      node's `defaultAnchor`), and it hands back a `Registration` whose
      `cancel` is what `removeNode` was.

  # wave 3b, written by hand
  - id: core-Renderer-internals
    package: flutter3d_core
    symbol: Renderer
    kind: manual
    members: [vertexShader, skinnedVertexShader, instancedVertexShader, lightmappedVertexShader, debugLineVertexShader, debugLineFragmentShader, fullscreenVertexShader, compositeShader, lights, debugCascadeRadii, debugCascadeCentres, debugHiZ, debugMeterFailures, debugOnTargetRetired]
    wave: 3
    guidance: >-
      The renderer's own stages and test hooks are not its API since 1.0, so a
      shader change is not a major release. A stage is looked up by name,
      `renderer.shaders['DebugLineVertex']!`; the `debug*` hooks are for the
      engine's own tests, through
      `package:flutter3d_core/src/engine/render/renderer.dart`.

  # wave 3b, written by hand
  - id: hardware-GraphicsDevice-base
    package: flutter3d_hardware
    symbol: GraphicsDevice
    kind: manual
    match: subtypes
    wave: 3
    guidance: >-
      An `abstract base class` since 1.0, so a member added in a minor breaks
      no backend: write `extends GraphicsDevice` where you wrote `implements
      GraphicsDevice`, mark the class `final`, `base` or `sealed`, and drop
      `DeviceCapabilityForwarders` (the base class answers the deprecated
      getters). Feature-gated members have bodies that throw
      `UnsupportedCapability`; override what your backend has. New:
      `createPipelineAsync`, `lost`, `setLabel`, `releasePipeline`. A
      capability mixin such as `EncodedImageUpload` is `with`, not
      `implements`.

  # wave 3b, written by hand
  - id: hardware-PassEncoder-base
    package: flutter3d_hardware
    symbol: PassEncoder
    kind: manual
    match: subtypes
    wave: 3
    guidance: >-
      An `abstract base mixin class` since 1.0: an encoder writes `extends
      PassEncoder with CommandEncoder` (or `with RenderBundleEncoder`) where
      it wrote `implements CommandEncoder`. The debug groups
      (`pushDebugGroup`, `popDebugGroup`, `insertDebugMarker`) have bodies
      that do nothing.

