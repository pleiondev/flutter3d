  - id: sim-GameLoop
    package: flutter3d_sim
    symbol: GameLoop
    kind: manual
    guidance: >-
      `GameLoop` is gone; `EngineLoop` runs the fixed step as
      phases of systems. Make an `EngineLoop(input: …)` (its `timing:` and
      `catchUp:` default to what `GameLoop` did), move the body of `onStep`
      into a `LoopSystem` — a function of the `LoopContext`, whose `dt` is
      the step — added with `loop.addSystem(name, LoopPhase.physics, …)`,
      and call `loop.frame(dt)` where `gameLoop.advance(dt)` was called;
      `paused`, `alpha`, `playback` and `recorders` are on the new loop
      under the same names. The guide's "GameLoop to EngineLoop" section
      has the whole shape.

  - id: flame-HasFixedStep-fixedStep
    package: flame_flutter3d
    symbol: HasFixedStep.fixedStep
    kind: manual
    guidance: >-
      `fixedStep` is gone: the mixin runs an `EngineLoop`. Read
      `engineLoop`, override `createEngineLoop` to give it your own
      `WorldTiming` and `CatchUp`, and register step work in
      `installStepSystems`.

  - id: core-TonemapCurve-agxFull
    package: flutter3d_core
    symbol: TonemapCurve.agxFull
    kind: rename
    to: agx
    guidance: >-
      `TonemapCurve.agx` is the full AgX transform since 0.7.4;
      `agxFull` is the same curve under its old name.

  - id: core-RenderSettings-needsSurfaceBuffer
    package: flutter3d_core
    symbol: RenderSettings.needsSurfaceBuffer
    kind: manual
    guidance: >-
      A setting cannot see the frame, so `needsSurfaceBuffer` only ever
      modelled the built-in passes. Ask the compiled frame instead:
      `compiled.isConsumed(FrameResourceIds.surfaceBuffer)` on the
      `CompiledFrameGraph` the renderer built.

  - id: particles-ParticleSystem-emitFor
    package: flutter3d_particles
    symbol: ParticleSystem.emitFor
    kind: manual
    guidance: >-
      `emitFor` emitted a whole frame's worth at once, so what it made
      depended on the frame rate. Call `emit` for a burst, or give the
      emitter its rate and call `advance(dt)`, which spends it across fixed
      sub-steps.

  - id: sim-ActorSystem-focusBody
