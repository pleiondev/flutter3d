  # ---- F2: decision 11 (colours are LinearColor) and decision C (units).

  - id: f2-core-RenderMaterial-baseColor
    package: flutter3d_core
    symbol: RenderMaterial.baseColor
    kind: manual
    members: [baseColor]
    guidance: >-
      `RenderMaterial.baseColor` is a `LinearColor`, linear, and assigned
      whole. It was a `Vector4` holding the sRGB-encoded colour and changed in
      place. `baseColor: Vector4(r, g, b, a)` is
      `baseColor: LinearColor.fromSrgb(r, g, b, a)` (the picture does not
      change); `material.baseColor.setValues(...)` is
      `material.baseColor = LinearColor.fromSrgb(...)`; a read of `.x` that
      wanted the encoded number is `.toSrgb().r`, and `.w` is `.a`.

  - id: f2-core-RenderMaterial-emissive
    package: flutter3d_core
    symbol: RenderMaterial.emissive
    kind: manual
    members: [emissive]
    guidance: >-
      `RenderMaterial.emissive` is a linear `LinearColor`, assigned whole:
      `emissive: Vector3(r, g, b)` is `emissive: LinearColor(r, g, b)`, and
      `emissive.setValues(r, g, b)` is `emissive = LinearColor(r, g, b)`.

  - id: f2-core-RenderMaterial-emissiveStrength
    package: flutter3d_core
    symbol: RenderMaterial.emissiveStrength
    kind: manual
    members: [emissiveStrength]
    guidance: >-
      `emissiveStrength` is nits (cd/m²) since 1.0, the luminance an emissive
      of white shines at; the default is `Photometric.legacyNits` (1 843.2),
      which is what the old default of one drew. Multiply a pre-1.0 number by
      `Photometric.legacyNits` to keep the glow: `emissiveStrength: 4.0` is
      `4.0 * Photometric.legacyNits`. A `SurfaceMaterial`'s strength is a
      file's plain multiple and is unchanged; loading converts it.

  - id: f2-core-SurfaceMaterial-colours
    package: flutter3d_core
    symbol: SurfaceMaterial
    kind: manual
    members: [baseColor, emissive]
    guidance: >-
      `SurfaceMaterial.baseColor` and `emissive` are linear `LinearColor`s.
      `baseColor` held the authored sRGB-encoded tint as a `Vector4`; it is
      `LinearColor.fromSrgb(r, g, b, a)` of the same numbers. Files keep
      what they stored: each reader and writer converts.

  - id: f2-core-MaterialExtensions-colours
    package: flutter3d_core
    symbol: MaterialExtensions
    kind: manual
    members: [specularColor, sheenColor, attenuationColor]
    guidance: >-
      `specularColor`, `sheenColor` and `attenuationColor` are linear
      `LinearColor`s with `const` defaults: `Vector3(r, g, b)` is
      `LinearColor(r, g, b)`.

  - id: f2-core-ModelLight-color
    package: flutter3d_core
    symbol: ModelLight.color
    kind: manual
    members: [color]
    guidance: >-
      `ModelLight.color` is a linear `LinearColor`; `Vector3(r, g, b)` is
      `LinearColor(r, g, b)`, and it goes onto a `LightNode.color` as it is.

  - id: f2-core-MeshNode-tint
    package: flutter3d_core
    symbol: MeshNode.tint
    kind: manual
    members: [tint]
    guidance: >-
      `MeshNode.tint` is a `LinearColor` assigned whole:
      `node.tint.setValues(1, 0.3, 0.3, 1)` is
      `node.tint = LinearColor(1, 0.3, 0.3)`, `tint.w` is `tint.a`.

  - id: f2-core-MeshNode-outlineColor
    package: flutter3d_core
    symbol: MeshNode.outlineColor
    kind: manual
    members: [outlineColor]
    guidance: >-
      `MeshNode.outlineColor` is a linear `LinearColor`. It held the
      display-referred channels a `Color` gives; say those as
      `LinearColor.fromSrgb(r, g, b)` (or `color.toLinear()`), and the ring
      is the colour it was.

  - id: f2-core-HighContrastSettings-outlineColor
    package: flutter3d_core
    symbol: HighContrastSettings
    kind: manual
    members: [outlineColor, copyWith]
    guidance: >-
      `HighContrastSettings.outlineColor` is a linear `LinearColor`, encoded
      to the display where the line is drawn: a display colour is
      `LinearColor.fromSrgb(r, g, b)`.

  - id: f2-core-settings-colours
    package: flutter3d_core
    symbol: FogSettings
    kind: manual
    members: [color, resolvedColor, copyWith]
    guidance: >-
      The colours of `FogSettings`, `LightShaftSettings`,
      `VolumetricFogSettings` (`color`, `ambient`) and `XraySettings` are
      linear `LinearColor`s, so the settings can be `const`:
      `color: Vector3(r, g, b)` is `color: LinearColor(r, g, b)`, or
      `vector.toLinearColor()`.

  - id: f2-core-LightShaftSettings-color
    package: flutter3d_core
    symbol: LightShaftSettings
    kind: manual
    members: [color, copyWith]
    guidance: >-
      `color` is a linear `LinearColor`; see `f2-core-settings-colours`.

  - id: f2-core-VolumetricFogSettings-colours
    package: flutter3d_core
    symbol: VolumetricFogSettings
    kind: manual
    members: [color, ambient, copyWith]
    guidance: >-
      `color` and `ambient` are linear `LinearColor`s; see
      `f2-core-settings-colours`.

  - id: f2-core-XraySettings-color
    package: flutter3d_core
    symbol: XraySettings
    kind: manual
    members: [color, resolvedColor, copyWith]
    guidance: >-
      `color` is a linear `LinearColor`; see `f2-core-settings-colours`.

  - id: f2-core-DecalNode-colours
    package: flutter3d_core
    symbol: DecalNode
    kind: manual
    members: [color, emissive]
    guidance: >-
      `DecalNode.color` is a linear `LinearColor` with the opacity in its
      alpha (it was an sRGB `Vector4`: `LinearColor.fromSrgb(r, g, b, a)`
      keeps the picture), and `emissive` a linear `LinearColor`. Both are
      assigned whole: `decal.color.w = o` is
      `decal.color = decal.color.withAlpha(o)`.

  - id: f2-core-PlanarReflectorNode-tint
    package: flutter3d_core
    symbol: PlanarReflectorNode.tint
    kind: manual
    members: [tint]
    guidance: >-
      `tint` is a linear `LinearColor`, settable now:
      `tint: Vector3(r, g, b)` is `tint: LinearColor(r, g, b)`.

  - id: f2-core-LineStripNode-color
    package: flutter3d_core
    symbol: LineStripNode
    kind: manual
    members: [color]
    guidance: >-
      `LineStripNode(color:)` and `color` are a linear `LinearColor`.

  - id: f2-core-InstancedMeshNode-colours
    package: flutter3d_core
    symbol: InstancedMeshNode
    kind: manual
    members: [addInstance, acquire, setColor]
    guidance: >-
      An instance's colour is a linear `LinearColor`:
      `addInstance(m, color: Vector4(r, g, b, a))` is
      `addInstance(m, color: LinearColor(r, g, b, a))`, and
      `InstanceHandle.setColor` takes one too. `data` stays a `Vector4`.

  - id: f2-core-InstanceHandle-setColor
    package: flutter3d_core
    symbol: InstanceHandle.setColor
    kind: manual
    guidance: >-
      Takes a linear `LinearColor`; `vector.toLinearColor()` converts.

  - id: f2-core-SkyGradient-colours
    package: flutter3d_core
    symbol: SkyGradient
    kind: manual
    members: [zenith, horizon, nadir, sunColor, color]
    guidance: >-
      `SkyGradient`'s stops and `sunColor` are linear `LinearColor`s, and the
