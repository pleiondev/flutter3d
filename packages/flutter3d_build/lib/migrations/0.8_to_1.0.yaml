  # Wave 3c: formats, agents and tools.
  - id: mcpkit-OfferedTool-tool
    package: flutter3d_mcp_kit
    symbol: OfferedTool.tool
    kind: rename
    to: OfferedTool.spec
    wave: 3
    guidance: >-
      A tool is a `ToolSpec` now, flutter3d's own type with JSON-map schemas:
      read `spec.name`, `spec.description`, `spec.inputSchema`.

  - id: mcpkit-OfferedTool
    package: flutter3d_mcp_kit
    symbol: OfferedTool
    kind: manual
    wave: 3
    guidance: >-
      `OfferedTool` takes a `ToolSpec`, not the MCP library's `Tool`. Build
      it with `ToolSpec(name:, description:, inputSchema: {...})`, or keep the
      library's schema builders inside your package and convert with
      `ToolSpec(inputSchema: ObjectSchema(...) as Map<String, Object?>)`.

  - id: mcpkit-ProjectToolRun
    package: flutter3d_mcp_kit
    symbol: ProjectToolRun
    kind: manual
    wave: 3
    guidance: >-
      A project tool answers a `ToolResult` (`ToolResult.text('...')`, or
      `ToolResult(content: [ToolText(...), ToolImage(png)],
      structuredContent: {...})`), not a `CallToolResult`.

  - id: mcpkit-McpTools-addTool
    package: flutter3d_mcp_kit
    symbol: McpTools.addTool
    kind: manual
    wave: 3
    guidance: >-
      `addTool` takes a `ToolSpec`, and a plugin adding one must list
      `PluginPermission.tools` in its manifest's `permissions`, or the call
      throws a `PluginException`. Declare the namespace's schema version with
      `declareSchemaVersion('1.0.0')` before adding tools.

  - id: mcpkit-ToolTableServer
    package: flutter3d_mcp_kit
    symbol: ToolTableServer
    kind: manual
    match: subtypes
    wave: 3
    guidance: >-
      `ToolTableServer` holds the MCP server instead of extending it: its
      `MCPServer` members are gone (use `done`, `shutdown`, `serverInfo`),
      `toResult` returns a `ToolResult`, `onProjectCall` hears a
      `ToolResult`, and tools may be published as `area.verb` with `names:`.

  - id: mcpkit-resultOf
    package: flutter3d_mcp_kit
    symbol: resultOf
    kind: none
    wave: 3
    reason: >-
      It returns a `ToolResult` instead of a `CallToolResult`; a server's
      `toResult` takes it as before.

  - id: mcpkit-pictureResultOf
    package: flutter3d_mcp_kit
    symbol: pictureResultOf
    kind: none
    wave: 3
    reason: >-
      It returns a `ToolResult` instead of a `CallToolResult`; a server's
      `toResult` takes it as before.

  - id: mcpkit-refuseArguments
    package: flutter3d_mcp_kit
    symbol: refuseArguments
    kind: manual
    wave: 3
    guidance: >-
      `refuseArguments` takes a `ToolSpec`; pass `offered.spec`.

  - id: mcpkit-OfferedPrompt-prompt
    package: flutter3d_mcp_kit
    symbol: OfferedPrompt.prompt
    kind: manual
    wave: 3
    guidance: >-
      The server builds the protocol prompt itself; read `name` and
      `description` from the `OfferedPrompt`.

  - id: editor-PluginCommand-name
    package: flutter3d_editor_core
    symbol: PluginCommand
    kind: manual
    match: subtypes
    wave: 3
    guidance: >-
      A plugin's commands and components are published under its id:
      `addCommand('sink', ...)` through plugin `boats`'s view registers
      `boats.sink`, so your `PluginCommand.name` returns `'boats.sink'`, and a
      component kind `buoyancy` becomes `boats.buoyancy`.

  - id: sim-level-format-3
    package: flutter3d_sim
    symbol: Level
    kind: none
    wave: 3
    reason: >-
      Level documents are written at format 3: an `id` on every brush, light
      and entity, an entity's properties under `props`, overrides keyed by id
      paths, and the format envelope. Older documents still read and are
      upgraded on save; code that reads entity rows from `toJson()` finds
      properties under `props`. `Level` now extends `FormatDocument`.

  - id: sim-EntityDef-props
    package: flutter3d_sim
    symbol: EntityDef.reservedKeys
    kind: none
    wave: 3
    reason: >-
      The set now names every top-level key of an entity row the format keeps
      for itself (`props`, `components`, `id` and keys held for later);
      properties are under `props`. A row without `props` still reads in the
      old shape.

  - id: sim-Heightfield-exception
    package: flutter3d_sim
    symbol: Heightfield.fromJson
    kind: manual
    wave: 3
    guidance: >-
      A malformed heightfield throws `LevelFormatException`, not `dart:core`'s
      `FormatException`: catch `LevelFormatException` (or
      `Flutter3dFormatException`).

  - id: sim-Lightmap-exception
    package: flutter3d_sim
    symbol: Lightmap.fromBytes
    kind: manual
    wave: 3
    guidance: >-
      An unreadable lightmap throws `LightmapFormatException`, not
      `dart:core`'s `FormatException`: catch it (or
      `Flutter3dFormatException`).

  - id: editor-core-override-paths
    package: flutter3d_editor_core
    symbol: Editing.setOverride
    kind: none
    wave: 3
    reason: >-
      Overrides are stored by id path; a path given by name or `#<index>` is
      still accepted and converted, so callers need no change.

  - id: sim-InputTape-fromJson-throws
    package: flutter3d_sim
    symbol: InputTape.fromJson
    kind: manual
    wave: 3
    guidance: >-
      A tape that cannot be read throws `InputTapeFormatException`, a
      `Flutter3dFormatException`, not `dart:core`'s `FormatException`. Catch
      `InputTapeFormatException`, or `Flutter3dFormatException` for every
      format the engine reads.

  - id: core-format-exceptions
    package: flutter3d_core
    symbol: readFmat
    kind: manual
    wave: 3
    guidance: >-
      The readers in flutter3d_core throw their own leaf of
      `Flutter3dFormatException` instead of `dart:core`'s `FormatException`:
      `GltfFormatException` (glTF/GLB, `GlbContainer`, `decodeDataUri`),
      `FmatFormatException` (`readFmat`), `CubeLutFormatException`
      (`CubeLut.parse`), `MeshoptFormatException`, `FbxFormatException`,
      `MaterialBundleException` and `AnimationGraphFormatException`
      (`AnimationGraphJson.decode`). An `on FormatException` around one of
      them no longer catches: catch the leaf, or `Flutter3dFormatException`
      for all of them.

  - id: core-decodePng
    package: flutter3d_core
    symbol: decodePng
    kind: manual
    wave: 3
    guidance: >-
      `decodePng` returns a `DecodedImage` and throws an
      `ImageFormatException` saying why instead of returning null. Replace
      `if (decoded == null)` with a `try`/`on ImageFormatException`, or ask
      `isPng(bytes)` first when only the signature matters.

  - id: core-decodeJpeg
    package: flutter3d_core
    symbol: decodeJpeg
    kind: manual
    wave: 3
    guidance: >-
      `decodeJpeg` returns a `DecodedImage` and throws an
      `ImageFormatException` instead of returning null; `decodePng(b) ??
      decodeJpeg(b)` becomes `isPng(b) ? decodePng(b) : decodeJpeg(b)` inside
      a `try`.

  - id: core-decodeImagePure
    package: flutter3d_core
    symbol: decodeImagePure
    kind: manual
    wave: 3
    guidance: >-
      `decodeImagePure` completes with an `Rgba8Image` or fails with an
      `ImageFormatException`; it no longer completes with null. Drop the `!`
      and the null check, and catch the exception where an unreadable image
      is expected.

  - id: core-FrameCapture-parse
    package: flutter3d_core
    symbol: FrameCapture
    kind: manual
    wave: 3
    guidance: >-
      `FrameCapture.fromJson` and `FrameCapture.parse` return a capture or
      throw a `FrameCaptureFormatException` with the reason (another format,
      a newer version, no size) instead of returning null; catch it where a
      file may not be a capture. The constructor is no longer `const`
      (`FrameCapture` is a `FormatDocument` now). `fileFormat` is
      `f3d.frameCapture` and `fileVersion` 2; files written as
      `flutter3d.frameCapture` version 1 still read.

  - id: core-kF3dVersion
    package: flutter3d_core
    symbol: kF3dVersion
    kind: none
    wave: 3
    reason: >-
      It is the newest `.f3d` version this build reads, now 2 (the directory
      flags word and per-section stride). Every version-1 file still reads,
      and the writer still writes version 1 unless extra sections are given.

