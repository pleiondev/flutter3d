    symbol: HeadlessGame
    kind: manual
    match: subtypes
    wave: 3
    guidance: >-
      `HeadlessGame` is an `abstract base class`: a game `extends
      HeadlessGame` (and is `final` or `base`) instead of implementing it. A
      game that also implemented `VersionedSimulation` overrides
      `SimulationVersion? get simulation` instead.

  - id: sim-HeadlessRun
    package: flutter3d_sim
    symbol: HeadlessRun
    kind: manual
    match: subtypes
    wave: 3
    guidance: >-
      `HeadlessRun` is an `abstract base class`: a run `extends HeadlessRun`
      (or `RestorableRun`). `position` is a `WorldPosition`
      (`vector.toWorldPosition()` from `flutter3d_foundation`), and `eye` is a
      `WorldPosition` getter that defaults to `position` instead of
      `void eye(Vector3 out)`.

  - id: sim-HeadlessRun-position
    package: flutter3d_sim
    symbol: HeadlessRun.position
    kind: manual
    wave: 3
    guidance: >-
      `position` is a `WorldPosition`, in double precision: subtract with
      `relativeTo`/`distanceTo`, or narrow it to a `Vector3` relative to an
      origin with `toVector3Relative(origin)`.

  - id: sim-HeadlessRun-eye
    package: flutter3d_sim
    symbol: HeadlessRun.eye
    kind: manual
    wave: 3
    guidance: >-
