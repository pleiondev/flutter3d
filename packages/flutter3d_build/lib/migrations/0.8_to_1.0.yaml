      throws `UnsupportedCapability` — ask
      `features.has(DeviceFeature.cubeTextures)` first.

  - id: f2-hardware-DeviceCapabilityForwarders
    package: flutter3d_hardware
    symbol: DeviceCapabilityForwarders
    kind: manual
    guidance: >-
      The deprecated capability getters are gone from `GraphicsDevice`, and so
      is the mixin that answered them. Drop `with DeviceCapabilityForwarders`
      and ask `features`, `limits` and `textureFormatSupport` directly (the
      getters' own migrations name the rewrite for each).

  - id: f2-hardware-DeviceRegistry-open
    package: flutter3d_hardware
    symbol: DeviceRegistry.open
    kind: none
    reason: >-
      The signature is the same; what it throws when no backend starts is a
      `DeviceUnavailableException` (a `ResourceException`) rather than a
      `StateError`, with each backend's refusal in `refusals`. Code that
      caught `StateError` there catches `DeviceUnavailableException`.

  - id: f2-hardware-DeviceRegistry-presenterFor
    package: flutter3d_hardware
    symbol: DeviceRegistry.presenterFor
    kind: none
    reason: >-
      Matched with `device is T` rather than by exact runtime type, so a
