      writes changes.

  - id: f2-hardware-TraceEvent
    package: flutter3d_hardware
    symbol: TraceEvent
    kind: none
    reason: >-
      `TraceEvent` and `TracePassEvent` are `abstract base` rather than
      `sealed`, so a HAL call added in a 1.x minor adds an event without a
      break. A `switch` over them needs a `default` branch now (the analyzer
      says where); the replay's default throws naming the event's kind.

  - id: f2-hardware-RenderTargetDescriptor
    package: flutter3d_hardware
    symbol: RenderTargetDescriptor
    kind: none
    reason: >-
