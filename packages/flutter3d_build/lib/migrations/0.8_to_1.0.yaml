  - id: app-Storage
    package: flutter3d_app
    symbol: Storage
    kind: manual
    wave: 3
    guidance: >-
      `Storage` is asynchronous and an `abstract base class`. `read` answers
      `Future<String?>`, `write` a `Future<void>` that throws a
      `StorageException` when the platform refused, and `remove` a
      `Future<void>`: await them, and catch `StorageException` where a refused
      write used to be `false`. An implementation is written `extends Storage`
      with `async` overrides; a test can use `MemoryStorage` instead of its own.

  - id: app-FileStorage
    package: flutter3d_app
    symbol: FileStorage
    kind: manual
    wave: 3
    guidance: >-
      `FileStorage.read`, `write` and `remove` are asynchronous, as `Storage`
      is: await them, and catch `StorageException` from `write` where `false`
      was checked.

  - id: app-BinaryStorage
    package: flutter3d_app
    symbol: BinaryStorage
    kind: manual
    match: subtypes
    wave: 3
    guidance: >-
      `BinaryStorage` is an `abstract base class`: an implementation is
      written `extends BinaryStorage`. Its members are unchanged.

