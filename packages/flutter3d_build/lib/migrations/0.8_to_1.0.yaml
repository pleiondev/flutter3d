  # Wave 3a: the simulation side of the 1.0 contract.

  - id: sim-FixedStep
    package: flutter3d_sim
    symbol: FixedStep
    kind: manual
    wave: 3
    guidance: >-
      `FixedStep` is gone. A game steps through `EngineLoop`, whose step
      rate is a `WorldTiming` (`timing:`) and whose most steps a frame a
      `CatchUp`; `loop.frame(dt)` runs the steps owed and `loop.alpha` is
      the interpolation fraction `FixedStep.alpha` was.

  - id: sim-RunOutcome
    package: flutter3d_sim
    symbol: RunOutcome
    kind: manual
    wave: 3
    guidance: >-
      `RunOutcome` is a class with constants (`playing`, `lost`, `won`), so a
      later minor can add an outcome. The constants, `name`, `values` and
      `isOver` read as before; a `switch` over it needs a default case, and
      `RunOutcome.byName` replaces `values.byName`.

  - id: sim-MoverState
    package: flutter3d_sim
    symbol: MoverState
    kind: manual
    wave: 3
    guidance: >-
      `MoverState` is a class with constants (`closed`, `opening`, `open`,
      `closing`); comparisons read as before, and a `switch` over it needs a
      default case.

