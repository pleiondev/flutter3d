      than a `Cubit`: read `.value` where `.state` was read, listen with a
      `ValueListenableBuilder` where a `BlocBuilder` was, and call `dispose()`
      where `close()` was. `rebind` takes any action and its `part`
      (`rebindAction` is gone), and `reset(defaults)` takes the action map
      where `resetControls` took a button table.

