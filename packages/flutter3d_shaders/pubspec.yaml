name: flutter3d_shaders
description: The engine's shader sources, in GLSL, for every backend to compile.
version: 0.8.0
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - shaders
  - glsl
  - graphics
  - gpu

# Almost no Dart: one list, and the reason it is here rather than nowhere is
# that a backend has to be checkable against it. This package is source text —
# the
# lighting models, the shadow lookup, the post chain. What each backend does
# with it differs — impellerc compiles it ahead of time into a bundle, WebGL
# translates it to GLSL ES 3.00 and compiles it in the browser — but what a
# pixel ends up looking like is decided here, once, for both.
#
# It lived in flutter3d_impeller until there was a second backend, which is
# exactly how long that was the right place for it.
#
# **Flat, not a Flutter package** — the `flutter: sdk` dependency this pubspec
# carried since the `flutter3d_impeller` split was never real: `lib/`'s own
# `kRequiredShaders` is a plain `const` list, and `test/manifest_test.dart`
# only ever needed `test`/`expect` out of `flutter_test`, both of which
# `package:test` gives identically. Left alone, this was the one edge
# `flutter3d_conformance` — and everything that dev-depends on it, including
# every backend's own `conformance_test.dart` — resolved the Flutter SDK
# through for no reason at all.
environment:
  sdk: ^3.12.2

dev_dependencies:
  test: ^1.25.0

resolution: workspace
