name: flutter3d_boundaries
description: >-
  The rule that keeps the engine half of flutter3d from learning what a monster,
  a lap or a double jump is, as a test any package can run against itself.
version: 0.1.0
repository: https://github.com/dzolotov/flutter3d
publish_to: 'none'

environment:
  sdk: ^3.12.2

dependencies:
  # A test library in `dependencies` rather than `dev_dependencies`, which is
  # deliberate and unusual and has a precedent one directory away: this package
  # *is* tests, and the packages that run them take it as a dev dependency of
  # their own. See `flutter3d_conformance`, which makes the same trade for the
  # behaviour a backend has to have.
  #
  # **`test` and not `flutter_test`**, which is the whole reason this reads a
  # little oddly for a repository of Flutter packages: `flutter3d_physics` has
  # no Flutter in it at all — that is the boundary it exists to keep — and its
  # tests run on the Dart VM under `dart test`. A rule package that dragged in
  # `flutter_test` could not be used by the one package whose boundary is the
  # strictest.
  test: ^1.25.0

dev_dependencies:
  lints: ^6.0.0

resolution: workspace
