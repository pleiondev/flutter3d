name: flutter3d_formats
description: "Model formats for flutter3d: the document a decoder produces, its materials, and readers for glTF/GLB, OBJ, .f3d and .fmat — with no Flutter SDK behind them."
version: 0.6.0
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - gltf
  - obj
  - 3d
  - graphics
  - game-engine
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  # The vocabulary a decoder fills in: `MeshData`, `VertexLayout`, morph
  # targets. Every format here ends up as one of those, which is why geometry
  # is the package below this one rather than beside it.
  flutter3d_geometry: ^0.6.0

  vector_math: ^2.2.0

dev_dependencies:
  test: ^1.25.0
  flutter_lints: ^6.0.0

# **A plain Dart package, and reading a `.glb` without a Flutter SDK is the
# whole of what it is for.**
#
# These files sat in `flutter3d/lib/src/engine/assets` and named Flutter
# nowhere — and it bought nobody anything, because `flutter3d` declares
# `flutter: sdk`. The tool an agent starts with `dart run` could not import a
# glTF reader; neither could a service checking an uploaded model, nor a
# modeller's document layer, nor a `dart test` outside a Flutter checkout.
#
# What did not come is what actually needs the SDK: the isolate loader with its
# `kIsWeb`, the asset-bundle and `dart:io` sources, the bundle resolvers, and
# everything that names a `GraphicsDevice` — the KTX2 reader, `ModelAsset`,
# `ModelPart`, `texture_upload`. `flutter3d` keeps those and exports this
# package whole, so nothing above the split knows it happened.
