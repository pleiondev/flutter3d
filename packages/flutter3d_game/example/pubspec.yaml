name: flutter3d_game_example
description: "The application a new game starts as: a level you can walk around. Copied into the editor's templates."
publish_to: 'none'
version: 0.4.0+1
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # The assembly layer under `Flutter3dView`: the backend chooser with its
  # software fallback, the save file, the gamepad and the pointer capture.
  flutter3d_app:
    path: ../../flutter3d_app

  # Sound, for the project to wire where something happens.
  flutter3d_audio:
    path: ../../flutter3d_audio

  flutter3d:
    path: ../../flutter3d

  # The view, the input and the level walk; the loop, the genre's shape and
  # the event bus.
  flutter3d_game:
    path: ../

  # The words the settings and the other screens say, in the player's
  # language, and every widget a game adds over the level.
  flutter3d_game_ui:
    path: ../../flutter3d_game_ui
  flutter3d_sim:
    path: ../../flutter3d_sim

  vector_math: ^2.2.0

  # The plugin contract: the loop's phases, the bus and the host.
  flutter3d_plugin_api:
    path: ../../flutter3d_plugin_api


dev_dependencies:
  flutter_test:
    sdk: flutter

  # A renderer with no GPU under it, so a test can load a level the way the
  # game does. `LevelLoader` needs a device and does not need a window.
  flutter3d_cpu:
    path: ../../flutter3d_cpu

  flutter_lints: ^6.0.0

# **No `macos/` here on purpose.** This application exists to be analysed and to
# be copied; it is `flutter create --platforms=macos .` in the project it is
# copied into that gives it a window. Thirty files of platform tree per
# template, for an application nobody in this repository runs, is cost with no
# coverage.
flutter:
  uses-material-design: true

  assets:
    - assets/levels/
    - assets/models/
