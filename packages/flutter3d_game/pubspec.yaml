name: flutter3d_game
description: "The game layer on top of flutter3d: the touch, keyboard, mouse and gamepad devices, with the whole of flutter3d_sim re-exported."
version: 0.5.0
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - game-development
  - game-engine
  - input
  - simulation
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Relative mouse deltas, which Flutter offers on no desktop platform.
  pointer_lock: ^0.4.0

  # Sticks, triggers and buttons. A device package, exactly as pointer_lock is:
  # it knows nothing about actions or games, and `pad_input.dart` is the
  # translator — the same shape `DesktopInput` has beside the keyboard.
  pad_input: ^0.4.0

  # The simulation, and `flutter3d_physics` through it. Extracted because none
  # of it imported Flutter and a verifying server cannot install a Flutter SDK
  # to advance a step — see that package's pubspec for the whole reason.
  flutter3d_sim: ^0.5.0

  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Deliberately no dependency on flutter3d. Simulation, input and collision have
# nothing to say about how a frame is drawn, and keeping the two apart is what
# lets all of this be tested without a GPU — the same rule that already holds
# for the engine's own geometry and scene layers. `flutter3d_bridge` is where
# the two meet, and it depends on this package rather than the other way round.
