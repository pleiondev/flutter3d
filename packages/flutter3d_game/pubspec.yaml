name: flutter3d_game
description: "The game layer on top of flutter3d: a fixed timestep, device-independent input, collisions, levels and AI."
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Relative mouse deltas, which Flutter offers on no desktop platform.
  mouse_capture:
    path: ../mouse_capture

  # Sticks, triggers and buttons. A device package, exactly as mouse_capture is:
  # it knows nothing about actions or games, and `pad_input.dart` is the
  # translator — the same shape `DesktopInput` has beside the keyboard.
  gamepad:
    path: ../gamepad

  # Collision, queries and the character controller. Extracted because it
  # imported nothing from here, and because a collision world that knows what a
  # monster is cannot be used by a game that has none.
  flutter3d_physics:
    path: ../flutter3d_physics

  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Deliberately no dependency on flutter3d. Simulation, input and collision have
# nothing to say about how a frame is drawn, and keeping the two apart is what
# lets all of this be tested without a GPU — the same rule that already holds
# for the engine's own geometry and scene layers. `flutter3d_bridge` is where
# the two meet, and it depends on this package rather than the other way round.
  flutter3d_platformer: any
  platformer: any
