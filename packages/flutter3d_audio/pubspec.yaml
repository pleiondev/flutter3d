name: flutter3d_audio
description: "Positional audio for flutter3d: attenuation, panning and voice limiting, with a pluggable backend."
version: 1.0.0-rc.1
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - audio
  - sound
  - game-development
  - positional-audio

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: '>=3.44.0'

resolution: workspace

# The web too, where `flutter_soloud` plays: `lib/testing.dart` reads its
# file through `src/testing_files_io.dart`, chosen by
# `if (dart.library.js_interop)`, which `tool/structure.dart` checks.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  flutter:
    sdk: flutter
  flutter3d_audio_core: ^1.0.0-rc.1
  # `Issue`, the one type a library reports what it could not do in, and
  # `ResourceException`, the family a device that will not open belongs to.
  flutter3d_foundation: ^1.0.0-rc.1
  vector_math: ^2.2.0
  flutter_soloud: ^5.1.2

dev_dependencies:

  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
