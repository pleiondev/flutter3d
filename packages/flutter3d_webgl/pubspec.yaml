name: flutter3d_webgl
description: "A WebGL2 backend for flutter3d: the second implementation of flutter3d_hardware, and the one that tells us whether the HAL is a seam or a description of Impeller."
version: 1.0.0-rc.1
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - webgl
  - graphics
  - gpu
  - rendering
  - web
resolution: workspace

# Depends on the HAL and on nothing else of ours — in particular **not** on
# `flutter3d`, and not on `flutter3d_impeller`. That is the property the split was
# for: writing a backend means implementing `flutter3d_hardware`, not understanding
# the renderer.
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: '>=3.44.0'

# Declared rather than left to pub.dev's detector: WebGL2 through
# `dart:js_interop`, so the browser and nothing else.
platforms:
  web:

dependencies:
  flutter:
    sdk: flutter

  flutter3d_hardware: ^1.0.0-rc.1
  # `stageBindings`: what each of the engine's compiled stages keeps, which
  # the library hands every stage as `ShaderHandle.kept` and the encoder
  # refuses binds against — `gfx-92n`. A table of names and nothing else.
  flutter3d_shaders: ^1.0.0-rc.1
  # Browser APIs through static JS interop. `dart:html` and `dart:web_gl` are
  # the legacy path and are not available under Wasm.
  web: ^1.1.0

  vector_math: ^2.2.0

  # The foundation's value types and their crossings into `vector_math`.
  flutter3d_foundation: ^1.0.0-rc.1

dev_dependencies:
  # For `compareFrames` alone, in `cross_backend_test.dart`, which measures this
  # backend's committed reference set against Impeller's. A dev dependency and
  # not a real one: nothing in `lib/` reaches it, and two backends that depended
  # on each other at run time would not be two backends.
  flutter3d_cpu: ^1.0.0-rc.1
  # The behaviour flutter3d_hardware requires, as tests this backend runs
  # against itself. See flutter3d_conformance.
  flutter3d_conformance: ^1.0.0-rc.1
  # For `formats_encoder_conformance_test.dart` alone: a real BC1/BC3/ETC2
  # block from `ap-07`'s own encoders, drawn and read back on a real WebGL2
  # context. Not a real dependency — nothing in `lib/` reaches it.
  flutter3d_core: ^1.0.0-rc.1
  # For the tests only: engine_frame_test drives the real Renderer through this
  # backend, which is the one thing this package exists to make possible and so
  # the one thing worth testing. A dev dependency, so nothing a consumer builds
  # picks up the engine because the backend was installed.
  flutter3d: ^1.0.0-rc.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
