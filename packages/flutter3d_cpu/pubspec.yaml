name: flutter3d_cpu
description: >-
  A software backend for flutter3d_hardware: no GPU, no shading language, and
  therefore the sharpest test of whether the interface is an interface.
version: 0.8.0
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - graphics
  - rendering
  - rasterizer
  - testing

environment:
  sdk: ^3.12.2

dependencies:
  flutter3d_hardware: ^0.8.0
  # `stageBindings`: what each of the engine's compiled stages keeps, which
  # the library hands every stage as `ShaderHandle.kept` and the encoder
  # refuses binds against — `gfx-92n`. A table of names and nothing else.
  flutter3d_shaders: ^0.8.0
  vector_math: ^2.4.3

dev_dependencies:
  test: ^1.25.0
  flutter_lints: ^6.0.0
  flutter3d_conformance: ^0.8.0
  # For `render_project_test.dart` alone: `renderProject` itself
  # (`flutter3d_model_core`) and `ParametricCuboid` to build a project to hand
  # it (`flutter3d_mesh`). Not a real dependency — nothing in `lib/` reaches
  # either; the direction is the opposite one `render_project.dart`'s own doc
  # comment explains, and deliberately: `flutter3d_model_core` may not depend
  # on this package (it would carry the Flutter SDK straight into a package
  # that must resolve without it), but nothing stops this package depending
  # on it to prove the two actually work together.
  flutter3d_model_core: ^0.8.0
  flutter3d_mesh: ^0.8.0
  # For `render_snapshot_job_test.dart` and `scene_from_project_test.dart`:
  # the `RenderSettings`, projections and scene nodes a snapshot is described
  # and checked with; and for `mip_chain_quality_test.dart`, `ap-08`'s own
  # Kaiser-filtered chain from its formats library. Flat, like everything else
  # in this list.
  flutter3d_core: ^0.8.0
  # For `reactive_mask_test.dart`: an ember is a particle, and `R4` is about
  # what the temporal resolve does to one — drawn through the engine's own
  # contributor rather than a stand-in for it.
  flutter3d_particles: ^0.8.0

resolution: workspace
