name: flutter3d_cpu
description: >-
  A software backend for flutter3d_hardware: no GPU, no shading language, and
  therefore the sharpest test of whether the interface is an interface.
version: 0.6.0
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - graphics
  - rendering
  - rasterizer
  - testing

environment:
  sdk: ^3.12.2
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter3d_hardware: ^0.6.0
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter3d_conformance: ^0.6.0
  # Test-only, and deliberately so: the backend itself must not depend on the
  # engine. A backend that could not be compiled without it would not be an
  # implementation of an interface, it would be a part of the engine.
  flutter3d: ^0.6.0
  flutter3d_shaders: ^0.6.0
  # For `mip_chain_quality_test.dart` alone: `ap-08`'s own Kaiser-filtered
  # chain, sampled at a distant footprint. Not a real dependency — nothing in
  # `lib/` reaches it.
  flutter3d_formats: ^0.6.0
  # `pro-sc-01`'s own benchmark: an `EditMesh` big enough to sculpt is built
  # here and uploaded through this backend, which is test-only for the same
  # reason the two lines above are.
  flutter3d_mesh: ^0.6.0

resolution: workspace
