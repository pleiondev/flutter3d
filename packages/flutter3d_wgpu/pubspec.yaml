name: flutter3d_wgpu
description: "The compute sidecar for flutter3d: a compute-only GraphicsDevice over wgpu-native through dart:ffi, so compute steps run on the GPU when the drawing device has none."
version: 1.0.0-rc.1
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - gpu
  - compute
  - ffi
  - graphics
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

# Declared rather than left to pub.dev's detector: wgpu-native through
# `dart:ffi` on every native platform, and not the browser, where WebGPU
# computes for itself. A web build that imports `flutter3d_wgpu.dart` still
# compiles — the sidecar refuses to open there, saying why.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  # The contract the sidecar is a device of, and where its placement is
  # named (`ComputePlacement.sidecar`).
  flutter3d_hardware: '>=1.0.0-rc.1 <1.1.0'
  # The kernel language: a bundle's kernel section, translated to the WGSL
  # wgpu-native compiles.
  flutter3d_shaders: '>=1.0.0-rc.1 <1.1.0'
  flutter3d_foundation: '>=1.0.0-rc.1 <1.1.0'
  # Memory for the calls: strings and pointer arrays handed to the C side.
  ffi: ^2.1.0
  # The build hook (`tool/hook/wgpu_native.dart`): `native_toolchain_c`
  # compiles `csrc/` with
  # the target's own C compiler and links the pinned wgpu-native in;
  # `archive` unpacks the release and `crypto` checks its sha256.
  archive: ^4.2.0
  code_assets: ^2.1.0
  crypto: ^3.0.6
  hooks: ^2.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.5

dev_dependencies:
  test: ^1.25.0
  flutter_lints: ^6.0.0
  # The contract suite every backend passes, compute checks among it.
  flutter3d_conformance: '>=1.0.0-rc.1 <1.1.0'
