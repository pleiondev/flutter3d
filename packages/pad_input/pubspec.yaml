name: pad_input
description: "Reads a gamepad's sticks, triggers and buttons as a snapshot the caller asks for, with a dead zone applied and no opinion about what any button means."
version: 0.4.3+1
resolution: workspace
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - gamepad
  - input
  - controller
  - game-development

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

  # `navigator.getGamepads()`, which is the whole of the web backend: the
  # browser already normalises a controller to the W3C standard mapping, so
  # there is nothing for native code to do. Already used by flutter3d_webgl.
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.flutter3d.gamepad
        pluginClass: GamepadPlugin

      # One Swift source for both, under `darwin/`: `GameController.framework` is
      # the same framework on macOS and iOS, and a second copy would be a second
      # copy to fix.
      macos:
        pluginClass: GamepadPlugin
        sharedDarwinSource: true

      ios:
        pluginClass: GamepadPlugin
        sharedDarwinSource: true

      # XInput, polled; and the kernel's joystick interface. Both forward the
      # platform's own numbers, and `lib/src/desktop_mapping.dart` reads them.
      windows:
        pluginClass: PadInputPluginCApi

      linux:
        pluginClass: PadInputPlugin

      # The web needs no registration: the backend is pure Dart and
      # `lib/src/platform_default.dart` selects it with a conditional export.
