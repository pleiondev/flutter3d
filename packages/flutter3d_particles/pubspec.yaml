name: flutter3d_particles
description: >-
  A pooled CPU particle simulation for flutter3d, and the contributor that
  draws it. Its particles can be a light source, which is the part no other
  engine on this platform has.
version: 0.7.0
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - particles
  - graphics
  - rendering
  - effects

environment:
  sdk: ^3.12.2

dependencies:
  # For PassContributor and ContributorFrame — a contributor is defined by the
  # engine and implemented here, which is what makes this an extension rather
  # than a fork. The Flutter-free core, not `flutter3d`: a contributor is handed
  # a pass encoder, never a widget.
  flutter3d_core: ^0.7.0
  flutter3d_hardware: ^0.7.0
  vector_math: ^2.4.3

dev_dependencies:

  test: ^1.25.0
  flutter_lints: ^6.0.0

resolution: workspace

# **A plain Dart package, and one package rather than two.**
#
# The simulation was split into `flutter3d_particles_core` once, so that
# `flutter3d_model_core`'s `BakeParticleSystemJobRequest` could bake a
# `ParticleSystem` into a cache with no Flutter SDK to resolve. The two
# contributors that draw a system stayed here because they imported Flutter —
# for a `debugPrint` inside an `assert`, and for `flutter3d`'s barrel, which
# re-exports `flutter3d_core` whole. With `dart:developer`'s `log` and the core
# named directly, neither import was left, and the split had nothing to keep
# apart.
