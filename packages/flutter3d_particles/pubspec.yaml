name: flutter3d_particles
description: >-
  A pooled CPU particle simulation for flutter3d, and the contributor that
  draws it. Its particles can be a light source, which is the part no other
  engine on this platform has.
version: 0.1.0
repository: https://github.com/dzolotov/flutter3d
publish_to: 'none'

environment:
  sdk: ^3.10.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # For PassContributor and ContributorFrame — a contributor is defined by the
  # engine and implemented here, which is what makes this an extension rather
  # than a fork.
  flutter3d: ^0.1.0
  flutter3d_graphics: ^0.1.0
  vector_math: ^2.2.0

dev_dependencies:
  # The rule that this package names no genre, as a test it runs against itself.
  flutter3d_boundaries: ^0.1.0

  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

resolution: workspace
