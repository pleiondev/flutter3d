name: flutter3d_particles
description: >-
  A pooled CPU particle simulation for flutter3d, and the contributor that
  draws it. Its particles can be a light source, which is the part no other
  engine on this platform has.
version: 0.3.0
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - particles
  - graphics
  - rendering
  - effects
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  # For PassContributor and ContributorFrame — a contributor is defined by the
  # engine and implemented here, which is what makes this an extension rather
  # than a fork.
  flutter3d: ^0.3.0
  flutter3d_hardware: ^0.3.0
  vector_math: ^2.2.0

dev_dependencies:

  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

resolution: workspace
