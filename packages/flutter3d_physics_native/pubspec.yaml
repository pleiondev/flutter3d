name: flutter3d_physics_native
description: "The physics core in C11: rigid bodies stepped natively through dart:ffi, and in the browser as WebAssembly. flutter3d_physics is its reference."
version: 0.9.0
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - physics
  - simulation
  - ffi
  - game-development
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  # The build hook: `native_toolchain_c` compiles `csrc/` with the C compiler
  # a Flutter developer already has — Xcode's, the NDK's, MSVC — so a game
  # depending on this package needs no other toolchain. `code_assets` and
  # `hooks` are what the hook speaks; `logging` is what the builder reports
  # through.
  # The hook fetches wgpu-native for the GPU passes: `archive` unpacks it and
  # `crypto` checks its sha256 against the one pinned in the hook.
  archive: ^4.2.0
  code_assets: ^2.1.0
  crypto: ^3.0.6
  hooks: ^2.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.5
  vector_math: ^2.2.0
  # What NativeDynamics stands under: its bodies, colliders and world. Also
  # the reference the tests hold a native world to, with a tolerance, since
  # that one is in doubles.
  flutter3d_physics: ^0.9.0
  # The scene's skeletons, for the ragdoll a skinned character goes limp
  # into: its joints are scene nodes, its bind pose the skeleton's. Plain
  # Dart, so this package gains no Flutter by it.
  flutter3d_core: ^0.9.0

dev_dependencies:
  test: ^1.25.0
  flutter_lints: ^6.0.0

# The core as a WebAssembly module, for the browser: a Flutter web app
# serves it from assets/packages/flutter3d_physics_native/web/.
flutter:
  assets:
    - web/f3d_physics.wasm
    - web/f3d_physics_threads.wasm
    - web/f3d_worker.js
