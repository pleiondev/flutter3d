name: flutter3d_cloth
description: "An XPBD cloth solver: distance and cross-edge bending constraints, pins, gravity, wind, damping, substeps, collision against flutter3d_physics shapes. No Flutter, no renderer."
version: 0.6.0
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - physics
  - simulation
  - cloth
  - game-development
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  vector_math: ^2.2.0
  flutter3d_physics: ^0.6.0

dev_dependencies:
  test: ^1.25.0
  flutter_lints: ^6.0.0
