name: flutter3d_impeller
description: "The flutter_gpu backend for flutter3d: one implementation of flutter3d_hardware, and the only place in the stack that names a graphics API."
version: 0.4.5
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - graphics
  - gpu
  - rendering
  - flutter-gpu
resolution: workspace

# Depends on the HAL and on nothing else of ours — in particular **not** on
# `flutter3d`. That is what makes it a backend rather than a part of the engine,
# and it is the property a second backend needs: writing one means implementing
# `flutter3d_hardware`, not understanding the renderer.
environment:
  sdk: ^3.12.2

# Declared rather than left to pub.dev's detector, because the answer is a
# design fact: Flutter GPU is Metal and Vulkan, so this backend runs on every
# native platform and deliberately not on the web — the web is what
# flutter3d_webgl exists for, and the two are one-line swaps of each other.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  flutter:
    sdk: flutter

  # The low-level graphics API. It lives in bin/cache/pkg/flutter_gpu.
  flutter_gpu:
    sdk: flutter

  flutter3d_hardware: ^0.4.2

  # Named directly because the HAL's own signatures do: a clear value and a
  # blend constant are `Vector4`, and an implementation of `PassEncoder` cannot
  # spell them without this.
  vector_math: ^2.2.0

dev_dependencies:
  # Not flutter3d_conformance, though this backend is the one it exists for.
  # The suite needs a live GPU, so it runs as an application rather than a test:
  # tool/conformance.sh drives packages/flutter3d/example, and the dependency
  # belongs there. Declared here it was never imported by anything.
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# A note on where the GLSL is, because this package has none and used to.
#
# The headers an extension includes — `#include <lib/color.glsl>` and its
# neighbours — live in `flutter3d_shaders`, and have since a second backend
# appeared and the sources stopped belonging to either. This package holds the
# compiler invocation and the compiled artefact; it does not hold a `shaders/`
# directory, and a reader sent looking for one here finds nothing.
#
# Installing this package does not by itself give an extension that include
# root. impellerc resolves `<lib/…>` only against roots it was handed, so an
# extension depends on `flutter3d_shaders` and names it — one line reading
# `flutter3d_shaders` in its own `shaders/includes.txt`, or `-P
# flutter3d_shaders` on the command line. tool/build_shaders.sh resolves the
# name through package_config.json, which is what makes it work from the pub
# cache as well as from a path dependency.
#
# The headers reach a consumer as *files in flutter3d_shaders*, not as Flutter
# assets, which is why nothing lists them under `flutter.assets` there either:
# declaring them would copy GLSL source text into every shipping application's
# bundle, where nothing would ever read it. By the time the app runs, the only
# artefact that matters is the compiled .shaderbundle below.
# test/shader_include_test.dart is the guard that they ship at all.
flutter:
  assets:
    # Built by tool/build_shaders.sh through impellerc. Generated, so it is not
    # in the repository — a checkout has to run the script before the first run,
    # and again after every SDK change, because the bundle format is tied to the
    # Flutter version. The *published* package DOES carry it: the repository's
    # gitignore excludes it and pub packages by the gitignore, which is how
    # 0.4.0 shipped without its own shaders — see .pubignore, whose absence of
    # this line is the fix.
    - assets/shaders/flutter3d.shaderbundle
