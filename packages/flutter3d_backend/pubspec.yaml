name: flutter3d_backend
description: "Picks the graphics backend a build draws through: Impeller on a desktop, WebGL2 in a browser, chosen at compile time."
version: 0.1.0
publish_to: 'none'
resolution: workspace
repository: https://github.com/dzolotov/flutter3d

environment:
  sdk: ^3.12.2

# **A package rather than three copies in three games, and rather than a home in
# `flutter3d_session`.** The three files this replaces were byte-identical in the
# crypt and the platformer and differed by two constants in the racing game.
#
# Session was the obvious home and is the wrong one: it would have to depend on
# both backends, and then `apps/editor` — which opens a file, writes it back, and
# has no browser build to choose for — would pull WebGL through it. A package
# nothing but the three games depends on keeps the choice where it belongs and
# leaves session backend-neutral, which is what lets it be mounted over a
# `CpuDevice` in its own tests.
dependencies:
  flutter:
    sdk: flutter

  # The vocabulary the choice is made in. Neither backend appears in any
  # signature here — `openDevice` returns a `GraphicsDevice`.
  flutter3d_graphics: ^0.1.0

  # The two implementations. Only one is compiled: the conditional export in
  # `flutter3d_backend.dart` picks by `dart.library.js_interop`, because the two
  # pull in incompatible worlds — `flutter_gpu` does not compile for the web and
  # `dart:js_interop` does not compile for macOS.
  flutter3d_impeller: ^0.1.0
  flutter3d_webgl: ^0.1.0

dev_dependencies:
  # The rules this package keeps, as tests it runs against itself. See
  # flutter3d_boundaries.
  flutter3d_boundaries: ^0.1.0

  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
