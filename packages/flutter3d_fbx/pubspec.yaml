name: flutter3d_fbx
description: "FBX for flutter3d: a ModelDecoder for Autodesk's format, with no Flutter SDK behind it. The skeleton fmt-29d lands; the real reader is fmt-24/25."
version: 0.6.0
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - fbx
  - 3d
  - graphics
  - game-engine
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  # `ModelDecoder`, `ModelDocument`, `ModelLoadRequest` — the vocabulary
  # every decoder in this repository already speaks. Nothing else: an FBX
  # reader that needed `flutter3d_hardware` or `flutter3d` for a type would
  # have put the Flutter SDK back in front of the same callers `fmt-29d`'s
  # own row keeps this flat for.
  #
  # A version constraint, not a path: `pub publish` refuses the latter, and
  # the workspace resolves this one from the checkout regardless.
  flutter3d_formats: ^0.6.0

dev_dependencies:
  test: ^1.25.0
  flutter_lints: ^6.0.0

# **A plain Dart package, and the Flutter SDK is what it is defined by not
# having.** `fmt-29d`'s own row: the skeleton lands now — the barrel, the
# workspace registration, `FbxDecoder implements ModelDecoder` refusing
# every file it is handed — so the real reader (`fmt-24`, binary and ASCII
# 7.x parsing; `fmt-25`, skins and animation) has a package to land in
# rather than a second decision to make first.
#
# `tool/structure.dart`'s own "a flat Dart package resolves without the
# Flutter SDK" walks this package's dependencies and fails on the first one
# that puts a Flutter SDK back in front of a program that only wants to
# read a mesh.
