name: flutter3d_gpu
description: "The flutter_gpu backend for flutter3d: one implementation of flutter3d_hal, and the only place in the stack that names a graphics API."
version: 0.1.0
publish_to: 'none'
resolution: workspace

# Depends on the HAL and on nothing else of ours — in particular **not** on
# `flutter3d`. That is what makes it a backend rather than a part of the engine,
# and it is the property a second backend needs: writing one means implementing
# `flutter3d_hal`, not understanding the renderer.
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The low-level graphics API. It lives in bin/cache/pkg/flutter_gpu.
  flutter_gpu:
    sdk: flutter

  flutter3d_hal:
    path: ../flutter3d_hal

  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# A note on `shaders/`, which is deliberately NOT listed under `flutter.assets`
# below.
#
# `shaders/lib/*.glsl` are build-time inputs for an extension package: its
# materials write `#include <lib/color.glsl>`, and impellerc satisfies that from
# `<flutter3d_gpu>/shaders` as an include root. So they have to reach a consumer
# that installed this package from pub — but as *files in the package
# directory*, not as Flutter assets. Declaring them as assets would copy GLSL
# source text into every shipping application's bundle, where nothing would ever
# read it: by the time the app runs, the only artefact that matters is the
# compiled .shaderbundle.
#
# Nothing extra is needed to ship them. `pub publish` uploads every file in the
# package that git tracks and .gitignore does not exclude, and `shaders/` is
# checked in. The only way to lose them is to add an exclusion;
# test/shader_include_test.dart is the guard.
#
# They live here rather than in `flutter3d` because they are impellerc GLSL, and
# so is everything built from them. A second backend needs its own translation
# of the same materials, not a copy of these.
flutter:
  assets:
    # Built by tool/build_shaders.sh through impellerc. Generated, so it is not
    # in the repository — a checkout has to run the script before the first run,
    # and again after every SDK change, because the bundle format is tied to the
    # Flutter version.
    - assets/shaders/flutter3d.shaderbundle
