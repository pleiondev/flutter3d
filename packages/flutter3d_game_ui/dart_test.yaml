# **A test that runs longer than a minute is a bug until proven otherwise.**
# The proof is a `timeout:` on the test or a `@Timeout` on its file, with
# the reason and the measured time beside it, listed in `slowTestsAllowed`
# in tool/structure/repository.dart; the structure rule "a test runs in a
# minute unless its reason is listed" fails on one that is not.
#
# `testWidgets` hands every test a ten-minute timeout of its own, which
# would win over this one; test/flutter_test_config.dart turns that into
# a factor of one, so a widget test gets this minute too.
timeout: 1m

tags:
  # `test/accessibility_test.dart`: every widget here held to WCAG 2.2 at
  # level AA. tool/ci.sh runs this tag on its own in every package and
  # application that carries it, so a red one is named as an accessibility
  # failure rather than lost among the package's suite.
  accessibility:
