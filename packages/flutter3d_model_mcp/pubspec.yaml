name: flutter3d_model_mcp
description: "A model editor an agent can drive: an MCP server over stdio whose tools are the editor's own commands, one project per process."
version: 0.6.0
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - mcp
  - modelling
  - 3d
  - tooling
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  # The project and everything you can do to one. What keeps this package small
  # is that the commands are already values with a name, a `toJson` and a
  # `fromJson`, so a tool call is a map handed to `ModelCommand.fromJson` rather
  # than a switch written a second time here.
  flutter3d_model_core: ^0.6.0

  # `ModelDocument`, `F3dWriter`/`ObjWriter`, `decodeModel` — the export and
  # import verbs go through the same document abstraction the rest of the
  # engine does, rather than knowing about glTF or OBJ themselves — and
  # `FbxDecoder`, handed to `import`'s decode, so an agent asking for an FBX
  # is told what the file is and why it will not read rather than handed an
  # empty OBJ. All of it `flutter3d_core`'s formats library.
  flutter3d_core: ^0.1.0

  # `ElementLevel`, for the `select` verb's mesh-mode argument.
  flutter3d_mesh: ^0.6.0

  # `Vector3`/`Matrix4` — `anim-30`'s rig-pipeline tools (`autoRig`,
  # `paintWeights`, `bakeIk`) build these directly from a tool call's own
  # JSON, rather than only using them in a test the way this package once
  # did.
  vector_math: ^2.2.0

  # The protocol, pinned to one minor for the reason `flutter3d_editor_mcp`
  # gives: its own README opens with "still experimental and likely to evolve
  # quickly", and the narrowness is a decision rather than a default.
  dart_mcp: ">=0.5.2 <0.6.0"

  # The tool table, the answers and the server underneath this one — what
  # every server here shares.
  flutter3d_mcp_kit: ^0.6.0

  # The channel `ModelMcpServer` is built on. `model_http_server.dart` wires
  # one to a pair of controllers fed by real HTTP requests — the same
  # `StreamChannel<String>` shape `stdioChannel` gives the process's own
  # stdin/stdout, and what the suite's in-memory pair (dev-only, below) also
  # is, so all three transports hand `ModelMcpServer` the identical type.
  stream_channel: ^2.1.4

  # `CpuDevice` — `render`'s own device (`render_tool.dart`, `mcp-06n`), no
  # GPU and no display needed to exist. Flat itself now (see
  # `tool/structure/repository.dart`'s own `flatDartPackages` entry for it),
  # so this does not cost this package its own place in that same map.
  flutter3d_cpu: ^0.7.0

  # `GraphicsDevice` — the type `render_tool.dart`'s own device factory
  # returns, spelled directly rather than left to resolve only transitively
  # through `flutter3d_cpu`.
  flutter3d_hardware: ^0.7.0

dev_dependencies:
  test: ^1.25.0
  flutter_lints: ^6.0.0

# **A host starts this with `dart run`, and that is the whole of why every
# package under it is plain Dart.** `dart run` cannot resolve a package that
# depends on the Flutter SDK, so a single Flutter import anywhere in this graph
# is not a heavier process — it is a server that will not start on a machine
# without the Flutter tool. `a flat Dart package resolves without the Flutter
# SDK` in `tool/structure.dart` walks the graph and says so before anybody
# tries.
