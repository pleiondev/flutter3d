name: flutter3d_particles_core
description: "The pooled particle simulation flutter3d_particles draws: emission, ageing, affectors, curves. No Flutter, no renderer."
version: 0.6.0
repository: https://github.com/pleiondev/flutter3d
homepage: https://flutter3d.pleion.dev
issue_tracker: https://github.com/pleiondev/flutter3d/issues
topics:
  - particles
  - simulation
  - game-development
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  vector_math: ^2.2.0

dev_dependencies:

  test: ^1.25.0
  flutter_lints: ^6.0.0

# **A plain Dart package, and that is the point of it existing separately.**
#
# It came out of `flutter3d_particles`, where only two files —
# `particle_contributor.dart` and `mesh_particle_contributor.dart`, the ones
# that draw — ever imported Flutter. Every other file already imported nothing
# but `dart:math`, `vector_math` and its own siblings, the same shape
# `flutter3d_physics`'s own extraction from `flutter3d_game` found. What it
# buys is the boundary `flutter3d_model_core` needed: a headless caller can
# bake a `ParticleSystem` into a cache on the Dart VM, with no window and no
# Flutter SDK to resolve, the same way it already bakes a `Dynamics` rigid
# body through `flutter3d_physics`.
#
# `flutter3d_particles` depends on this package and re-exports its public API
# unchanged, so nothing that already imports
# `package:flutter3d_particles/flutter3d_particles.dart` has anything to
# change.
