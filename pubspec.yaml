name: flutter3d_workspace
description: "Repository root. Holds no code — only the list of packages."
publish_to: 'none'

# A pub workspace, so one `flutter pub get` resolves every package against a
# single lock file. Packages that depend on each other by path would otherwise
# drift apart at the first version bump, and the drift only shows up as an
# unbuildable checkout on another machine.
environment:
  sdk: ^3.12.2

workspace:
  - packages/flutter3d
  - packages/flutter3d_conformance
  - packages/flutter3d_cpu
  - packages/flutter3d_particles
  - packages/flutter3d_graphics
  - packages/flutter3d_shaders
  - packages/flutter3d_impeller
  - packages/flutter3d_webgl
  - packages/flutter3d_webgl/example
  - packages/flutter3d/example
  - packages/flutter3d_audio
  - packages/flutter3d_bridge
  - packages/flutter3d_game
  - packages/flutter3d_game_shooter
  - packages/flutter3d_game_platformer
  - packages/flutter3d_game_racing
  - packages/flutter3d_physics
  - packages/flutter3d_ui
  - packages/flutter3d_session
  - packages/gamepad
  - packages/gamepad/example
  - packages/mouse_capture
  - packages/mouse_capture/example
  - apps/dungeon
  - apps/editor
  - apps/platformer
  - apps/racing
  - apps/template_app
