name: flutter3d
description: "A 3D engine spike on Flutter GPU."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The low-level graphics API. It lives in bin/cache/pkg/flutter_gpu.
  flutter_gpu:
    sdk: flutter

  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Built by tool/build_shaders.sh through impellerc.
    - build/shaders/flutter3d.shaderbundle
    # The official Khronos test models (glTF-Sample-Assets).
    - assets/samples/
    - assets/samples/cube/
    - assets/samples/animated_cube/
