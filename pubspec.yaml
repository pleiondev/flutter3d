name: flutter3d_workspace
description: "Repository root. Holds no code — only the list of packages."
publish_to: 'none'

# A pub workspace, so one `flutter pub get` resolves every package against a
# single lock file. Packages that depend on each other by path would otherwise
# drift apart at the first version bump, and the drift only shows up as an
# unbuildable checkout on another machine.
environment:
  sdk: ^3.12.2

workspace:
  - packages/flutter3d
  - packages/flutter3d_geometry
  - packages/flutter3d_formats
  - packages/flutter3d_mesh
  - packages/flutter3d_model_core
  - packages/flutter3d_model_mcp
  - packages/flutter3d_samples
  - packages/flutter3d_app
  - packages/flutter3d_backend
  - packages/flutter3d_conformance
  - packages/flutter3d_cpu
  - packages/flutter3d_particles
  - packages/flutter3d_hardware
  - packages/flutter3d_shaders
  - packages/flutter3d_testing
  - packages/flutter3d_impeller
  - packages/flutter3d_webgl
  - packages/flutter3d_webgl/example
  - packages/flutter3d_webgpu
  - packages/flutter3d/example
  - packages/flutter3d_audio
  - packages/flutter3d_bridge
  - packages/flutter3d_game
  - packages/flutter3d_sim
  - packages/flutter3d_editor_core
  - packages/flutter3d_editor_mcp
  - packages/flutter3d_game_shooter
  - packages/flutter3d_game_strategy
  - packages/flutter3d_game_platformer
  - packages/flutter3d_game_racing
  - packages/flutter3d_physics
  - packages/flutter3d_screens
  - packages/flutter3d_session
  - packages/pad_input
  - packages/pad_input/example
  - packages/pointer_lock
  - packages/pointer_lock/example
  - apps/flutter3d_demo_dungeon
  - apps/flutter3d_editor
  - apps/flutter3d_modeler
  - apps/flutter3d_demo_platformer
  - apps/flutter3d_demo_racing
  - apps/flutter3d_demo_strategy
  - apps/flutter3d_template_app
  # Not a package and not an application: a program this repository runs on
  # itself, kept where `tool/`'s other programs are. See its own pubspec for
  # why it is not in `packages/`.
  - tool/webgpu_spike
