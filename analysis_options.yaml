# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
# Written by the SDK, not by hand. `flutter analyze` on 3.47 rewrites every
# analysis_options.yaml it reads, printing "Upgrading analysis_options.yaml to
# exclude build and platform directories" as it goes. It is committed here — in
# all twenty-nine of them — because the alternative is a tree that goes dirty every
# time anyone analyses it, and a CI job that reports modified files it did not
# modify on purpose.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # The three services under `cloud/` sit outside the pub workspace and
    # resolve on their own, and `tool/ci.sh` analyses each one right after its
    # own `pub get`. From here they were analysed a second time, before that
    # `pub get` had run, so on a fresh runner every import was unresolved:
    # about 1,500 errors that no developer machine could reproduce, because
    # every developer machine has the `.dart_tool` a runner does not.
    - cloud/**
    # The built site: the showcase's pages copied in as text for the site to
    # show, outside any package, so every import in them reads as missing.
    # Ignored by git, so only a machine that has built the site sees them.
    - site/dist/**
    # The migration test's fixture: a project written against 0.8, which is
    # supposed not to compile against this tree, and its migrated copy, which
    # names packages flutter3d_build does not depend on. The test copies both
    # out and analyses them as the project they are.
    - packages/flutter3d_build/test/fixtures/migrate_0_8/**
    # The same for each automatic migration kind: a `before/` written against
    # the old shape and an `after/` the kind's test compares byte for byte.
    - packages/flutter3d_build/test/fixtures/migrate_kinds/**
include: package:flutter_lints/flutter.yaml

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  # **One home, and every other package points here.** The twenty-eight other
  # `analysis_options.yaml` in this tree are each a two-line `include:` of this
  # file rather than a copy of it — before, they were nineteen identical copies
  # of the SDK's boilerplate, which meant enabling a rule was a nineteen-file
  # commit and nobody ever did it. Zero rules beyond `flutter_lints` have ever
  # been on.
  #
  # The per-package files keep their own `analyzer: exclude:` block, because
  # that is the part `flutter analyze` on 3.47 rewrites in place — see the note
  # above. Rules go here.
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cast_nullable_to_non_nullable
    - collection_methods_unrelated_type
    - directives_ordering
    - no_adjacent_strings_in_list
    - only_throw_errors
    - prefer_final_locals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - unnecessary_statements
    - unrelated_type_equality_checks
    - use_string_in_part_of_directives

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options

# **DCM: every rule dartr implements, the style ones off with their reason.**
# Listed whole because a section runs only the rules it names. The defects
# the rest find are fixed, or ignored on the line with the reason it is not
# one. `member-ordering` holds the order this tree writes: constructors,
# then fields; the members after them are not ordered.
dart_code_metrics:
  rules:
    - always-remove-listener
    # vectors, matrices and packed records are read by index
    - avoid-accessing-collections-by-constant-index: false
    - avoid-assignments-as-conditions
    - avoid-async-callback-in-fake-async
    - avoid-bottom-type-in-patterns
    - avoid-bottom-type-in-records
    - avoid-calling-notifier-members-inside-build
    - avoid-cascade-after-if-null
    - avoid-casting-to-extension-type
    - avoid-collection-equality-checks
    - avoid-collection-methods-with-unrelated-types
    # style, not a defect; off rather than ten thousand edits
    - avoid-complex-loop-conditions: false
    - avoid-conditions-with-boolean-literals
    - avoid-contradictory-expressions
    - avoid-double-slash-imports
    - avoid-duplicate-cascades
    - avoid-duplicate-exports
    - avoid-duplicate-map-keys
    - avoid-duplicate-mixins
    - avoid-duplicate-patterns
    - avoid-duplicate-switch-case-conditions
    - avoid-duplicate-test-assertions
    - avoid-empty-setstate
    - avoid-empty-spread
    - avoid-empty-test-groups
    - avoid-equal-expressions
    - avoid-excessive-expressions
    - avoid-explicit-pattern-field-name
    - avoid-future-tostring
    - avoid-generics-shadowing
    # style, not a defect; off rather than ten thousand edits
    - avoid-implicitly-nullable-extension-types: false
    - avoid-incomplete-copy-with
    - avoid-incorrect-image-opacity
    - avoid-incorrect-uri
    - avoid-inherited-widget-in-initstate
    - avoid-keywords-in-wildcard-pattern
    - avoid-late-context
    - avoid-late-final-reassignment
    - avoid-map-keys-contains
    - avoid-missed-calls
    - avoid-missing-completer-stack-trace
    - avoid-missing-controller
    - avoid-misused-set-literals
    - avoid-misused-test-matchers
    - avoid-misused-wildcard-pattern
    # style, not a defect; off rather than ten thousand edits
    - avoid-multi-assignment: false
    - avoid-negations-in-equality-checks
    - avoid-nested-futures
    - avoid-nested-records
    - avoid-not-encodable-in-to-json
    - avoid-notifier-constructors
    # style, not a defect; off rather than ten thousand edits
    - avoid-nullable-parameters-with-default-values: false
    - avoid-one-field-records
    - avoid-only-rethrow
    # style, not a defect; off rather than ten thousand edits
    - avoid-passing-self-as-argument: false
    - avoid-recursive-widget-calls
    - avoid-redundant-else
    # style, not a defect; off rather than ten thousand edits
    - avoid-redundant-positional-field-name: false
    - avoid-redundant-pragma-inline
    - avoid-ref-read-inside-build
    - avoid-ref-watch-outside-build
    - avoid-referencing-discarded-variables
    - avoid-self-assignment
    - avoid-self-compare
    - avoid-shadowed-extension-methods
    # style, not a defect; off rather than ten thousand edits
    - avoid-shadowing: false
    - avoid-suspicious-super-overrides
    - avoid-throw-in-catch-block
    - avoid-unassigned-late-fields
    - avoid-uncaught-future-errors
    - avoid-unconditional-break
    - avoid-unknown-pragma
    - avoid-unnecessary-call
    # style, not a defect; off rather than ten thousand edits
    - avoid-unnecessary-collections: false
    - avoid-unnecessary-conditionals
    - avoid-unnecessary-consumer-widgets
    - avoid-unnecessary-enum-arguments
    - avoid-unnecessary-extends
    - avoid-unnecessary-gesture-detector
    - avoid-unnecessary-if
    # style, not a defect; off rather than ten thousand edits
    - avoid-unnecessary-local-late: false
    - avoid-unnecessary-negations
    - avoid-unnecessary-overrides
    - avoid-unnecessary-overrides-in-state
    - avoid-unnecessary-reassignment
    - avoid-unnecessary-return
    - avoid-unnecessary-setstate
    - avoid-unnecessary-stateful-widgets
    - avoid-unnecessary-super
    # style, not a defect; off rather than ten thousand edits
    - avoid-unnecessary-type-assertions: false
    - avoid-unnecessary-type-casts
    - avoid-unrelated-type-assertions
    - avoid-unrelated-type-casts
    # a throwing first/single/[i] where an invariant holds is the right failure
    - avoid-unsafe-collection-methods: false
    # as avoid-unsafe-collection-methods
    - avoid-unsafe-reduce: false
    - avoid-unused-assignment
    - avoid-unused-generics
    - avoid-unused-instances
    - avoid-wildcard-cases-with-enums
    - avoid-wrapping-in-padding
    - check-for-equals-in-render-object-setters
    - consistent-update-render-object
    - list-all-equatable-fields
    - match-positional-field-names-on-assignment
    - member-ordering:
        order:
          - constructors
          - fields
        widgets-order:
          - constructors
          - fields
    # style, not a defect; off rather than ten thousand edits
    - move-variable-closer-to-its-usage: false
    - no-equal-conditions
    - no-equal-nested-conditions
    - no-equal-switch-case
    - no-equal-switch-expression-cases
    - no-equal-then-else
    - prefer-any-or-every
    # style, not a defect; off rather than ten thousand edits
    - prefer-bytes-builder: false
    # style, not a defect; off rather than ten thousand edits
    - prefer-const-border-radius: false
    - prefer-contains
    - prefer-correct-for-loop-increment
    - prefer-correct-future-return-type
    - prefer-correct-json-casts
    - prefer-correct-test-file-name
    # style, not a defect; off rather than ten thousand edits
    - prefer-declaring-const-constructor: false
    - prefer-dedicated-media-query-methods
    - prefer-explicit-function-type
    - prefer-iterable-of
    - prefer-null-aware-spread
    - prefer-overriding-parent-equality
    # style, not a defect; off rather than ten thousand edits
    - prefer-parentheses-with-if-null: false
    # style, not a defect; off rather than ten thousand edits
    - prefer-private-extension-type-field: false
    - prefer-public-exception-classes
    - prefer-return-await
    - prefer-simpler-patterns-null-check
    - prefer-specific-cases-first
    - prefer-switch-with-enums
    # dart format places the commas
    - prefer-trailing-comma: false
    - prefer-unique-test-names
    - prefer-wildcard-pattern
    - proper-super-calls
    - use-ref-read-synchronously
