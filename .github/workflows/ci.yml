# What runs on every push, and why it is four lines of steps.
#
# The work is in tool/ci.sh so that CI and a developer run the same thing. A
# workflow with the commands inlined drifts from what anybody can reproduce
# locally, and then its failures are nobody's to fix.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first run's answer worthless, and the
# runner is shared. Not on main: there, every commit's own result is worth
# having, because that is the history somebody bisects.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    # No GPU here, and none needed: the software backend draws the golden
    # scenes and cross_backend_test.dart compares the two committed reference
    # sets. The Impeller half runs from tool/golden.sh on a real device — see
    # the note at the top of tool/ci.sh.
    runs-on: ubuntu-latest
    # The run takes minutes. Without a bound, a step that hangs — a browser that
    # never reports, a `pub get` waiting on a prompt — holds the runner for six
    # hours and reports nothing at the end of it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      # impellerc lives in the engine artifacts, which a bare `flutter` install
      # has not downloaded yet. The shader bundle cannot be built without it,
      # and a test fails when the bundle is missing.
      - run: flutter precache --linux

      # `tool/check_icons.py` redraws the four applications' icons and compares
      # them with the committed ones. Without Pillow it says so and exits
      # non-zero, so that step failed on every run for the reason it could not
      # run at all — a check that proves nothing while looking like one that
      # does. Not pinned: the check compares pixels within a tolerance, so the
      # resampler is no longer an input to it.
      - run: pip install pillow

      # The "webgpu shaders" step regenerates the WGSL table and demands the
      # result be byte-identical to the committed one, so the two compilers it
      # runs are inputs to it: a different glslang or a different naga writes a
      # different table and the step goes red while both machines are right.
      # These are the versions the committed table was generated with, and they
      # are pinned for that reason rather than out of caution. Ubuntu's
      # `glslang-tools` is several major versions behind, which is why this
      # takes the Khronos release archive instead.
      - name: glslang
        run: |
          curl -fsSL https://github.com/KhronosGroup/glslang/releases/download/16.5.0/glslang-16.5.0-linux-x86_64-release.tar.gz \
            | sudo tar -xz -C /usr/local bin/glslang bin/glslangValidator
          glslangValidator --version

      # The "gltf validate" step in `tool/ci.sh` runs the real Khronos
      # validator against every glTF/GLB this repository ships. It is not the
      # npm package of the same name — that one has no `bin` entry, it is the
      # validator compiled to a JS library, meant to be `require()`d, and
      # `npx` finds nothing to run — so this fetches the actual command-line
      # tool Khronos ships as a native binary on its GitHub releases, the same
      # shape glslang's is fetched in above. Pinned, since a validator that
      # updates itself out from under a commit is a step whose answer nobody
      # could reproduce a week later.
      - name: gltf_validator
        run: |
          curl -fsSL https://github.com/KhronosGroup/glTF-Validator/releases/download/2.0.0-dev.3.10/gltf_validator-2.0.0-dev.3.10-linux64.tar.xz \
            | sudo tar -xJ -C /usr/local/bin gltf_validator
          # `--help` prints the usage and exits 1, so its status says nothing
          # and under `-e` it stopped the job before a single file was
          # validated. What this line is for is knowing the binary unpacked
          # and runs on this machine, and the banner answers that.
          (gltf_validator --help 2>&1 || true) | grep -q 'glTF 2.0 Validator'

      # naga has no package anywhere, so it is built once and kept. The cache
      # key is the version, which means a bump here fetches a fresh build
      # rather than a stale binary under a matching name.
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/naga
          key: naga-30.0.1
      - name: naga
        run: |
          command -v naga || cargo install naga-cli --version 30.0.1 --locked
          naga --version

      - run: tool/ci.sh

      # **A number per commit, so that a regression has something to be a
      # regression against.** `doc/model-editor.md` §6 carries the mesh figures
      # with the machine and the date beside them, because a figure without
      # either is a figure nobody can contradict — and until now those numbers
      # were taken by hand, once, on one laptop. This runs the same benchmark
      # on every push and keeps the output, so the next person comparing has a
      # series rather than a memory.
      #
      # Compiled rather than run under the JIT: the recorded numbers were taken
      # from `dart compile exe`, and a JIT run would be a different measurement
      # wearing the same name. Ten seconds either way.
      #
      # It does not fail the build. A benchmark that gates a merge on a shared
      # runner gates it on whoever else is on that machine — the budgets in
      # ARCHITECTURE §14 say the same about the engine's, and `qa-13` asks for
      # an artifact rather than a threshold.
      - name: bench the editable mesh
        run: |
          mkdir -p build/bench
          {
            echo "commit:  $GITHUB_SHA"
            echo "date:    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner:  $RUNNER_OS $(uname -m), Dart $(dart --version 2>&1)"
            echo
            dart compile exe packages/flutter3d_mesh/tool/bench.dart \
              -o build/bench/bench_mesh >/dev/null
            build/bench/bench_mesh
          } | tee build/bench/bench-mesh.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-mesh
          path: build/bench/bench-mesh.txt
          retention-days: 90

  # **A Dart SDK with no Flutter beside it, which is the machine six packages
  # promise to run on.**
  #
  # `flutter3d_model_mcp` is started by a host with `dart run`, and `dart run`
  # cannot resolve a package that depends on the Flutter SDK — so a single
  # Flutter import anywhere under it is not a heavier process, it is a server
  # that will not start. The same is true of `flutter3d_editor_mcp`, and of the
  # document and geometry layers underneath both.
  #
  # The check job cannot ask this. It installs Flutter, and one `flutter pub
  # get` at the root resolves the whole workspace against one lock file — so a
  # plain package with a Flutter dependency resolves there and nowhere else.
  # This job has no Flutter at all, which is the only way the question is real.
  flat-dart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.0'
      - run: tool/flat_dart_check.sh

  # **A second engine opens the files this one writes, which nothing here had
  # ever checked.** The design plan's line is "the exported file opens in Godot
  # and Unity", and K2 closed on 2026-09-09 with: headless Godot in CI —
  # `qa-19n` — and a manual Unity/Blender checklist before the phase-1 release,
  # because there is no headless Unity licence to put in a workflow.
  #
  # `tool/validate_gltf.dart` in the check job already runs the real Khronos
  # validator, and `compareModelDocuments` already asks whether a document
  # survives a round trip. Both are checks a file can pass while still being
  # unopenable by the program somebody wants to open it in. The first run of
  # this one found a committed tutorial GLB carrying a 33-byte "PNG" — a
  # signature, an IHDR, and a checksum field left at zero — that Godot's
  # importer rejected outright and ours had never looked at.
  #
  # A job of its own rather than a step in `check`, for the reason the android
  # matrix gives: `check` is already seventeen minutes and is what a push waits
  # for, and this brings an engine with it — a 50 MB archive holding a 112 MB
  # binary. The work itself is seconds: a cold import of the seven committed
  # GLBs and one script run over them measured 4.6 s on an idle developer's
  # machine and 21.7 s on the same machine under load, which is the honest
  # range rather than the flattering end of it.
  #
  # Flutter, even though `godot_check` is plain Dart and never draws anything:
  # one `flutter pub get` at the root is what resolves the workspace, and a
  # bare `dart pub get` there cannot, which is the whole subject of the
  # `flat-dart` job above.
  # **A lane that renders** — `gfx-72n`. The four jobs above run every test in
  # the repository, and none of them redraws a golden: `cross_backend_test.dart`
  # compares two *committed* reference sets against each other, and the pass
  # that actually re-renders lives in `packages/flutter3d/tool/golden.sh`, which
  # needs a built desktop application. So a golden that moved was caught when
  # somebody ran that script by hand, which is to say days later.
  #
  # The software rasteriser is what makes this affordable without a GPU: it
  # draws the same forty-four scenes as Impeller, deterministically, and has its
  # own committed reference set in `flutter3d_cpu/test/goldens`. The Impeller
  # half still needs a real device and always will.
  #
  # Under Xvfb because a Flutter desktop binary opens a window even when the
  # frame it draws is read back rather than shown. The GPU is not wanted here
  # and not used: `--cpu` hands the example the software backend.
  #
  # A job of its own for the reason the `godot` job gives: `check` is already
  # seventeen minutes and is what a push waits for, and this brings a desktop
  # toolchain with it.
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      # What a Flutter Linux desktop build links against, plus the display the
      # binary opens a window on. `xvfb` rather than a headless flag, because
      # there is no headless flag: the engine wants a surface, and whether
      # anybody looks at it is a separate question.
      - name: linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb

      - run: flutter pub get

      # impellerc lives in the engine artifacts, and both shader bundles are
      # built rather than committed.
      - run: flutter precache --linux
      - run: cd packages/flutter3d_impeller && dart run bin/build_shader_bundle.dart
      - run: cd packages/flutter3d/example && ./tool/build_shaders.sh

      # The comparison, not a recording: `--update` is what records, and a lane
      # that recorded would agree with itself for ever.
      - name: golden scenes, software backend
        run: xvfb-run -a packages/flutter3d/tool/golden.sh --cpu

      # **What the run actually drew, when it drew the wrong thing.** The
      # script writes `<scene>.actual.png` beside the reference it failed
      # against and says so, and until now that file died with the runner: a
      # failure here could be read as a count of differing pixels and nothing
      # else. Whether a golden moved because the renderer regressed or because
      # the reference is older than the code is a question a picture answers
      # in a second and a number never answers at all.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-goldens-actual
          path: packages/flutter3d_cpu/test/goldens/*.actual.png
          if-no-files-found: ignore

  # **Windows and Linux** — `gfx-73n`. The pubspec declared four platform
  # folders across ten applications and neither desktop was among them, so a
  # reader asking "which platforms can I ship" got a backend count for an
  # answer. The Impeller backend has no platform-specific code, so this is a
  # build target and a lane rather than an engine change — and a lane is the
  # only honest way to say it: the runners were generated from the SDK's own
  # templates on a machine that cannot compile either of them.
  #
  # The dungeon demo because that is the row's own subject, and a build rather
  # than a run because a first frame needs a display and, on Windows, a runner
  # this workflow has no way to drive. What a build proves is the half that
  # actually breaks: the CMake, the plugin registration, and every package in
  # the graph compiling for a platform none of them had been asked about.
  desktop:
    strategy:
      # Both, whichever fails: a matrix that stops at the first failure hides
      # whether the other one was ever going to work.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      # libasound2-dev is not part of the Flutter desktop toolchain: it is what
      # flutter_soloud's own ALSA backend compiles against, and the dungeon demo
      # is the application that pulls the audio plugin in. Without it the build
      # gets all the way to soloud_alsa.cpp and stops at a missing header.
      - name: linux desktop toolchain
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev

      - run: flutter pub get

      # The shader bundle is built rather than committed, and every application
      # that draws loads it.
      - run: flutter precache --${{ matrix.target }}
      - run: cd packages/flutter3d_impeller && dart run bin/build_shader_bundle.dart

      - name: build the dungeon demo
        run: cd apps/flutter3d_demo_dungeon && flutter build ${{ matrix.target }} --debug

  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get

      # Pinned, and the reason is the same one the glslang and gltf_validator
      # steps give: an importer that updates itself out from under a commit is
      # a step whose answer nobody could reproduce a week later. Godot's own
      # version is printed in the check's output for that reason too.
      #
      # The editor build and not a headless export template: `--import` is the
      # editor's, and `--headless` is what makes it runnable on a machine with
      # no display. Cached on the version, so a bump fetches a fresh binary
      # rather than a stale one under a matching name.
      - uses: actions/cache@v4
        with:
          path: ~/godot/godot
          key: godot-4.3-stable
      - name: godot
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          if [ ! -x ~/godot/godot ]; then
            curl -fsSL -o /tmp/godot.zip \
              https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
            unzip -q -o /tmp/godot.zip -d /tmp/godot
            mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 ~/godot/godot
            chmod +x ~/godot/godot
          fi
          ~/godot/godot --headless --version

      # The comparison's own suite, here rather than in `check`: that job's
      # test loop walks `packages/` and has never run anything under `tool/`
      # — see `tool/ci.sh`'s own note above its loop. These eleven break each
      # of the comparison's rules on purpose, which is the half where it could
      # be quietly wrong: a check that pairs surfaces badly, or forgives a
      # bound it should not, passes every committed fixture in silence.
      - run: dart test
        working-directory: tool/godot_check
      - run: dart run godot_check:godot_check --godot=$HOME/godot/godot

  # **A second operating system, because half of what this repository does is
  # macOS-only and nothing compiled it.** `tool/golden.sh` runs `flutter run -d
  # macos` and is the only way any of the three reference sets can be
  # re-recorded; `flutter3d_ui`'s storage branches on the platform; `pad_input`
  # and `pointer_lock` have Swift under them that Linux never sees. A build that
  # only ever ran on ubuntu could not say whether any of it still compiled.
  #
  # Analysis and the structure scan rather than `tool/ci.sh`: the browser steps
  # want a Chrome this runner does not have, and duplicating the whole gate on a
  # slower machine buys nothing the Linux job has not already said. No tests run
  # here, and saying otherwise would have this job standing in for coverage it
  # does not provide. What it asks is narrower and is the question ubuntu cannot
  # answer: does the macOS half resolve, compile its shader bundles and analyse
  # clean, and does the repository still hold its shape when a second operating
  # system reads it.
  #
  # And now iOS, because this is the only runner that can. Four builds as four
  # steps here rather than a matrix of four macOS jobs: the setup above —
  # checkout, the SDK, precache, `pub get`, the shader bundle — took a little
  # over two minutes on the last run that got that far, and a build measured
  # 2m14, 2m37, 2m27 and 1m54 on a developer's machine. Splitting them would pay
  # that setup four times to save about seven minutes, on the runner that is the
  # scarcest and the slowest to be handed out.
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter precache --macos --ios
      - run: flutter pub get
      # `ap-06`: the same real logic `hook/build.dart` uses for a real
      # `flutter build`/`flutter run`, called directly — `flutter analyze`
      # below does not run build hooks at all, so the declared asset has to
      # exist before it runs regardless of the hook existing.
      - run: (cd packages/flutter3d_impeller && dart run bin/build_shader_bundle.dart)

      # The example's bundle, for the reason ubuntu builds it in tool/ci.sh: it
      # is gitignored and the example declares it as an asset, so a checkout
      # without it fails `flutter analyze` outright — "the asset file
      # 'assets/shaders/example.f3dshaders' doesn't exist" — and this job died
      # two minutes in without ever reaching the structure scan below. Here
      # rather than earlier because the script wants impellerc from `flutter
      # precache` and a resolved workspace from `flutter pub get`, both of which
      # are above it; it brings nothing else with it.
      - run: (cd packages/flutter3d/example && ./tool/build_shaders.sh)

      # `flutter analyze` at the root walks into `cloud/`, and the two services
      # there are not workspace members — they resolve on their own, which
      # `tool/ci.sh` does for the ubuntu job and nothing did here. Unresolved,
      # every import of shelf, jaspr and postgres is an error: 752 of them, all
      # under `cloud/`, and none of them about the code.
      - run: (cd cloud/server && dart pub get)
      - run: (cd cloud/lessons/server && dart pub get)

      - run: flutter analyze
      - run: dart run tool/structure.dart

      # Last, because they are the slowest thing here and everything above
      # answers sooner. `--no-codesign` is what makes this runnable at all: it
      # sets CODE_SIGNING_ALLOWED=NO, so the DEVELOPMENT_TEAM every one of these
      # projects names never has to resolve to a certificate this machine does
      # not have. Release and not debug — the default, spelled out because it is
      # a choice: release is where the Dart AOT compiler runs, and it measured
      # about half a minute more per demo, which is a cheap price for the half
      # of the toolchain a debug build never touches.
      #
      # Four and not one, unlike the web build in tool/ci.sh. That one argues
      # the three games differ in their level and their genre package and not in
      # how they reach the browser, which is true of a compiler target. It is
      # not true of a platform folder: each of these carries its own Xcode
      # project, its own Info.plist and its own generated Swift, and four copies
      # of a thing nobody opens is four places for one of them to be different.
      - run: flutter build ios --no-codesign
        working-directory: apps/flutter3d_demo_dungeon
      - run: flutter build ios --no-codesign
        working-directory: apps/flutter3d_demo_platformer
      - run: flutter build ios --no-codesign
        working-directory: apps/flutter3d_demo_racing
      - run: flutter build ios --no-codesign
        working-directory: apps/flutter3d_demo_strategy

  # **Four applications configured for Android, and nothing had ever compiled
  # one.** `tool/ci.sh` said so in its own header until this job existed: both
  # mobile platforms configured, neither built, "for platforms nothing has yet
  # been played on". What that bought was four Gradle projects, four manifests
  # and four `build.gradle.kts` free to drift out of a working state, with one of
  # them tried by hand once and the other three never.
  #
  # A job of its own rather than steps in `check`, and the reason is the clock.
  # `check` is seventeen minutes and is already what a push waits for; the four
  # APKs measured 4m23, 3m13, 3m04 and 2m52 on a developer's machine — the first
  # paying for a cold Gradle daemon — which appended to `check` would put it past
  # forty. In parallel it costs nothing that was not already being spent.
  #
  # A matrix rather than four steps, which is the opposite of the choice made
  # for iOS above, and for the reason that made it: an ubuntu runner starts in
  # under a minute and there are many of them, so paying the setup four times is
  # cheap here and buys back three builds' worth of wall clock. It also puts the
  # name of the demo that failed in the job list instead of inside a log.
  #
  # `--debug` for the compile answer, because that is the question every clone
  # of this repository can ask and a debug APK answers it in two thirds of the
  # time. The release build below is a second question — does the thing that
  # would actually ship still assemble and get signed — and it is asked only
  # where there is a key to sign with.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One broken demo must not hide the state of the other three. The whole
      # point of building four is finding out about four.
      fail-fast: false
      matrix:
        demo: [dungeon, platformer, racing, strategy]
    steps:
      - uses: actions/checkout@v4

      # Explicit, because the Android Gradle plugin and the Kotlin `jvmTarget`
      # in every app's build.gradle.kts both name 17, and which JDK a runner
      # image happens to default to is not a thing this repository should be
      # finding out the hard way.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      # Most of a first Android build is downloading the plugin and its
      # dependencies. Keyed on the Gradle files, so a change to one of them
      # rebuilds the cache and everything else restores it; `restore-keys` means
      # a miss still starts from the last good one rather than from nothing.
      #
      # One key for all four legs and not one apiece, because the four demos
      # want the same dependencies and four copies of them is four times the
      # storage for nothing. The legs that lose the race to save it say "a cache
      # with this key already exists" and carry on, which is the intended
      # outcome and not a warning to chase.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/*/android/**/*.gradle*', 'apps/*/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # impellerc, for the shader bundle below, for the reason the check job
      # gives. The bundle is gitignored and `flutter3d_impeller` declares it as
      # an asset, so without it the APK build fails in Gradle's asset step with
      # a message about a missing file and nothing about shaders.
      #
      # `ap-06`'s hook builds this same bundle automatically once a real
      # `flutter build` starts — not verified here to fire early enough for
      # Gradle's own asset step specifically, so this direct call to the
      # hook's own logic stays, producing the identical file the old script
      # did.
      - run: flutter precache --linux
      - run: flutter pub get
      - run: (cd packages/flutter3d_impeller && dart run bin/build_shader_bundle.dart)

      - run: flutter build apk --debug
        working-directory: apps/flutter3d_demo_${{ matrix.demo }}

      # **The release key, when this checkout is one that has it.** A fork has no
      # secrets and a pull request from one is handed none either, which is the
      # constraint the whole mechanism is shaped around: the step must succeed
      # having done nothing, and the release build below must simply not happen,
      # rather than the job going red at somebody who was only trying to read
      # the repository.
      #
      # An output rather than testing the secret in an `if:`, because the
      # `secrets` context is not one an `if:` can see. The values go through the
      # environment and never through the command line, where a `ps` and a shell
      # trace can both reach them; the decoded keystore lands in `android/`,
      # which android/.gitignore already covers, next to the `key.properties`
      # each app's build.gradle.kts looks for.
      - id: key
        working-directory: apps/flutter3d_demo_${{ matrix.demo }}/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ]; then
            echo "no ANDROID_KEYSTORE_BASE64 here — skipping the release build."
            echo "A clone without the key still builds; it signs with the debug"
            echo "key, which is what apps/*/android/app/build.gradle.kts falls"
            echo "back to and is fine for everything except distribution."
            exit 0
          fi
          printenv KEYSTORE | base64 -d > upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties
          echo "signed=yes" >> "$GITHUB_OUTPUT"

      # The build that would ship, and the only one that proves the key works.
      # Signing failures are not the kind that turn up at a convenient moment:
      # a wrong alias or a keystore that decoded to nothing is a thing to find
      # out on a push, not on the evening somebody wanted to publish.
      - if: steps.key.outputs.signed == 'yes'
        run: flutter build apk --release
        working-directory: apps/flutter3d_demo_${{ matrix.demo }}
