# What runs on every push, and why it is four lines of steps.
#
# The work is in tool/ci.sh so that CI and a developer run the same thing. A
# workflow with the commands inlined drifts from what anybody can reproduce
# locally, and then its failures are nobody's to fix.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # No GPU here, and none needed: the software backend draws the golden
    # scenes and cross_backend_test.dart compares the two committed reference
    # sets. The Impeller half runs from tool/golden.sh on a real device — see
    # the note at the top of tool/ci.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      # impellerc lives in the engine artifacts, which a bare `flutter` install
      # has not downloaded yet. The shader bundle cannot be built without it,
      # and a test fails when the bundle is missing.
      - run: flutter precache --linux

      # `tool/make_icons.py` draws the four application icons, and the `icons`
      # step regenerates them and diffs the result. Without Pillow the script
      # says so and exits non-zero, so that step failed on every run for the
      # reason it could not run at all — a check that proves nothing while
      # looking like one that does.
      #
      # **Pinned, because the step compares bytes.** The first run with Pillow
      # present redrew three 32-pixel favicons differently from the committed
      # ones while every other size matched, which is a resampler that is not
      # the same resampler. A version floating with the runner turns a check
      # about the icons into a check about pip. This is the version the
      # committed icons were drawn with; not quiet, so the log says which one
      # ran.
      - run: pip install pillow==12.2.0

      - run: tool/ci.sh
