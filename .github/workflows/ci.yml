# What runs on every push, and why it is four lines of steps.
#
# The work is in tool/ci.sh so that CI and a developer run the same thing. A
# workflow with the commands inlined drifts from what anybody can reproduce
# locally, and then its failures are nobody's to fix.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first run's answer worthless, and the
# runner is shared. Not on main: there, every commit's own result is worth
# having, because that is the history somebody bisects.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    # No GPU here, and none needed: the software backend draws the golden
    # scenes and cross_backend_test.dart compares the two committed reference
    # sets. The Impeller half runs from tool/golden.sh on a real device — see
    # the note at the top of tool/ci.sh.
    runs-on: ubuntu-latest
    # The run takes minutes. Without a bound, a step that hangs — a browser that
    # never reports, a `pub get` waiting on a prompt — holds the runner for six
    # hours and reports nothing at the end of it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      # impellerc lives in the engine artifacts, which a bare `flutter` install
      # has not downloaded yet. The shader bundle cannot be built without it,
      # and a test fails when the bundle is missing.
      - run: flutter precache --linux

      # `tool/check_icons.py` redraws the four applications' icons and compares
      # them with the committed ones. Without Pillow it says so and exits
      # non-zero, so that step failed on every run for the reason it could not
      # run at all — a check that proves nothing while looking like one that
      # does. Not pinned: the check compares pixels within a tolerance, so the
      # resampler is no longer an input to it.
      - run: pip install pillow

      - run: tool/ci.sh

  # **A second operating system, because half of what this repository does is
  # macOS-only and nothing compiled it.** `tool/golden.sh` runs `flutter run -d
  # macos` and is the only way any of the three reference sets can be
  # re-recorded; `flutter3d_ui`'s storage branches on the platform; `pad_input`
  # and `pointer_lock` have Swift under them that Linux never sees. A build that
  # only ever ran on ubuntu could not say whether any of it still compiled.
  #
  # Analysis and the unit tests rather than `tool/ci.sh`: the browser steps want
  # a Chrome this runner does not have, and duplicating the whole gate on a
  # slower machine buys nothing the Linux job has not already said. What is
  # asked here is the question ubuntu cannot answer — does the macOS half build.
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter precache --macos
      - run: flutter pub get
      - run: (cd packages/flutter3d_impeller && ./tool/build_shaders.sh)
      - run: flutter analyze
      - run: dart run tool/structure.dart
