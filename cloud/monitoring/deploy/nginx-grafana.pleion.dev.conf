# /etc/nginx/sites-available/grafana.pleion.dev
#
# Served through a Cloudflare tunnel, like models.pleion.dev: nginx listens on
# loopback and Cloudflare terminates TLS. 8797 because 8790-8796 are already
# the documentation site, tooth and its API, models and its nginx, and
# lessons — see `cloud/README.md` and `cloud/lessons/README.md` for the rest
# of that list.
server {
    listen 127.0.0.1:8797;
    server_name grafana.pleion.dev;

    set_real_ip_from 127.0.0.1;
    real_ip_header   CF-Connecting-IP;
    absolute_redirect off;

    access_log /var/log/nginx/grafana.access.log;
    error_log  /var/log/nginx/grafana.error.log;

    # No auth_basic here. A first pass put one in front of Grafana's own
    # login, and it did the opposite of adding a layer: a browser caches a
    # Basic credential per origin and resends it on every request Grafana's
    # own JavaScript makes, so Grafana's API kept seeing an Authorization
    # header carrying nginx's password rather than Grafana's, read it as a
    # failed login attempt, and the account's brute-force lockout tripped
    # from traffic that was never a login form submission at all. Grafana's
    # own account system — sign-up and org-creation both off, see
    # `docker-compose.yml` — is the one gate here.
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        # Grafana's live dashboard updates and its alert stream both run over
        # a websocket; without the upgrade headers the connection falls back
        # to polling and a panel edited elsewhere lags behind.
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
