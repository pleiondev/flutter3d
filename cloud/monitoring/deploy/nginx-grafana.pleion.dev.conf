# /etc/nginx/sites-available/grafana.pleion.dev
#
# Served through a Cloudflare tunnel, like models.pleion.dev: nginx listens on
# loopback and Cloudflare terminates TLS. 8797 because 8790-8796 are already
# the documentation site, tooth and its API, models and its nginx, and
# lessons — see `cloud/README.md` and `cloud/lessons/README.md` for the rest
# of that list.
server {
    listen 127.0.0.1:8797;
    server_name grafana.pleion.dev;

    set_real_ip_from 127.0.0.1;
    real_ip_header   CF-Connecting-IP;
    absolute_redirect off;

    access_log /var/log/nginx/grafana.access.log;
    error_log  /var/log/nginx/grafana.error.log;

    # Grafana keeps its own account system behind this — two passwords, not
    # one, for a page that can read every count this service has. A leaked
    # Grafana session cookie alone is not enough to reach it, and neither is a
    # guessed Grafana password alone.
    auth_basic           "flutter3d models — monitoring";
    auth_basic_user_file /etc/nginx/.htpasswd-grafana;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        # Grafana's live dashboard updates and its alert stream both run over
        # a websocket; without the upgrade headers the connection falls back
        # to polling and a panel edited elsewhere lags behind.
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
