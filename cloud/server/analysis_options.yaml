# The repository's rules, less the two that do not fit a server.
#
# Not an `include` of the root file: that one starts from `flutter_lints`, which
# this package does not depend on and should not, so the include would resolve
# to nothing and every rule under it would silently go.
include: package:lints/recommended.yaml

analyzer:
  exclude:
    - build/**
    - lib/**.options.dart

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cast_nullable_to_non_nullable
    - collection_methods_unrelated_type
    - directives_ordering
    - no_adjacent_strings_in_list
    - only_throw_errors
    - prefer_final_locals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - unnecessary_statements
    - unrelated_type_equality_checks
    # `avoid_slow_async_io` is the rule left out. It is right for a tool that
    # runs once and wrong for a server: a synchronous `exists()` holds the one
    # event loop every other request is waiting on.
