name: flutter3d_models
description: >-
  The account, the models a person keeps in it, and the catalogue they can be
  published to. Serves models.pleion.dev.
publish_to: none
version: 0.1.0

# **Outside the workspace on purpose.** The repository root lists the packages
# that go to pub.dev, and every one of them is counted in the README, checked by
# `tool/structure.dart` and released together. This is a service, not a package:
# it is never published, its version means nothing to anybody else, and it
# depends on the engine the way an outside application does — by version, from
# pub.dev. Naming no `resolution` is what keeps it out: the root pubspec does
# not list this directory, so pub resolves it on its own and writes its own
# lock file here.

environment:
  # Below the 3.12.2 the workspace asks for, because the server it runs on has
  # Dart 3.11 and the packages here need none of what came after 3.10.
  sdk: ^3.10.0

dependencies:
  # The page, rendered on the server. A cabinet that arrives as finished HTML
  # opens in one request, and a catalogue that arrives that way is a catalogue a
  # crawler can read.
  jaspr: ^0.23.4

  # Everything that is not a page: the form handlers, the JSON API and the file
  # downloads. `serveApp` from jaspr is itself a shelf handler, so the two share
  # one server rather than one proxying the other.
  shelf: ^1.4.2
  shelf_router: ^1.1.4

  postgres: ^3.5.12

  # What a model is, read on the server by the same code that reads it in the
  # editor: `sniffModelFormat`, `decodeModel`, `readProject`. An upload that
  # does not parse here never reaches the disk.
  flutter3d_core:
    path: ../../packages/flutter3d_core
  flutter3d_model_core:
    path: ../../packages/flutter3d_model_core

  # `ParticleSystem`, what a baked simulation cache reads back — the same
  # package `flutter3d_model_core` depends on for `pro-sim-02`'s own row.
  flutter3d_particles:
    path: ../../packages/flutter3d_particles

  # Published, but not yet at the `0.7.0` `flutter3d_model_core` now asks
  # for (`doc/package-merge-plan.md` §3.1 folded cloth in here) — a path
  # dependency until that release actually goes out.
  flutter3d_physics:
    path: ../../packages/flutter3d_physics

  # Argon2id for passwords, in Dart. The FFI binding to libargon2 stopped at
  # Dart 2, and a password hash is the one place where a dependency that has
  # stopped is not a trade worth making.
  pointycastle: ^4.0.0

  crypto: ^3.0.7
  http: ^1.2.0

dev_dependencies:
  build_runner: ^2.6.0
  build_web_compilers: ^4.2.0
  jaspr_builder: ^0.23.4
  lints: ^6.0.0
  test: ^1.25.0

  # `tool/embed_migrations.dart` formats its own output before writing it, so
  # `--check`'s byte comparison and the repository's own `dart format` step
  # never disagree about the same file.
  dart_style: ^3.1.0

# **Six packages by path** — four not on pub.dev yet, two published but not in
# the shape `flutter3d_model_core` now needs: `flutter3d_physics` not at the
# version it asks for, and `flutter3d_particles` still at the 0.6.0 that named
# Flutter. The
# core (with the geometry and formats folded into it), mesh, document and
# particle layers were written after the 0.6.0 set went out and go with the
# next one. Until they are all published at a matching version, a path is the
# only way to name them, and an override is what makes the path win over the
# version they ask of each other.
#
# `flutter3d_mesh` and `flutter3d_hardware` are here because
# `flutter3d_model_core` and `flutter3d_core` name them as hosted
# dependencies they cannot resolve until the next set is published.
#
# When it is, these lines go and the dependencies above become ordinary hosted
# ones.
dependency_overrides:
  flutter3d_core:
    path: ../../packages/flutter3d_core
  flutter3d_hardware:
    path: ../../packages/flutter3d_hardware
  flutter3d_mesh:
    path: ../../packages/flutter3d_mesh
  flutter3d_model_core:
    path: ../../packages/flutter3d_model_core
  flutter3d_particles:
    path: ../../packages/flutter3d_particles
  flutter3d_physics:
    path: ../../packages/flutter3d_physics

jaspr:
  mode: server
