# /etc/nginx/sites-available/models.pleion.dev
#
# Served through a Cloudflare tunnel, like flutter3d.pleion.dev and
# tooth.pleion.dev: nginx listens on loopback and Cloudflare terminates TLS.
server {
    listen 127.0.0.1:8793;
    server_name models.pleion.dev;

    # The real client address arrives from the tunnel, not from the socket, and
    # is passed on to the service, which rate limits by it.
    set_real_ip_from 127.0.0.1;
    real_ip_header   CF-Connecting-IP;

    # Behind the tunnel nginx only sees 127.0.0.1:8793, so an absolute redirect
    # would advertise that loopback port to the world.
    absolute_redirect off;

    access_log /var/log/nginx/models.access.log;
    error_log  /var/log/nginx/models.error.log;

    # A little over the service's own 100 MB, so that the service is the one
    # that refuses a large upload, with a sentence, rather than nginx with a
    # bare 413 page.
    client_max_body_size 110m;

    # The stylesheet, the favicon and two small scripts. Named without hashes,
    # so kept briefly and revalidated.
    location /assets/ {
        alias /opt/flutter3d-models/assets/;
        expires 5m;
        add_header Cache-Control "public, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The modeller's web build. Nothing a Flutter build emits carries a hash in
    # its name, so every file revalidates — the documentation site found out
    # what an edge keeping `flutter_bootstrap.js` for four hours does.
    location /app/ {
        alias /opt/flutter3d-models/app/;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        # Only the service's own model page may frame it.
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # nginx's stock mime.types predates .mjs, and a module served as
    # application/octet-stream fails the browser's MIME check.
    location ~ ^/app/.*\.mjs$ {
        root /opt/flutter3d-models;
        rewrite ^/app/(.*)$ /app/$1 break;
        types { }
        default_type text/javascript;
        add_header Cache-Control "no-cache" always;
    }

    # Registration counts, model counts and disk usage, for whoever asks. The
    # service itself checks no credential on this route — see the comment
    # above `/metrics` in `cloud/server/lib/src/http/app.dart` — so this is
    # the only thing standing between it and the public internet. Prometheus
    # never reaches it through here: it runs on this same host, in the
    # monitoring stack's own network namespace, and scrapes 127.0.0.1:8794
    # directly (see `cloud/monitoring/prometheus/prometheus.yml`).
    location = /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8794;
    }

    location / {
        proxy_pass         http://127.0.0.1:8794;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        # Uploads are streamed to the service as they arrive, so its own limit
        # is what stops a large one, and nginx does not spool it to disk first.
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_types      text/css application/javascript text/javascript application/json
                    image/svg+xml model/gltf+json;
}
