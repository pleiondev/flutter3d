name: flutter3d_lessons
description: >-
  A public page and an embeddable iframe for an edu-00 lesson document.
  Serves lessons.pleion.dev.
publish_to: none
version: 0.1.0

# Outside the workspace, same reason `cloud/server` is: a service, never
# published, resolving its own lock file rather than joining the root
# pubspec's `resolution`.

environment:
  # Below the 3.12.2 the workspace asks for, same floor as `cloud/server`:
  # bob has Dart 3.11, and this needs nothing past 3.10.
  sdk: ^3.10.0

dependencies:
  # Routes and the static viewer mount. No jaspr: there is no form, no
  # session, nothing reactive — two pages that read a fixed, in-code registry
  # need nothing a page-component library would give them.
  shelf: ^1.4.2
  shelf_router: ^1.1.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
