# /etc/nginx/sites-available/lessons.pleion.dev
#
# Served through its own Cloudflare tunnel, the same pattern as
# models.pleion.dev: nginx listens on loopback and Cloudflare terminates TLS.
# A separate vhost and a separate tunnel from models.pleion.dev on purpose —
# Dmitrii asked for lessons on its own subdomain, isolated from the model
# catalogue, not a second route hung off that service.
server {
    listen 127.0.0.1:8795;
    server_name lessons.pleion.dev;

    set_real_ip_from 127.0.0.1;
    real_ip_header   CF-Connecting-IP;

    # Behind the tunnel nginx only sees 127.0.0.1:8795, so an absolute
    # redirect would advertise that loopback port to the world.
    absolute_redirect off;

    access_log /var/log/nginx/lessons.access.log;
    error_log  /var/log/nginx/lessons.error.log;

    # The lesson viewer's web build. Nothing a Flutter build emits carries a
    # hash in its name, so every file revalidates — the same finding
    # models.pleion.dev's own vhost already writes down.
    #
    # No `X-Frame-Options` here, unlike models.pleion.dev's `/app/`: that
    # service only ever frames its own viewer from its own model page
    # (`SAMEORIGIN`); this one's viewer is loaded from `/e/<slug>`, an address
    # a THIRD-PARTY page frames on purpose — adding a restrictive header here
    # would break the embed at the nginx layer.
    location /app/ {
        alias /opt/flutter3d-lessons/app/;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # nginx's stock mime.types predates .mjs, and a module served as
    # application/octet-stream fails the browser's MIME check.
    location ~ ^/app/.*\.mjs$ {
        root /opt/flutter3d-lessons;
        rewrite ^/app/(.*)$ /app/$1 break;
        types { }
        default_type text/javascript;
        add_header Cache-Control "no-cache" always;
    }

    # `/e/<slug>` on its own, ahead of the general proxy below: found by
    # actually curling the deployed service, not by reading the app's own
    # code — `dart:io`'s `HttpServer` sets `X-Frame-Options: SAMEORIGIN`
    # (and `X-XSS-Protection`, `X-Content-Type-Options`) on every response
    # by default, at the transport layer, before `shelf` ever sees the
    # response object. `cloud/lessons/server`'s own `_securityHeaders()`
    # middleware only controls `shelf`'s `Response.headers` map — it has no
    # handle on a header the runtime pre-populated outside that map, so
    # omitting the header from shelf's side (which the code does correctly)
    # is not the same as it being absent on the wire. `proxy_hide_header`
    # is the layer that actually can strip it, since nginx sees and can
    # drop the finished upstream response.
    location /e/ {
        proxy_pass         http://127.0.0.1:8796;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_hide_header  X-Frame-Options;
    }

    location / {
        proxy_pass         http://127.0.0.1:8796;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_types      text/css application/javascript text/javascript application/json
                    image/svg+xml;
}
