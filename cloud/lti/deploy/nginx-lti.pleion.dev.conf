# /etc/nginx/sites-available/lti.pleion.dev
#
# Same pattern as models.pleion.dev/lessons.pleion.dev: nginx listens on
# loopback, Cloudflare terminates TLS through its own tunnel.
server {
    listen 127.0.0.1:8797;
    server_name lti.pleion.dev;

    set_real_ip_from 127.0.0.1;
    real_ip_header   CF-Connecting-IP;
    absolute_redirect off;

    access_log /var/log/nginx/lti.access.log;
    error_log  /var/log/nginx/lti.error.log;

    # **Why every location here strips X-Frame-Options, unlike
    # models.pleion.dev's own vhost.** A platform commonly opens an LTI tool
    # in an iframe inside its own course page (Moodle's "New window"/
    # "Embed" launch container setting; Canvas embeds by default) — the
    # opposite of what a model's own page wants. `dart:io`'s `HttpServer`
    # adds `X-Frame-Options: SAMEORIGIN` to every response by default, at
    # the transport layer, before `shelf` ever builds the response object
    # this service returns (the same finding `cloud/lessons`'s own `/e/`
    # location already writes down) — omitting the header from the
    # service's own `Response` does not make it absent on the wire, so the
    # strip has to happen here.
    #
    # **Permissive on purpose, for now.** The honest fix is a
    # `Content-Security-Policy: frame-ancestors <platform issuer>` scoped to
    # the one platform this service is configured for — but that platform's
    # origin lives in `LTI_PLATFORM_ISSUER`, an environment variable this
    # static file cannot read, and `doc/edu-03-lti-plan.md` §4 already
    # defers a real multi-platform model to the cloud track's team
    # projects. Revisit when there is more than one platform to scope
    # against, or when this file can be templated from the same
    # environment the service reads.
    location /app/ {
        alias /opt/flutter3d-lti/app/;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/app/.*\.mjs$ {
        root /opt/flutter3d-lti;
        rewrite ^/app/(.*)$ /app/$1 break;
        types { }
        default_type text/javascript;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass         http://127.0.0.1:8798;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_hide_header  X-Frame-Options;
    }

    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_types      text/css application/javascript text/javascript application/json
                    image/svg+xml;
}
