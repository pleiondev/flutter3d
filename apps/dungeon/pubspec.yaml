name: dungeon
description: "A first-person action game in a dungeon, built on flutter3d."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # The backend. Named here on purpose: this is the one line an application
  # changes to run on a different graphics API.
  flutter3d_impeller:
    path: ../../packages/flutter3d_impeller

  # The browser backend. Which of the two runs is decided at compile time by
  # `lib/src/backend.dart`.
  flutter3d_webgl:
    path: ../../packages/flutter3d_webgl

  # Rendering.
  flutter3d:
    path: ../../packages/flutter3d
  flutter3d_particles:
    path: ../../packages/flutter3d_particles

  # Sound. Depends on neither the renderer nor the game engine.
  flutter3d_audio:
    path: ../../packages/flutter3d_audio

  # Simulation and input.
  flutter3d_game:
    path: ../../packages/flutter3d_game

  # The genre: monsters, weapons, the inventory, the step order and the weapon
  # view model. This app is one shooter; the engine packages above are not.
  flutter3d_shooter:
    path: ../../packages/flutter3d_shooter

  # Where the two meet: level geometry to mesh nodes, an actor to its visual,
  # a weapon to a view model. What is left in this app is the content those
  # take as arguments.
  flutter3d_bridge:
    path: ../../packages/flutter3d_bridge

  # Settings, volumes and rebinding — the screens that are not the game. The
  # crypt had none of them: no volumes, no bindings a player could move, nothing.
  flutter3d_ui:
    path: ../../packages/flutter3d_ui

  # The controller. Only for the button names this game says out loud; the
  # translation lives in `flutter3d_game`.
  gamepad:
    path: ../../packages/gamepad

  # The surface a frame reaches Flutter through, and the run being played —
  # the part that is neither the simulation nor the screens. See its README for
  # why it cannot live in either of its two neighbours.
  flutter3d_session:
    path: ../../packages/flutter3d_session

  vector_math: ^2.2.0
  # State management — see the note in `packages/flutter3d_ui/pubspec.yaml`.
  # What goes through it is the screen: loading, pause, settings, the run's
  # state and what the HUD shows. What does **not** is the sixty-hertz step,
  # the camera, the particles and the scene; a state object per simulation step
  # is an allocation and a rebuild sixty times a second, and keeping the
  # renderer's frame rate out of the fixed step is the whole point of
  # `GameSimulation`.
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # A renderer with no GPU under it, so a test can load a level the way the game
  # does. `LevelLoader` needs a device and does not need a window.
  flutter3d_cpu:
    path: ../../packages/flutter3d_cpu
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/levels/
    - assets/textures/
    - assets/models/
    - assets/sounds/
