name: flutter3d_demo_reef
description: "Wreck Reef: a diver on the physics core — a reef and a sunken ship under a sea lit through its own surface, air that runs out faster the deeper you go, a current, and finds lifted to the boat by bags of air that swell as they rise."
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # The renderer, and what every application repeats over it: the device
  # `openDevice` picks, the frame surface and clock.
  flutter3d: ^1.0.0-rc.1
  flutter3d_app: ^1.0.0-rc.1

  # Everything that moves: the diver, the bags, the finds, the boat and
  # the sea with its current.
  flutter3d_physics_native: ^1.0.0-rc.1

  # The standard atmosphere the depth gauge reads in.
  flutter3d_physics: ^1.0.0-rc.1

  # The loop the world is stepped by: a fixed step at the world's rate,
  # phase by phase, and the frame after it.
  flutter3d_sim: ^1.0.0-rc.1

  # The sea's surface seen from below, the floor lit through it, and what
  # they sound like.
  flutter3d_effects: ^1.0.0-rc.1
  # The elements' simulation the effects draw: the bodies, waters and
  # fires stepped, and their events.
  flutter3d_elements: ^1.0.0-rc.1

  # The voices the bubbles and the splashes are played through.
  flutter3d_audio: ^1.0.0-rc.1

  # The run file a played run is written into: `DemoRecording`, which
  # takes the loop's journal and each step's event digest with the input.
  flutter3d_game: ^1.0.0-rc.1

  vector_math: ^2.2.0

  # The game parts other games use too (`tasks/1.0-addons.md`).
  flutter3d_game_kit:
    path: ../../packages/flutter3d_game_kit
  flutter3d_game_ui:
    path: ../../packages/flutter3d_game_ui

  # The plugin contract: the loop's phases, the bus and the host.
  flutter3d_plugin_api:
    path: ../../packages/flutter3d_plugin_api

  # What a world is made of: its properties, the materials and the constants.
  flutter3d_matter:
    path: ../../packages/flutter3d_matter

  # The foundation's value types and their crossings into `vector_math`.
  flutter3d_foundation:
    path: ../../packages/flutter3d_foundation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # The ship, the diver, the finds, the rocks and the floor's pictures:
  # whose they are is `assets/CREDITS.md`, and how they were made from what
  # was published is `tool/prepare_models.py`.
  assets:
    - assets/models/
    - assets/textures/
