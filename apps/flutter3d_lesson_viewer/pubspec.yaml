name: flutter3d_lesson_viewer
description: "A read-only player for an edu-00 lesson document: no walking body, no authoring — a camera stepped through an edu_sequence."
publish_to: 'none'
version: 0.1.0
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # The backend chooser with its software fallback — see `lib/src/backend.dart`.
  flutter3d_app:
    path: ../../packages/flutter3d_app

  flutter3d:
    path: ../../packages/flutter3d
  flutter3d_sim:
    path: ../../packages/flutter3d_sim

  # `orderedSteps` — resolving an `edu_sequence.steps` name list to the
  # `edu_step` entities themselves: the lesson half of the education
  # package, not the editor, which a viewer has no use for.
  flutter3d_education:
    path: ../../packages/flutter3d_education

  # `LessonPlayer` and `applyLessonStepTo`: the one player of a lesson, for
  # a flat camera here as for a rig's stage in a holder.
  flutter3d_stereo:
    path: ../../packages/flutter3d_stereo

  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # A renderer with no GPU under it, so a test can load a level and pump a
  # widget the way the app does, without a window.
  flutter3d_cpu:
    path: ../../packages/flutter3d_cpu

  flutter_lints: ^6.0.0

  flutter3d_samples: any

  # The foundation's value types and their crossings into `vector_math`.
  flutter3d_foundation:
    path: ../../packages/flutter3d_foundation
flutter:
  uses-material-design: true

  assets:
    - assets/levels/
