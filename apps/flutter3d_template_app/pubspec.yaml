name: flutter3d_template_app
description: "The application a new project starts as: a level you can walk around."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # One backend: a project made from a template is a desktop project until
  # somebody decides otherwise. See `lib/src/backend.dart`.
  flutter3d_impeller:
    path: ../../packages/flutter3d_impeller

  flutter3d:
    path: ../../packages/flutter3d

  # The document, the input and the level format.
  flutter3d_game:
    path: ../../packages/flutter3d_game

  # A level document to mesh nodes and lights.
  flutter3d_bridge:
    path: ../../packages/flutter3d_bridge

  # The surface a frame reaches Flutter through.
  flutter3d_session:
    path: ../../packages/flutter3d_session

  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# **No `macos/` here on purpose.** This application exists to be analysed and to
# be copied; it is `flutter create --platforms=macos .` in the project it is
# copied into that gives it a window. Thirty files of platform tree per
# template, for an application nobody in this repository runs, is cost with no
# coverage.
flutter:
  uses-material-design: true

  assets:
    - assets/levels/
    - assets/models/
