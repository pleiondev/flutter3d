name: flutter3d_demo_hollow
description: "Cobble Hollow: a stone-age valley on the physics core — a car on stone wheels, a long-necked crane, a river over a waterfall into a lagoon, and a volcano that sets the village alight."
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # The renderer, and what every application repeats over it: the device
  # `openDevice` picks, the frame surface and clock.
  flutter3d: ^1.0.0-rc.1
  flutter3d_app: ^1.0.0-rc.1

  # Everything that moves: the car, the crane, the stones, the river, the
  # lava and the fires.
  flutter3d_physics_native: ^1.0.0-rc.1

  # The loop the world is stepped by: a fixed step at the world's rate,
  # phase by phase, and the frame after it.
  flutter3d_sim: ^1.0.0-rc.1

  # The river, the lava and the fires, drawn, and what they sound like.
  flutter3d_effects: ^1.0.0-rc.1
  # The elements' simulation the effects draw: the bodies, waters and
  # fires stepped, and their events.
  flutter3d_elements: ^1.0.0-rc.1

  # The voices the fires, the falls and the splashes are played through.
  flutter3d_audio: ^1.0.0-rc.1

  # The run file a played run is written into: `DemoRecording`, which
  # takes the loop's journal and each step's event digest with the input.
  flutter3d_game: ^1.0.0-rc.1

  vector_math: ^2.2.0

  # The game parts other games use too (`tasks/1.0-addons.md`).
  flutter3d_game_ui:
    path: ../../packages/flutter3d_game_ui

  # The plugin contract: the loop's phases, the bus and the host.
  flutter3d_plugin_api:
    path: ../../packages/flutter3d_plugin_api

  # The foundation's value types and their crossings into `vector_math`.
  flutter3d_foundation:
    path: ../../packages/flutter3d_foundation

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Read and written by `tool/bake_ground.dart`, which lays the ground's
  # covers out into one picture; the application itself never decodes with it.
  image: ^4.10.1

flutter:
  # The ground baked by `tool/bake_ground.dart`, the photographs the huts,
  # the car and the stones are covered in, and the models of the pines, the
  # rocks and the crane's beast. Where each came from is in
  # `assets/CREDITS.md`.
  assets:
    - assets/textures/
    - assets/models/
