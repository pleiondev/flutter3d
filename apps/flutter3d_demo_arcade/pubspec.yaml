name: flutter3d_demo_arcade
description: "A ship, a yard, and five bridges doing real work at once."
publish_to: none
version: 0.7.0
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter3d: ^1.0.0-rc.1
  flutter3d_app: ^1.0.0-rc.1
  flame_flutter3d: ^1.0.0-rc.1
  flutter3d_sim: ^1.0.0-rc.1
  flutter3d_physics: ^1.0.0-rc.1
  # The physics core the ship is stepped by: C built by its hook for each
  # target, WebAssembly in the browser. `FLUTTER3D_PHYSICS=dart` at build
  # time steps it with flutter3d_physics' reference instead.
  flutter3d_physics_native: ^1.0.0-rc.1

  # The meteors' fires: flames, smoke and embers read off the core's heat,
  # and the crates charring as they burn.
  flutter3d_effects: ^1.0.0-rc.1
  # The elements' simulation the effects draw: the bodies, waters and
  # fires stepped, and their events.
  flutter3d_elements: ^1.0.0-rc.1

  # `Bindings`, the same table `DesktopInput`/`PadInput` write into — see
  # `FlameInputBridge`'s own doc comment for why this app reuses it rather
  # than inventing a second input model.
  flutter3d_game: ^1.0.0-rc.1

  flame: ^1.38.2
  vector_math: ^2.2.0

  # The game parts other games use too (`tasks/1.0-addons.md`).
  flutter3d_game_ui:
    path: ../../packages/flutter3d_game_ui

  # What a world is made of: its properties, the materials and the constants.
  flutter3d_matter:
    path: ../../packages/flutter3d_matter

  # The foundation's value types and their crossings into `vector_math`.
  flutter3d_foundation:
    path: ../../packages/flutter3d_foundation

dev_dependencies:
  flutter_test:
    sdk: flutter

  # A device with no GPU behind it, for the frame test.
  flutter3d_cpu: ^1.0.0-rc.1
  flutter_lints: ^6.0.0

  # `creditGaps`, which reads the models folder against the credits.
  flutter3d_demo_content:
    path: ../../packages/flutter3d_demo_content

flutter:
  uses-material-design: true
  assets:
    - assets/models/
