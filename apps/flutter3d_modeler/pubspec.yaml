name: flutter3d_modeler
description: "A modeller for flutter3d: open a model, edit its mesh and materials, export what a game can load."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The state a screen rebuilds on, kept out of the frame loop — see
  # lib/src/modeler_cubit.dart. Same version the level editor and the demos use.
  flutter_bloc: ^9.1.1

  # The backend chooser with its software fallback, so this application says
  # `openDevice()` rather than naming Impeller or WebGL. A modeller that named
  # one would be a modeller that does not open in a browser, and the browser is
  # a platform of the first version rather than a later one.
  flutter3d_app:
    path: ../../packages/flutter3d_app

  # The renderer, the scene graph and the camera the viewport orbits.
  flutter3d:
    path: ../../packages/flutter3d

  # `MeshData` and the shape generators a new object starts as.
  flutter3d_geometry:
    path: ../../packages/flutter3d_geometry

  # Reading a model: `decodeModel`, `ModelDocument`, and the glTF/OBJ/`.f3d`
  # decoders behind it.
  flutter3d_formats:
    path: ../../packages/flutter3d_formats

  # The mesh being edited, with the topology still in it.
  # The document: a project of objects, the commands that change one, and the
  # history that takes them back.
  flutter3d_model_core:
    path: ../../packages/flutter3d_model_core

  flutter3d_mesh:
    path: ../../packages/flutter3d_mesh

  # The same editor over a local HTTP socket — `mcp-13n`'s `--mcp-port`.
  flutter3d_model_mcp:
    path: ../../packages/flutter3d_model_mcp

  # `CollisionShape`, for drawing what a played-back simulation collides
  # against — `pro-sim-04`.
  flutter3d_physics:
    path: ../../packages/flutter3d_physics

  # `ClothObstacle`, the position+shape pair `pro-sim-01`'s solver collides
  # a cloth against — reused, not reimplemented, for the same overlay.
  flutter3d_cloth:
    path: ../../packages/flutter3d_cloth

  # The surface a frame reaches Flutter through, and the frame clock with it.
  flutter3d_session:
    path: ../../packages/flutter3d_session

  # The Khronos models, so `--dart-define=model=` names a file that is in the
  # bundle on every platform this is measured on. **For phase 0 and not
  # after**: once a model is opened from disk and from a browser's file picker
  # (`ui-14` of the plan), a modeller that shipped four megabytes of test
  # fixtures would be shipping somebody else's models to every user. The
  # measurements need the same mesh on a laptop, in Chrome and on a handset,
  # and a define pointing at a bundled asset is the only way to get one there.
  flutter3d_samples:
    path: ../../packages/flutter3d_samples

  vector_math: ^2.2.0

  # The native half of opening and saving a file. The web half is
  # `package:web` below — see `lib/src/files/project_files.dart` for why the
  # two are a conditional export rather than a `kIsWeb` branch.
  file_selector: ^1.1.0

  # `ui-31n`'s own desktop half: a window that already has a file dragged onto
  # it, from the OS rather than from a picker. There is no ten-line answer
  # here the way there is for the web's `dragover`/`drop` — a native channel
  # needs a platform-side registration this package already carries.
  desktop_drop: ^0.8.4

  # The browser's own file input and download anchor, which is all the web half
  # needs. A plugin would be a dependency whose web implementation is these same
  # ten lines.
  web: ^1.1.0

  # Where a sandboxed process may write without asking: the container the
  # autosave lives in. Used by `sandbox_probe.dart`.
  path_provider: ^2.1.4

  # `BinaryStorage`/`defaultBinaryStorage`, autosave's own read/write: a
  # model project is binary and can be megabytes, past what `Storage`'s
  # `localStorage` backing allows on the web.
  flutter3d_screens:
    path: ../../packages/flutter3d_screens

  # `clock.now()` rather than `DateTime.now()` in `AutosaveController`, so
  # `autosaving_test.dart` can drive it through `FakeAsync` at test speed —
  # `FakeAsync` overrides this package's clock and nothing reads
  # `DateTime.now()` directly.
  clock: ^1.1.1

  # Opening the tutorial link (`ui-32n`) in the system browser. Unlike the
  # file picker above, "open this URL" has no honest ten-line native answer —
  # every desktop platform has its own way to hand a link to a browser — so
  # this is the one place a real plugin buys more than it costs.
  url_launcher: ^6.3.0

  # `AppLocalizations`'s own delegates (`GlobalMaterialLocalizations` and
  # friends) — `ui-22`'s own русский/английский, so the framework's stock
  # widgets (a date picker this app does not have yet, a text field's own
  # context menu) read in the same language the panels around them do.
  flutter_localizations:
    sdk: flutter

  # The generated `AppLocalizations`'s own runtime — plural rules for
  # `_offerRecovery`'s own object count and `_askAnyway`'s own "N more" —
  # pinned to what `flutter_localizations` itself already resolves to on
  # this SDK, so `flutter pub get` never has two answers for one package.
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Real-device e2e: `integration_test/`, driven on an actual macOS window
  # rather than the headless harness every other test here uses — the one
  # place a layout claim is checked against the real platform rather than a
  # `TestWidgetsFlutterBinding`-simulated one.
  integration_test:
    sdk: flutter

  # A renderer with no GPU under it, so the tests draw the real frame the way
  # the application draws it. Everything this repository knows about testing a
  # picture goes through here.
  flutter3d_cpu:
    path: ../../packages/flutter3d_cpu

  flutter3d_testing:
    path: ../../packages/flutter3d_testing

  # `FakeBackend`, for `material_studio_environment_test.dart`: a device that
  # records every `releaseTexture` call, so the studio's "give the old
  # environment back on preset switch" rule is checked directly rather than
  # inferred from a picture.
  flutter3d_hardware:
    path: ../../packages/flutter3d_hardware

  # `FakeAsync`, for `autosaving_test.dart`: a real `Timer` and `clock.now()`
  # in `AutosaveController`, driven at test speed rather than a wall clock.
  fake_async: ^1.3.0

  # `profile_editing_test.dart` runs under plain `dart test`: nothing in
  # `profile_editing.dart` itself names Flutter, and a `flutter_test` import
  # for a file that needs none of it would be the dependency the rest of
  # this file's own doc comment argues against.
  test: ^1.25.0

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # `ui-22`: build `AppLocalizations` from `l10n.yaml` and `lib/l10n/*.arb`
  # on every `flutter pub get`, rather than a generated file committed and
  # left to drift from the templates the moment somebody edits an `.arb`
  # by hand and forgets to re-run the generator.
  generate: true
