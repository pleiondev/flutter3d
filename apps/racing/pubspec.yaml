name: racing
description: "An arcade racer: one circuit, a car that can be made to slide, and a lap time to beat."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The backend. Named here on purpose: this is the one line an application
  # changes to run on a different graphics API.
  # Picks Impeller or WebGL at compile time, and holds the `openDevice` the
  # three games had a copy of each. See flutter3d_backend.
  flutter3d_backend:
    path: ../../packages/flutter3d_backend

  flutter3d_impeller:
    path: ../../packages/flutter3d_impeller

  # The browser backend. Which of the two runs is decided at compile time by
  # `lib/src/backend.dart`.
  flutter3d_webgl:
    path: ../../packages/flutter3d_webgl

  flutter3d:
    path: ../../packages/flutter3d

  # Simulation and input.
  flutter3d_game:
    path: ../../packages/flutter3d_game

  # The genre. Cars, tracks, laps — none of which the two above have heard of.
  flutter3d_game_racing:
    path: ../../packages/flutter3d_game_racing

  # Sound. Depends on neither the renderer nor the game engine.
  flutter3d_audio:
    path: ../../packages/flutter3d_audio

  # Where the two meet: level geometry to mesh nodes, a fixture to its light.
  flutter3d_bridge:
    path: ../../packages/flutter3d_bridge

  # Settings, volumes, rebinding, credits and where a run is kept.
  flutter3d_ui:
    path: ../../packages/flutter3d_ui

  # The controller. Only for the names of the buttons this game says out loud —
  # the translation lives in `flutter3d_game`, which already depends on it.
  pad_input:
    path: ../../packages/pad_input

  # What a locked wheel and a car off the road throw into the air. This game
  # had no particles at all until it had smoke.
  flutter3d_particles:
    path: ../../packages/flutter3d_particles

  # The world a car stands in. Named by `staging.dart`, which is the one place
  # this game assembles a race.
  flutter3d_physics:
    path: ../../packages/flutter3d_physics

  # State management — see the note in `packages/flutter3d_ui/pubspec.yaml`.

  # The surface a frame reaches Flutter through, and the run being played —
  # the part that is neither the simulation nor the screens. See its README for
  # why it cannot live in either of its two neighbours.
  flutter3d_session:
    path: ../../packages/flutter3d_session

  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Only the tests use it, and only to draw a frame without a GPU. The
  # platformer shipped three bugs that every simulation test passed and a single
  # rendered frame would have caught.
  flutter3d_cpu:
    path: ../../packages/flutter3d_cpu

# Two traps this repository has paid for before, one of them already sprung
# here: `FLTEnableFlutterGPU` and `FLTEnableImpeller` have to be in the macOS
# `Info.plist` or the window comes up empty — they are; and when sound is added,
# run `flutter clean` afterwards, or SoLoud reports "no available native assets"
# once and then plays nothing for the rest of the session.

flutter:
  uses-material-design: true

  assets:
    - assets/tracks/
    - assets/models/
    - assets/sounds/
