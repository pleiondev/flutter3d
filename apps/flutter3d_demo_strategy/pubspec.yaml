name: flutter3d_demo_strategy
description: "A crowd on a hillside: the fourth genre, drawn."
publish_to: none
version: 0.5.1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter3d: ^0.5.0
  flutter3d_app: ^0.5.0
  flutter3d_backend: ^0.5.1
  flutter3d_game: ^0.5.0
  flutter3d_game_strategy: ^0.5.1

  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # A device with no GPU behind it, for the frame test.
  flutter3d_cpu: ^0.5.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The map: a level document with the hillside in it, written by
  # `tool/make_map.py`. The whole directory rather than the one file, because a
  # second map is a second file and not a second line here.
  assets:
    - assets/levels/
