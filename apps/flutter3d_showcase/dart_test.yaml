# **A test that runs longer than a minute is a bug until proven otherwise.**
# The proof is a `timeout:` on the test or a `@Timeout` on its file, with
# the reason and the measured time beside it, listed in `slowTestsAllowed`
# in tool/structure/repository.dart; the structure rule "a test runs in a
# minute unless its reason is listed" fails on one that is not.
#
# `testWidgets` hands every test a ten-minute timeout of its own, which
# would win over this one; test/flutter_test_config.dart turns that into
# a factor of one, so a widget test gets this minute too.
timeout: 1m

tags:
  # A test that draws real pixels: a reference picture held against a
  # committed PNG, or a page rendered on the software rasteriser. Skipped by
  # `very_good test -x golden` for a quick run, and by CI as well since
  # 2026-09-22 — `tool/ci.sh` says why at its `GOLDEN_EXCLUDE` line. These
  # pages were passing; they are off because the tag is one switch and the
  # modeller's screenshots are what it was thrown for.
  golden:

  # Tests that touch `dart:js_interop` or draw cannot be rewritten by
  # very_good's test optimizer into one file.
  skip_very_good_optimization:
