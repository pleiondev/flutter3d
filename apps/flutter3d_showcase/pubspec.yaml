name: flutter3d_showcase
description: "Every capability of the flutter3d engine on a page of its own, with the version it appeared in and a step-by-step guide."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # The backend chooser with its software fallback: this application says
  # `openDevice()` rather than naming Impeller or WebGL, so the same code opens
  # on macOS and in a browser.
  flutter3d_app:
    path: ../../packages/flutter3d_app

  flutter3d:
    path: ../../packages/flutter3d
  flutter3d_core:
    path: ../../packages/flutter3d_core
  flutter3d_hardware:
    path: ../../packages/flutter3d_hardware

  # What the pages show. They are listed here, all of them, so that a page
  # added later never has to edit this file: the pages are written in parallel
  # and a pubspec is the one file they would all conflict on.
  flutter3d_audio:
    path: ../../packages/flutter3d_audio
  flutter3d_mesh:
    path: ../../packages/flutter3d_mesh
  flutter3d_particles:
    path: ../../packages/flutter3d_particles
  flutter3d_physics:
    path: ../../packages/flutter3d_physics
  # The physics core the crates fall in: C built by its hook for each target,
  # WebAssembly in the browser.
  flutter3d_physics_native:
    path: ../../packages/flutter3d_physics_native
  # The camera rig and the photo-mode camera the camera pages fly.
  flutter3d_camera:
    path: ../../packages/flutter3d_camera
  # The heat and fire page's flames, smoke and firelight.
  flutter3d_effects:
    path: ../../packages/flutter3d_effects
  # The elements' simulation the effects draw: the bodies, waters and
  # fires stepped, and their events.
  flutter3d_elements:
    path: ../../packages/flutter3d_elements
  flutter3d_samples:
    path: ../../packages/flutter3d_samples
  flutter3d_sim:
    path: ../../packages/flutter3d_sim
  flutter3d_stereo:
    path: ../../packages/flutter3d_stereo
  flutter3d_voxel:
    path: ../../packages/flutter3d_voxel
  # Rollback for parties of more than two; pure Dart, with no dependencies.
  flame_multiplayer:
    path: ../../packages/flame_multiplayer
  # The software device: a page that compiles a material source on it at run
  # time names its shader library. Pure Dart, so the web build carries it too.
  flutter3d_cpu:
    path: ../../packages/flutter3d_cpu

  # The Flame bridge's own pages: a mechanism each, alongside every other
  # capability.
  flame: ^1.38.2
  flame_flutter3d:
    path: ../../packages/flame_flutter3d
  flutter3d_game:
    path: ../../packages/flutter3d_game

  vector_math: ^2.2.0

  # The links from a page to its guide on the documentation site.
  url_launcher: ^6.3.0

  # What a world is made of: its properties, the materials and the constants.
  flutter3d_matter:
    path: ../../packages/flutter3d_matter

  # The foundation's value types and their crossings into `vector_math`.
  flutter3d_foundation:
    path: ../../packages/flutter3d_foundation

  # The plugin contract: the loop's phases, the bus and the host.
  flutter3d_plugin_api:
    path: ../../packages/flutter3d_plugin_api

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # **A directory is not searched below itself**, so each category of pages is
  # named here. What is in one is the page (`.dart`, run in the viewport and
  # shown in the Source tab) and its guide (`.md`, the Step by step tab), which
  # sit side by side so that neither can be added without the other.
  assets:
    - lib/pages/shading/
    - lib/pages/environment/
    - lib/pages/shadows/
    - lib/pages/post/
    - lib/pages/scene/
    - lib/pages/animation/
    - lib/pages/view_input/
    - lib/pages/formats/
    - lib/pages/backends/
    - lib/pages/physics_particles/
    - lib/pages/sim_audio_xr/
    - lib/pages/widgets_misc/
    - lib/pages/flame/

  # `Menlo`/`Consolas` are OS fonts CanvasKit has no way to find on the web,
  # where every code block and inline span in a guide fell back silently to
  # the app's ordinary proportional font. Bundled once here, `RobotoMono`
  # renders the same on every platform this app ships to.
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
