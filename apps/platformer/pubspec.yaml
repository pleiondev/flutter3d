name: platformer
description: "A third-person platformer: run, jump twice, dash, and do not fall in."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The backends. Named here on purpose: which one runs is decided by
  # `lib/src/backend.dart`, a conditional import, and these two lines are the
  # whole of the difference between a desktop build and a web one.
  flutter3d_impeller:
    path: ../../packages/flutter3d_impeller

  flutter3d_webgl:
    path: ../../packages/flutter3d_webgl

  flutter3d:
    path: ../../packages/flutter3d

  # Simulation and input.
  flutter3d_game:
    path: ../../packages/flutter3d_game

  # The genre. The whole of the game's own vocabulary is here and none of it is
  # in the two above, which is the point stage 5 was making.
  flutter3d_game_platformer:
    path: ../../packages/flutter3d_game_platformer

  # Sound. Depends on neither the renderer nor the game engine.
  flutter3d_audio:
    path: ../../packages/flutter3d_audio

  # Where the two meet: level geometry to mesh nodes, a fixture to its look.
  flutter3d_bridge:
    path: ../../packages/flutter3d_bridge

  # Dust, sparks and the flame on a lamp. One pool, one draw call.
  flutter3d_particles:
    path: ../../packages/flutter3d_particles

  # Settings, volumes and rebinding — the screens that are not the game.
  flutter3d_ui:
    path: ../../packages/flutter3d_ui

  # The controller. Only for the two names on the pad this game says out loud —
  # the translation lives in `flutter3d_game`, which already depends on it.
  pad_input:
    path: ../../packages/pad_input

  # The surface a frame reaches Flutter through, and the run being played —
  # the part that is neither the simulation nor the screens. See its README for
  # why it cannot live in either of its two neighbours.
  flutter3d_session:
    path: ../../packages/flutter3d_session

  vector_math: ^2.2.0
  # State management — see the note in `packages/flutter3d_ui/pubspec.yaml`.
  # What goes through it is the screen: loading, pause, settings, the run's
  # state and what the HUD shows. What does **not** is the sixty-hertz step,
  # the camera, the particles and the scene; a state object per simulation step
  # is an allocation and a rebuild sixty times a second, and keeping the
  # renderer's frame rate out of the fixed step is the whole point of
  # `GameSimulation`.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Only the tests use it, and only to draw a frame without a GPU. Three bugs
  # shipped that every simulation test passed and a single rendered frame would
  # have caught — see `test/frame_test.dart`.
  flutter3d_cpu:
    path: ../../packages/flutter3d_cpu

flutter:
  uses-material-design: true

  assets:
    - assets/levels/
    - assets/sounds/
    - assets/models/
    - assets/textures/
