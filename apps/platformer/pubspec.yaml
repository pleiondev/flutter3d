name: platformer
description: "A third-person platformer: run, jump twice, dash, and do not fall in."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The backend. Named here on purpose: this is the one line an application
  # changes to run on a different graphics API.
  flutter3d_impeller:
    path: ../../packages/flutter3d_impeller

  flutter3d:
    path: ../../packages/flutter3d

  # Simulation and input.
  flutter3d_game:
    path: ../../packages/flutter3d_game

  # The genre. The whole of the game's own vocabulary is here and none of it is
  # in the two above, which is the point stage 5 was making.
  flutter3d_platformer:
    path: ../../packages/flutter3d_platformer

  # Sound. Depends on neither the renderer nor the game engine.
  flutter3d_audio:
    path: ../../packages/flutter3d_audio

  # Where the two meet: level geometry to mesh nodes, a fixture to its look.
  flutter3d_bridge:
    path: ../../packages/flutter3d_bridge

  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Only the tests use it, and only to draw a frame without a GPU. Three bugs
  # shipped that every simulation test passed and a single rendered frame would
  # have caught — see `test/frame_test.dart`.
  flutter3d_cpu:
    path: ../../packages/flutter3d_cpu

flutter:
  uses-material-design: true

  assets:
    - assets/levels/
    - assets/sounds/
    - assets/models/
    - assets/textures/
