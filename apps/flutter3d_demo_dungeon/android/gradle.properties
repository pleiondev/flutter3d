org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# **Five tries at a repository, not one.** Maven Central answered 403 Forbidden
# to the four Android legs of one CI run at once — they start together, ask for
# the same transitive metadata of the Android Gradle plugin, and arrive from one
# address range. Three of the four had already got theirs; `strategy` had not,
# and the build was over forty seconds later. Flutter's own retry waits 100ms
# and asks again, which is not a wait that outlives throttling.
#
# These are Gradle's own numbers for the same problem: five attempts, the first
# pause a second and each one after that longer. A run that would have failed
# now takes a few seconds more and succeeds, and one where the repository is
# genuinely down still ends rather than hanging.
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=1000
