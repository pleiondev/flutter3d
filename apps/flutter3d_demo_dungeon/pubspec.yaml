name: flutter3d_demo_dungeon
description: "A first-person action game in a dungeon, built on flutter3d."
publish_to: 'none'
version: 0.4.0+1
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # The assembly layer: which device to open (Impeller, WebGL, or the software
  # fallback), the frame surface and run lifecycle, settings/rebinding/saves,
  # and the gamepad. A barrel over five packages that do not know about each
  # other; see flutter3d_app for why they are not listed here individually.
  flutter3d_app:
    path: ../../packages/flutter3d_app

  # The gamepad's buttons, which the key map names directly.
  pad_input:
    path: ../../packages/pad_input

  # Rendering.
  flutter3d:
    path: ../../packages/flutter3d
  flutter3d_particles:
    path: ../../packages/flutter3d_particles

  # Sound. Depends on neither the renderer nor the game engine.
  flutter3d_audio:
    path: ../../packages/flutter3d_audio

  # Simulation and input.
  flutter3d_game:
    path: ../../packages/flutter3d_game
  flutter3d_sim:
    path: ../../packages/flutter3d_sim

  # The genre: monsters, weapons, the inventory, the step order and the weapon
  # view model. This app is one shooter; the engine packages above are not.
  flutter3d_game_shooter:
    path: ../../packages/flutter3d_game_shooter

  # This game's content rather than the genre's: the roster, the crypt's
  # elements and `stage()`, the one assembly of a run.
  flutter3d_demo_content:
    path: ../../packages/flutter3d_demo_content

  # The physics core, for the ragdolls the monsters fall as: C built by its
  # hook for each target, WebAssembly in the browser.
  flutter3d_physics_native:
    path: ../../packages/flutter3d_physics_native

  # The physics core's water and fire, drawn and heard: the torches' own
  # fires, the crates they light, and the flooded vault of the first crypt.
  # A layer over the run that reads it and never writes to it.
  flutter3d_effects:
    path: ../../packages/flutter3d_effects

  vector_math: ^2.2.0
  # State management — see the note in `packages/flutter3d_game/pubspec.yaml`.
  # What goes through it is the screen: loading, pause, settings, the run's
  # state and what the HUD shows. What does **not** is the sixty-hertz step,
  # the camera, the particles and the scene; a state object per simulation step
  # is an allocation and a rebuild sixty times a second, and keeping the
  # renderer's frame rate out of the fixed step is the whole point of
  # `GameSimulation`.
  flutter_bloc: ^9.1.1

  # The game parts other games use too (`tasks/1.0-addons.md`).
  flutter3d_game_ui:
    path: ../../packages/flutter3d_game_ui
  flutter3d_game_kit:
    path: ../../packages/flutter3d_game_kit
  flutter3d_game_physics:
    path: ../../packages/flutter3d_game_physics

  # The collision world and its bodies, named here directly.
  flutter3d_physics:
    path: ../../packages/flutter3d_physics

  # The plugin contract: the loop's phases, the bus and the host.
  flutter3d_plugin_api:
    path: ../../packages/flutter3d_plugin_api

  # The audio model: the scene, its emitters and the sound bank.
  flutter3d_audio_core:
    path: ../../packages/flutter3d_audio_core

dev_dependencies:
  flutter_test:
    sdk: flutter

  # `rp-05`'s own golden half — `expectMatchesGolden`/`DigestTrace`, used by
  # `test/replay_golden_test.dart` to check a replayed frame against a
  # committed reference.
  flutter3d_testing:
    path: ../../packages/flutter3d_testing

  # The foundation's value types a test names.
  flutter3d_foundation:
    path: ../../packages/flutter3d_foundation

  # Real-device e2e — see `apps/flutter3d_demo_platformer/pubspec.yaml` for the
  # note. Carries `rp-00`'s determinism probe onto Android and iOS.
  integration_test:
    sdk: flutter

  # The host half of `flutter drive`, which is how `tool/pacing.sh` runs
  # `integration_test/pacing_test.dart` in profile mode — `flutter test` on
  # a device builds debug, and a JIT frame time is not a frame time. Already
  # in the lock through `integration_test`.
  flutter_driver:
    sdk: flutter

  # A renderer with no GPU under it, so a test can load a level the way the game
  # does. `LevelLoader` needs a device and does not need a window.
  flutter3d_cpu:
    path: ../../packages/flutter3d_cpu

  # `net-04`'s `diffRuns` — see `test/desync_diff_test.dart` for why the
  # genre-aware half of it lives here rather than in `flutter3d_net` itself.
  flutter3d_net:
    path: ../../packages/flutter3d_net


  flutter_lints: ^6.0.0

  # `ap-12`: the build hook (`hook/build.dart`) that converts
  # `assets_src/models/*.glb` into `flutter3d_generated/*.f3d` on every
  # build — `path`, the same convention every other sibling package in
  # this file uses, rather than the version constraint `flutter3d_build:init`
  # writes for a project outside this repository.
  flutter3d_build:
    path: ../../packages/flutter3d_build

  # What a world is made of: its properties, the materials and the constants.
  flutter3d_matter:
    path: ../../packages/flutter3d_matter

flutter:
  uses-material-design: true

  assets:
    - assets/levels/
    - assets/textures/
    - assets/sounds/
    # Both lines, because Flutter takes the files directly inside a listed
    # directory and none from below it. With only the first, every model the
    # hook wrote into `models/` was left out of the bundle and the crypt ran
    # without monsters, weapons, keys or an exit.
    - flutter3d_generated/
    - flutter3d_generated/models/
