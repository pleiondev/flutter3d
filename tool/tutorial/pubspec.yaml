name: tutorial
description: "tut-00's own row: tool/tutorial/shoot.dart drives the modeler over mcp-16d's ui.* tools and screenshots the result — the plumbing the six tutorial cases plug into once T3/T5 have written them, not a case itself."
publish_to: 'none'
resolution: workspace

# **Under `tool/` and not under `packages/`, deliberately** — the same reason
# `tool/skills`'s own pubspec gives: a package under `packages/` is checked
# against ARCHITECTURE.md's publishing list by `tool/structure.dart`'s "the
# publishing order names every package" rule, and this is never going out.

environment:
  sdk: ^3.12.2

dependencies:
  args: ^2.7.0

dev_dependencies:
  test: ^1.24.0
